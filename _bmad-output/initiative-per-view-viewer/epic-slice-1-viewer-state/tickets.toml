description = '''F3 slice S1, story 4 of 5. Design sections 3 (table: PreviewPanel, App, openFile.ts, previewFocus.ts), 12.1, 12.3 and 15 (story 4). PRD F3.7 VV-1 AC1, AC4, AC6, AC7, AC8; VV-8 AC9; VV-11 AC5. Contract .ade/context/viewer-state.md (the viewer store). ADR 0032 (open file per view, partly supersedes ADR 0009). Read PRD F3.7 VV-1 first.

Depends on stories s1a, s1b and s1c, and on code-viewer stories cv3 and cv5 being on main (cv5's AC4 test is rewritten here, see below).

Summary. The preview panel shows the view in sight's open file, reveal, layout and focus. Tab.previewPath and Tab.previewReveal are removed. A path:line click, the panel's path box, and the file browser's file click all set the open file of the view in sight only.

Build, each piece with its tests first:
1. src/lib/openFile.ts: handlePreviewOpen(detail, { inSightKey, openFile, openPanel }) calls viewerStore.openFile(key, path, at) for the view in sight; openFileFromTerminal and the detached-window emit path are unchanged in this story (the detached route is S3).
