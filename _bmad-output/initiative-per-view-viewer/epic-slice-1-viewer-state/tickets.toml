- src/components/__tests__/PreviewPanelFocus.test.tsx: the same helper change; its eight focus tests are otherwise unchanged.
- src/components/__tests__/PreviewPanelOpenClose.test.tsx: the file is opened with openInSight; open or closed is read from states[inSight].layout.previewOpen; usePreviewPanel() still supplies the focus request. Both tests keep their assertions.
