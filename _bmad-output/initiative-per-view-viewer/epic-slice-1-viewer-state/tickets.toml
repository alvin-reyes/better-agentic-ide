[[entry]]
id = "s1c"
type = "story"
title = "The file browser per view"
description = '''F3 slice S1, story 3 of 5. Design sections 6 (all: 6.1 roots, 6.2 non-terminal tabs, 6.3 the tree), 7.4 (the ade-file-browser mirror), 12.1, 12.3 and 15 (story 3, and build notes 5, 6, 8, 9). PRD F3.7 VV-1 AC2 and AC3, VV-2 AC1, VV-8 AC1 and AC2, VV-9 AC4 (S1 part), VV-11 AC1 to AC4. Contract .ade/context/viewer-state.md (file browser tree). ADR 0031.

Depends on stories s1a and s1b (VV-11 AC4's restart uses the saved session of s1b).

Summary. The file browser shows the view in sight: its root, its expanded folders and its listings, lazily and boundedly; a non-terminal tab's root follows its own folder, then its opener's, then home; the ade-file-browser mirror is written from the view in sight. Criterion VV-1 AC6 (the preview panel's layout) is story s1d's. This story makes the browser half of layout write to the view's layout, because the mirror needs it (design build note 5).

Build, each piece with its tests first:
1. src/lib/paneFolder.ts (new): readPaneFolder(paneId) is the only reader of a pane's folder. It calls getPtyCwd and writes usePaneCwd.cwds[paneId], and drops any result that is older than the latest request for that pane. Tests mock getPtyCwd (from src/hooks/useTerminal) and keep readPaneFolder real.
2. src/lib/viewerRoot.ts (new): terminalRoot(view) = usePaneCwd.cwds[view.activePaneId] ?? pane.savedCwd ?? pane.initialCwd ?? null (synchronous). nonTerminalRoot(tab, state) is asynchronous (design 6.2): own folder (editor: invoke("project_root", { path: dirname(file) }); contracts: contractsRoot; orchestrator, fleet and browser: none in S1), else opener, else homeDir() from @tauri-apps/api/path. A candidate counts only if invoke("list_directory", { path }) resolves. The check repeats each time the tab is shown. Its result is applied only if its token is the latest and its key is still in sight (token guard, 6.2). A non-terminal source tab's resolved root is written to viewerStore.resolvedRoots by the file browser when it resolves.
3. src/App.tsx: readPaneFolder(activePaneId) is called at once whenever the view in sight or its active pane changes (6.1). TerminalPane keeps its 3-second poll, now through readPaneFolder. FileBrowser loses its own 3-second poll and reads usePaneCwd's entry for the active pane of the view in sight. Hidden views are not polled.
4. src/stores/fileBrowserStore.ts: the state becomes { gen, viewerKey, roots, listings, showHidden } (design 6.3). roots is a list; in this story every caller passes exactly one root, and the roots are derived at show time, never stored. show(key, roots): a different key bumps gen, sets listings to {}, and clears the queue of listing requests not yet started; the same key with other roots keeps gen, drops every listing, queued request and in-flight result that is not under a current root, and keeps the listings under a root that stays. request(path) enqueues one listing. refreshListings() re-lists every folder that has a listing, under the current gen. loadDirectory(path) rejects on error; its only caller is the queue, which maps a rejection to listings[path] = "error", renders an expanded folder with no children, and removes nothing from the expanded set. At most 4 list_directory calls are in flight. Every result is tagged with its gen and dropped if the gen is old. setRootPath, expandNode, collapseNode and refreshTree are deleted, so tsc finds every caller: setRootPath becomes show(key, roots) (App on a view change; FileBrowser on a root change), expandNode becomes viewerStore.expand plus request when the folder has no listing, collapseNode becomes viewerStore.collapse, and refreshTree becomes refreshListings(), which the watch_directory handler (FileBrowser.tsx, around line 196) and the toolbar Refresh button (FileBrowser.tsx, around line 321) both call.
5. Pruning (design 6.3): when a listing of folder P succeeds under the current gen, viewerStore.pruneMissing(key, P, childFolders) removes each expanded path that is a direct child of P and not a folder in that listing, and every expanded path below it. Nothing is shown.
6. src/components/FileBrowser.tsx: shows the view in sight (root by viewerRoot, expansion from the view's expanded set, rows expanded exactly when their path is in states[viewerKey].expanded; children from listings; a missing listing of an expanded row is requested). The watcher is one watch_directory per root, started and stopped by show. Its 500 ms debounce and its refreshListings call stay as today.
7. The browser half of layout: ⌘B and the browser's edge drag write layout.browserOpen and layout.browserWidth of the view in sight through viewerStore.setLayout. Width clamped to 180 to 500. The preview half is story s1d.
8. src/lib/viewerPersist.ts (story s1b) and the mirror (design 7.4): the main window's view in sight's layout.browserOpen and layout.browserWidth are compared with the last values written. When either differs (⌘B, the drag, the palette, or a view or tab switch that shows a different state), ade-file-browser is written by read-modify-write, keeping showHidden. A switch to the same values writes nothing. setShowHidden writes showHidden alone, by the same read-modify-write. Detached windows never start this mirror (S3 is not built; DetachedApp never calls startViewerPersistence).
9. Non-terminal opener (owner's Q1, 2026-11-10; design 5.1 and 6.2). A tab created from a seed records its opener at creation: a terminal source gives its terminalRoot; a non-terminal source gives resolvedRoots[sourceKey] of this run, or null when there is none (a restored source not yet shown); no seed gives null. The opener never changes after creation.
10. The documentation change in .ade/context/terminal-open.md, at line 346 (the sentence "The file browser and the palette's BMAD switch and 'Set up project' follow the own view too"): it becomes "The palette's BMAD switch and 'Set up project' follow the own view too; the file browser shows the view in sight (F3, .ade/context/viewer-state.md)".

Acceptance criteria (each is one or more named tests, written first):
(1) VV-1 AC2 (S1). A view's root is its active folder: while in sight, after cd in its active pane, the browser lists the new folder within 3 seconds of ADE learning it; when a view comes into sight its root is the latest folder ADE knows for it, with no wait for a poll (the immediate fetch counts as no wait; a 3-second tick does not). Until that fetch returns the browser may show the last folder it knew for that view, never another view's root. Focusing the other pane of a split moves the root to that pane's folder. Test src/components/__tests__/perViewRoot.test.tsx, with getPtyCwd mocked as a stub the test drives and fake timers installed but not advanced: S's reported folder changes to /hub/atomic-stays/src and S's root moves there while the own view's root stays at /hub; with S not in sight its folder changes to /tmp and ⌘] shows /tmp once the stub's pending reads have resolved; the split case moves the root to the focused pane's folder.
(2) VV-1 AC3 (S1). Expanding or collapsing a folder changes only the view in sight. A folder is expanded exactly when its path is in the view's expanded set, so cd away and back shows the same folders expanded. Collapsing removes only that folder; folders expanded below it stay in the set. Re-expanding adds it back with the current time as its sequence number. Tests in src/stores/__tests__/fileBrowserTree.test.ts (and perViewRoot.test.tsx for the switch): "expanding src in S shows it expanded in S and not in the own view, after ⌘[ then ⌘]"; "in S, cd .. then cd atomic-stays shows src expanded"; "expand src and src/lib, collapse src, expand src: src/lib is expanded".
(3) VV-2 AC1 (S1). A sub-terminal created by ade open or New Sub-terminal starts with root = its terminal's starting folder, an empty expanded set, no open file, and the layout of the view it was opened from (the spawning view for ade open; the tab's view in sight for New Sub-terminal). It does not change the source. Test perViewRoot.test.tsx "ade open from the own view, browser open at 300 px, in /hub/atomic-stays, gives a view whose browser is open at 300 px listing /hub/atomic-stays, preview closed, no file"; and "ade open without focus leaves the view in sight's state untouched". (The store half of the seed is in story s1a.)
(4) VV-8 AC1 (S1). A terminal view's root always follows the terminal's actual folder: a restored view whose folder is gone lists whatever folder its shell starts in, with no error shown. A non-terminal tab whose folder is gone uses the next folder of the chain. Tests: perViewRoot.test.tsx "a restored terminal view lists its shell's folder, with no error shown"; nonTerminalRoot.test.ts "a gone folder falls to the next link of the chain".
(5) VV-8 AC2 (S1). An expanded folder that is gone is dropped from the set when its parent is next listed; nothing is shown. Tests in fileBrowserTree.test.ts: "a successful listing of the parent drops a missing expanded child and what is below it"; "a listing error removes nothing".
(6) VV-9 AC4 (S1 part). The main window keeps ade-file-browser's isOpen and width in step with the view in sight's browser, whenever either shown value changes (⌘B, a drag, the palette, or a view or tab switch that shows a different state). A switch to the same values writes nothing. Tests in src/lib/__tests__/fileBrowserMirror.test.ts: "a switch from a view with the browser open at 300 px to one closed at 240 px writes isOpen false and width 240"; "a switch between two views with the same layout writes nothing"; "a Show hidden toggle writes showHidden alone". (The detached-window half is S3.)
(7) VV-11 AC1 (S1). A non-terminal tab's browser lists the folder its type gives it. Tests in src/lib/__tests__/nonTerminalRoot.test.ts: "an editor tab for /hub/atomic-stays/src/app.ts in a repository rooted at /hub/atomic-stays lists /hub/atomic-stays"; "an editor tab for /tmp/notes/x.md (no repository) lists /tmp/notes"; "a contracts tab for /hub/atomic-stays/contracts lists that folder". (The orchestrator's project folder is S4.)
(8) VV-11 AC2 (S1), with the opener-folder change (F3.1 and VV-11 AC2 as amended on prd-per-view-viewer). A tab with no folder of its own (a browser or fleet tab), or whose folder does not exist when shown, lists its opener; if that is unknown or does not exist, the home folder. No error is shown. Tests in nonTerminalRoot.test.ts: "a browser tab opened while S in /hub/atomic-stays is in sight lists /hub/atomic-stays"; "delete that folder and show the tab again: it lists the home folder"; "a fleet tab on a fresh install with no terminal folder known lists the home folder". And the Q1 test: "a tab opened from an editor tab whose root resolved to /r/repo this run records opener /r/repo and, with no own folder, lists /r/repo; opened from a restored editor tab not yet shown it records opener null and lists home; opened from a terminal view it records that view's terminalRoot; a later change to the source's resolved root leaves the opener unchanged" (viewerStore.test.ts for the record, nonTerminalRoot.test.ts for the listing).
(9) VV-11 AC3 (S1). The root never changes because a terminal's folder changes. Test nonTerminalRoot.test.ts "cd /tmp in every terminal: the browser tab still lists /hub/atomic-stays".
(10) VV-11 AC4 (S1). The opener is saved with the session, so a restored browser or fleet tab lists the same folder. Test nonTerminalRoot.test.ts "quit and start with the browser tab opened in /hub/atomic-stays: it lists /hub/atomic-stays". This test uses the saved session written by story s1b.
(11) CONDITIONAL, F4 WS-5 AC2 (F4 S1 is not sharded; the F4 PRD is on branch prd-workspaces, docs/prd.md revision 3.1, criterion WS-5). If F4 S1 is on main when this story is reviewed (and again before merge, if it lands in between), this story builds WS-5 AC2 and replaces WS-5 AC1's tests with WS-5 AC2's test. WS-5 AC2 says: a workspace tab's own view shows the workspace's roots (WS-4); each sub-terminal shows only its own root, following its active folder (VV-1 AC2); the own view's viewer state is used as F3 defines it: its root is the own view's active folder, which F4 uses as the current root and the folder to reveal (here terminalRoot(ownView), never stored); its expanded folders are absolute paths under any root (a root's own path in the set means its row is expanded); its open file, position, layout and caps are unchanged. The roots listed come from WS-1 and the record, never from viewer state. Test, as F4 names it (F3 VV-1 AC1's fixture, as a workspace): the own view in <hub> and sub-terminal S in checkout /x/api; ⌘] shows S's single root /x/api and no other root; ⌘[ shows every workspace root with the hub's root expanded as the own view left it; after a restart the own view's expansions under two different roots are restored. The roots[] shape in item 4 is built here either way. If F4 S1 is not on main, F4 S1 carries WS-5 AC2 when it is built, and this story does not build it.
(12) Supporting tests, not criteria of their own: a rejecting list_directory never reaches an unhandledrejection event and never calls log_error (fileBrowserTree.test.ts, through show, expand, the watcher's refreshListings and the toolbar Refresh; vitest's unhandled-error check stays on); at most 4 listings are in flight; show() with a new key clears the queue (a queued request never calls list_directory); a stale-gen listing is dropped; a child whose metadata fails is pruned by the parent's listing (accepted as rare, design 6.3).

Existing tests this story changes (design 12.3, rows for story 3, re-derived on main first with grep -rn "setRootPath\|expandNode\|collapseNode\|refreshTree\|rootPath" src):
- src/components/__tests__/subTerminalCallSites.test.tsx, "FileBrowser shows the own folder" (lines 105 to 113) becomes "FileBrowser shows the view in sight". With the sub-terminal in sight it calls readPaneFolder("sub-pane") itself (what App does on a view change), then asserts that the root /elsewhere/src is shown and listed and that /code/shop/src is neither; then showView(t, "own") and readPaneFolder("own-pane"), and asserts the reverse. The palette tests in the same file are unchanged.
- Any test of setRootPath, expandNode, collapseNode or refreshTree that the grep finds: its assertions move to the new actions with the same intent. Name each one in the Results.

Dependencies. Stories s1a and s1b. Conditional mirror: F4 S1 (item 11, recorded there and in the F4 ticket when it is sharded).

Out of scope. The preview panel per view (s1d), including VV-1 AC6 for the preview panel. Orchestrator project folders (S4). OSC 7 (ADR 0021, not built). Detached windows (S3). Positions (S2).'''
