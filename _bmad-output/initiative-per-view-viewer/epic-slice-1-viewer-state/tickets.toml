3. src/App.tsx and src/lib/previewFocus.ts: usePreviewPanel() keeps focusRequest as App state; open and close come from the view in sight's layout.previewOpen. ⌘⇧B and the palette's toggle set previewOpen; ⌘B sets browserOpen (its browser half is in s1c). The focus rule of VV-1 AC7: when a switch closes a panel that has focus, focus goes to the new view's active pane; for a non-terminal tab, to the tab's own content, as a tab switch does today.
4. src/stores/tabStore.ts: Tab.previewPath and Tab.previewReveal are removed from the type; setPreviewPath and clearPreviewReveal are removed; saveSession never wrote previewPath and still does not. loadSession keeps reading a legacy previewPath, into takeLegacyPreviews() (story s1a). PreviewReveal stays exported.
