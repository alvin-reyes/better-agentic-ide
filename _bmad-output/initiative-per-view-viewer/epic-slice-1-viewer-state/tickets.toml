[[entry]]
id = "s1a"
type = "story"
title = "Viewer keys, the viewer store and view creation"
description = '''F3 slice S1, story 1 of 5. Design sections 4, 5 (5.1 to 5.3), 12.1, 12.3 and 15 (story 1). PRD F3.7 VV-2, VV-6, VV-7, VV-9. Contract .ade/context/viewer-state.md. ADRs 0031 and 0032. Read design sections 4 and 5 before you write code.

Blocked until code-viewer stories cv3 and cv5 are Done on main (owner's OQ-9 (a)); see `unknown`. When pulled, check on main that both have their Results recorded in _bmad-output/plan-code-viewer-panel.md.

Summary. The stable key of each view, the viewer store, the restore order and view creation. No writer yet: ade-viewer-state is read, never written (story s1b writes it). No component changes. Tab.previewPath stays in place (story s1d removes it).

Build, in this order, each new file with its tests first:
1. src/lib/viewerKey.ts (new, imports nothing): newViewerKey() returns 32 lower-case hex characters from crypto.getRandomValues on 16 bytes; isViewerKey(s) is /^[0-9a-f]{32}$/. tabStore imports it; viewerKey.ts imports nothing, so there is no import cycle.
2. src/lib/viewerSeed.ts (new, imports nothing): a module-level Map from a new key to a source key. seedLayout(newKey, sourceKey) sets it; takeSeed(key) returns the source key once and deletes the entry.
3. src/stores/tabStore.ts: View gets viewerKey: string (required). ownViewOnly, addView and every other creator of a View mint one with newViewerKey(). Each creator calls seedLayout(newKey, sourceKey) immediately before its set(): addView seeds the spawning view's key when spawnedBy names a view of that tab, else the tab's shown view's key; a top-level tab creator seeds the shown view's key of the main window's active tab, and seeds nothing when there is no tab. restoreViews and loadSession never seed. SavedTab.viewerKey (the own view) and SavedView.viewerKey (each sub-terminal) are written LAST in each saved record (design 4.2). On load a saved key is accepted only if isViewerKey() and not already used by an earlier record of the same session; otherwise a new key is minted and that view gets the defaults.
4. src/stores/viewerStore.ts (new, zustand): the shape of design 4.1, without any UI. Fields: states, pending, seq, inSight, reveals, resolvedRoots (declared here, filled by story s1c), restoring, restoredByDefault. Actions:
   - reconcile() (design 5.1 steps 1 to 5). Precedence for a new key: pending[key] (moved into states), else the seed's source layout (clamped, empty expanded, file null, seen 0), else the defaults. A state whose key is no longer live is deleted with its reveal and its resolved root. The view in sight's seen = next(). Runs synchronously on every tab-store change, and once at module init after subscribing, so tab-1 gets its defaults and seen = 1.
   - expand(key, path) and collapse(key, path) (design 4.5): expand sets expanded[path] = next(), and at 501 entries deletes the entry with the lowest seq; collapse deletes only that path.
   - openFile(key, path, at?), recordPosition(key, path, pos), setLayout(key, patch) and clearReveal(key, nonce): the store half only. Each changes only its own key. Routing and UI wiring are stories s1d and s1e.
   - Defaults (design 5.3): browser open or closed and width from ade-file-browser (read once at module load, clamped to 180 to 500; closed at 240 if absent), preview closed at 480, expanded {}, file null, opener null, seen 0.
5. hydrateViewerState() (design 5.2 step 1): sets restoring = true, then reads localStorage key "ade-viewer-state" READ ONLY, inside try/catch. A missing value, a v other than 1, or JSON that does not parse means no states. Every field is validated (design 4.3): widths clamped; a seq or seen that is not a positive safe integer drops that entry (seen may be 0); a non-string path drops that entry; a malformed layout drops the whole state; the expanded set is capped at 500 keeping the highest seq (design 4.5). Valid states go into pending, not states. seq is raised to the maximum of the saved seq and seen values (design 4.4).
6. endRestore() (design 5.2 steps 3 to 5): run in finally after loadSession(). It drops pending entries nobody claimed, applies the legacy previewPath (loadSession records ownViewKey to path for each restored tab whose saved record had a previewPath, and takeLegacyPreviews() hands them over; for a key in restoredByDefault, file = {path, pos: null}; a key that took a hydrated state keeps it; sub-terminals take nothing), clears restoring, and marks the store dirty (a flag only in this story).
7. src/App.tsx: App's first effect calls hydrateViewerState(), then try { loadSession() } finally { endRestore() }, in that order. Nothing else in App changes.
8. src-tauri/src/sync.rs: SESSION_LOCAL_FIELDS = ["serializedBuffer", "viewerKey", "previewPath"], stripped at every depth of ade-session in value_for_repo. Unit test here. The export test against the golden fixture is story s1b's (VV-12 AC1).

Acceptance criteria (each is one or more named tests, written first):
(1) VV-2 AC2 (S1). A new top-level tab of any type takes only the layout of the view in sight when it was created, with no open file and no expanded folders. With no view in sight (fresh install) it gets the VV-9 defaults. A fleet, contracts or editor tab that is focused rather than created keeps its own state. Tests in src/stores/__tests__/viewerStore.test.ts: "a new top-level tab copies only the layout of the view in sight", "with no view in sight a new tab gets the defaults", "focusing an existing tab keeps its own state".
(2) VV-6 AC4 (S1). A restored view that has no viewer state gets the defaults. Test src/stores/__tests__/viewerRestore.test.ts "a restored view with no saved state gets the defaults".
(3) VV-7 AC1 (S1). One state per existing view; a closed view's state is not kept. Test viewerStore.test.ts "closing a view deletes its state, reveal and resolved root".
(4) VV-7 AC2 (S1), the 500-folder cap. Tests in viewerStore.test.ts: "expanding a 501st folder evicts the first"; "expand 500, collapse and re-expand the first, expand one more: the second is evicted, not the first"; the same two with Date.now stubbed to one constant value; the same two with Date.now stepping backwards 1 s per expansion (same folders evicted both times); "an evicted folder shows collapsed and keeps its descendants in the set".
(5) VV-7 AC5 (S1). Widths are clamped wherever a width enters a view: on restore, when a view copies a layout, and when a default is taken from ade-file-browser (file browser 180 to 500, preview panel 280 to 900). Tests: viewerRestore.test.ts "a saved file-browser width of 900 restores as 500"; viewerStore.test.ts "an ade-file-browser width of 50 gives views 180" and "a copied layout is clamped".
(6) VV-9 AC1 (S1 parts). Test viewerStore.test.ts "the defaults: browser from ade-file-browser or closed at 240, preview closed at 480, nothing expanded, no file, seen 0".
(7) VV-9 AC2 (S1). A restored tab's legacy previewPath becomes its own view's open file, at the top, unless that view has viewer state of its own; a sub-terminal takes nothing from it. Tests in viewerRestore.test.ts: "a legacy previewPath opens the own view's file at the top", "a view with its own saved state keeps it", "a sub-terminal takes no legacy previewPath".
(8) CONDITIONAL, VV-2 AC3 (Move to New Tab carries the state; F3.8 "Merges second", D14). If sub-terminals story 5 (_bmad-output/initiative-sub-terminals/epic-sub-terminals, ticket 5) is on main when this story is reviewed, this story also includes VV-2 AC3 and its store-level test, and re-checks this before merge if that story lands in between: moving a view to a new tab keeps its viewerKey and its state unchanged, so the new tab's own view carries the moved view's key and state (root, expanded folders, open file at its position, layout). Test viewerStore.test.ts "moving a view to a new tab keeps its key and its state unchanged". If sub-terminals story 5 is not on main, this criterion is not in this story's gate, and that story carries it (its ticket has the mirror).
(9) Supporting tests, not criteria of their own (their criteria are in stories s1b to s1e): each store setter changes only its own key (viewerStore.test.ts "each setter changes only its own key"); a seed copies the layout and nothing else and leaves its source untouched (viewerStore.test.ts "a seed copies the layout, nothing else, and leaves the source untouched"); the module-init run gives tab-1 a state with seen 1 (viewerStore.test.ts "tab-1 has a state after module init"); the load order in src/stores/__tests__/viewerRestore.test.ts "hydrate, load, end: a state is claimed by key, tab-1's default is dropped, unclaimed states are dropped, seq is above every saved number"; the sync.rs strip, a unit test "viewerKey and previewPath are removed at every depth of ade-session". The VV-6 AC1 end-to-end restart is story s1e's.

Existing tests this story changes (design 12.3, rows for story 1). Re-derive the list first on main: git grep -n "spawnedBy:" -- src, then npx tsc --noEmit after adding viewerKey to the type. The design's list was drawn before sub-terminal stories 2a and 2bi landed, and main now has more literals: SubTerminalStrip.test.tsx (2), subViews.test.ts (1), and src/lib/terminalOpen.ts (1, production code, which builds a View). Replace each as follows:
- src/stores/__tests__/session.test.ts, "a single-view tab saves the same JSON as before the refactor" (byte for byte against fixtures/session-golden.json). Do NOT regenerate the golden file: it is the pre-refactor capture. goldenState() sets a fixed viewerKey on each view after ownViewOnly; the test asserts each saved tab's viewerKey equals its fixed key, deletes viewerKey from every saved tab and subViews entry, re-serializes, and compares byte for byte. The other four tests in the file are unchanged and must still pass (loadSession accepts sessions with no keys).
- Every View literal that tsc flags. The design's list: subTerminalCallSites.test.tsx (2), TabBar.subTerminal.test.tsx (1), useOwnFolderCwd.test.tsx (2), detachWindow.test.ts (2), tabDisplay.test.ts (2), subViewSession.test.ts (2), tabViews.test.ts (3), and the literals in tabStore.ts. Plus the ones above. Each gains viewerKey: testKey(n) from a new helper src/stores/__tests__/viewerKeys.ts (testKey(n) is n in hex, left-padded to 32 characters).
- src/lib/__tests__/detachWindow.test.ts, line 70, "the detached window holds the payload as a tab with one own view": the expected view gains viewerKey: expect.stringMatching(/^[0-9a-f]{32}$/); every other field is compared as before (the key is minted, so testKey(n) cannot be used).
- src/stores/__tests__/subViewSession.test.ts, line 56, "a tab with sub-terminals round-trips its subViews and shownView": tabWithSubTerminals()'s views get testKey(n); each expected subViews entry gains viewerKey: testKey(n).
- src/stores/__tests__/subViewSession.test.ts, line 136 (the exact key set of a saved sub-terminal): the expected set becomes ["activePaneId", "id", "name", "root", "viewerKey"]. Adding viewerKey to this guard is deliberate: the guard keeps run-scoped and private fields out of the save, and viewerKey is saved on purpose (ADR 0031). The forbidden-word list is unchanged.

Dependencies. Blocked on code-viewer cv3 and cv5 (`unknown`). Story s1b depends on this story. Conditional mirror: sub-terminals ticket 5 (item 8).

Out of scope. Any write to localStorage or to ade-viewer-state (s1b). PERSISTED_KEYS (s1b). Every component (s1c to s1e). The ade-file-browser mirror (s1c). Removing Tab.previewPath (s1d). The golden fixture and the export test (s1b). The Rust crate change is only the sync.rs strip.

Stop rule. If a test that is not on the list above breaks, stop and report it in the Results with its name; do not change its assertions.'''
verify = "The seven In-force lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest; cd src-tauri && cargo check -p ade-hook; cd src-tauri && cargo test -p ade-hook), with the named tests for items (1) to (7) and item (8) if it applies, and the supporting tests of item (9), passing by name in the output."
