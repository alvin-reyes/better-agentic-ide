[[entry]]
id = "s1e"
type = "story"
title = "Code position, the restart and no raw text"
description = '''F3 slice S1, story 5 of 5. Design sections 9 (all: 9.1 one editor per view and file, 9.2 recording, 9.3 restoring, 9.4 the stub extension), 12.1, 12.3 and 15 (story 5, and build note 11). PRD F3.7 VV-1 AC5 (code), VV-6 AC1, VV-7 AC3, VV-8 AC3 and AC4. Contract .ade/context/viewer-state.md (code editor in the side panel). ADR 0031.

Depends on stories s1a to s1d (VV-6 AC1 needs every part built) and on code-viewer cv3 (the "Deleted on disk" banner, VV-8 AC3) and cv5 on main.

Summary. The code position per view: the first visible line and the cursor are recorded while the engineer scrolls or moves, and restored when the view is shown again, including the same file open in two views. Plus the end-to-end restart and the no-raw-text tests.

Build, each piece with its tests first:
1. src/components/editor/__tests__/monacoStub.tsx (extended as design 9.4): lineHeight = 20; laidOut = false, set true by layout(); getTopForLineNumber(n) = (n - 1) * 20; getVisibleRanges() is [] until laidOut, then [{ startLineNumber: floor(scrollTop / 20) + 1, endLineNumber: startLineNumber + 29 }]; onDidScrollChange(cb) and onDidChangeCursorPosition(cb) each return { dispose }; setScrollTop, setValue, restoreViewState and setPosition fire the matching listeners. The extension changes nothing a current test relies on: MonacoWrapper.test.tsx is unchanged and must pass.
2. src/components/editor/MonacoWrapper.tsx: optional initialView?: { top, line, col } and onViewChange?(v) props (design 9.2). In onMount it registers onDidScrollChange and onDidChangeCursorPosition, disposed on unmount; each calls report(), which returns if getVisibleRanges() is empty (never a guess, no ?? 1), else calls onViewChange with { top: ranges[0].startLineNumber, line, col }. Events are ignored until the initial restore is applied (a restored ref). The file tab passes neither prop and is unchanged.
3. The restore (design 9.3), one applyInitial() per mount, after mount and after the content effect: (a) if a reveal is pending for this file, applyReveal() as today (it calls editor.layout() first), then restored = true and report() once, so the revealed line becomes the remembered position; (b) else if initialView: editor.layout(); n = model.getLineCount(); line = min(line, n); top = min(top, n); setScrollTop(getTopForLineNumber(top)); setPosition({ lineNumber: line, column: max(1, col) }) (setPosition never takes focus); restored = true, and nothing is reported; (c) else restored = true. With asyncMount, applyInitial runs in onMount, and events before it are ignored.
4. src/components/viewer/CodeView.tsx: the MonacoWrapper key is viewerKey + ":" + path (design 9.1), so the same file open in two views is two editors. onViewChange is (v) => viewerStore.recordPosition(viewerKey, path, { kind: "code", ...v }), closed over the key it was rendered with; MonacoWrapper keeps it in a ref.
5. Position data: a code position is three whole numbers, each at least 1 (VV-7 AC4, S1 kind). Positions are whole numbers and clamped on restore.

Acceptance criteria (each is one or more named tests, written first):
