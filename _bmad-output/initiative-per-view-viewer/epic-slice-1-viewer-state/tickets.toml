6. .ade/context/side-panel-files.md: the "Store" and "App" bullets of the "Go to line" section now describe viewerStore.reveals[key] and the view in sight. Written in this story, not before.

Acceptance criteria (each is one or more named tests, written first):
(1) VV-1 AC1 (S1). Whenever the view in sight changes (⌘[ and ⌘], a click on the strip, a tab switcher row, an agent-status toast, the fleet, a tab switch, closing the view in sight), the file browser and the preview panel show the new view's viewer state: root, expanded folders, open file with its position, and layout. Test src/components/__tests__/perViewPanels.test.tsx, rendering App's panel area with two views: tab T has its own view in /hub and sub-terminal S in /hub/atomic-stays; open /hub/a.ts in the own view and /hub/atomic-stays/b.ts in S; ⌘] shows root /hub/atomic-stays and b.ts; ⌘[ shows root /hub and a.ts. The same assertions for a click on the strip and for a tab switch.
(2) VV-1 AC4 (S1). Opening a file in the preview panel, by any route that opens one there today or later (a path:line click in a terminal, the panel's path box, Open ARCHIVE.md, the board's links, and the file browser's click once cv5 makes it open the panel), sets the open file of the view in sight only. Tests: perViewPanels.test.tsx "a path:line click in S changes S's open file and not the own view's"; "the panel's path box opens the file in the view in sight". The detached-window part is S3's.
(3) VV-1 AC6 (S1). ⌘B, ⌘⇧B, the palette's toggles and dragging either panel's edge change only the view in sight. Test perViewPanels.test.tsx: close the file browser in S and widen the preview panel to 700 px; ⌘[ shows the own view's browser open and its preview panel at its own width; ⌘] shows S's browser closed and its preview panel at 700 px.
(4) VV-1 AC7 (S1). Switching views never moves focus into either panel. The panel's focus rules hold per view: opening a file never takes focus, ⌘⇧B does, closing with focus inside returns it to the terminal. Test perViewPanels.test.tsx: focus inside S's open file browser, ⌘[ to the own view whose browser is closed: focus is in the own view's active pane. A second test: a switch that shows a panel open does not move focus into it.
(5) VV-1 AC8 (S1). Each non-terminal tab (browser, editor, orchestrator, fleet, contracts) holds one viewer state of its own, so switching to it and back never changes a terminal view's state; its root follows D7 and VV-11; its expanded folders, open file, position and layout follow VV-1 AC3 to AC6. Tests perViewPanels.test.tsx "switching to a non-terminal tab and back leaves a terminal view's state unchanged" and "a non-terminal tab's expanded folders and open file are its own".
(6) VV-8 AC9 (S1). The open file does not have to be under the root: a cd elsewhere keeps the open file. Test perViewPanels.test.tsx "a cd elsewhere keeps the open file".
(7) VV-11 AC5 (S1). Each non-terminal tab keeps its own expanded folders, open file, position and layout (VV-1 AC8); Reopen Closed Tab does not apply to these tabs (F3.5). Test perViewPanels.test.tsx "a browser tab keeps its expanded folder and open file across a switch".

Moved and rewritten existing tests (design 12.3, rows for story 4; re-derive first with grep -rn "previewPath\|previewReveal\|setPreviewPath" src on main):
