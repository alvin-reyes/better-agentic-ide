[[entry]]
id = "s1b"
type = "story"
title = "Saving viewer state, the caps and the save ladder"
description = '''F3 slice S1, story 2 of 5. Design sections 7 (all), 8, 12.1, 12.2 and 15 (story 2). PRD F3.7 VV-3, VV-4 AC2 (main-window part), VV-6 AC3, VV-7 AC6 and AC7, VV-9 AC3 and AC5, VV-12 AC1, AC2 and AC4 (S1 parts), VV-14. Contract .ade/context/viewer-state.md. ADR 0031.

Depends on story s1a (keys, store, restore order).

Summary. The writer of ade-viewer-state: the pure builder with the caps, the snapshot-filter-build-commit pipeline, the throttle, the saveSession ladder, the filter hook with its default, the golden fixture with both halves, and the local-only rules. Every test drives store actions (expand, openFile, recordPosition, setLayout, showView) and no component is rendered.

Build, each new file with its tests first:
1. src/lib/persistence.ts: "ade-viewer-state" is added to PERSISTED_KEYS. It is not added to SHARED_KEYS or DEVICE_KEYS. ADR 0017's static key test stays green.
2. src/lib/viewerFilter.ts (new): setViewerPathFilter(f) and viewerPathFilter(). The default is async ps => ps.map(() => true) (keep everything; F1's PE-4 AC4 story sets the real filter).
3. src/lib/viewerPersist.ts (new, design 7.1 and 7.2): buildSavedViewerState(snap, inSightKey, keep, { lean }) is pure, with the design's measure (bytes = UTF-8 length of JSON.stringify), the 4,096-byte path rule, the filter's keep decision, lean, the 32 KB per-view trim by binary search with re-serialization, and the 256 KB all-views trim ordered by seen with the view in sight last, then whole-state drops; then a final check that the result is at most 262,144 bytes. prepareViewerWrite (writeGen, snapshot, path decisions by await viewerPathFilter()(paths), the last prepared write), commit(prepared, mode) (lands only if prepared.w >= lastCommitted), removeViewerState() (ignores the generation and sets lastCommitted = writeGen), startViewerPersistence() (main window only, subscribes, throttles at 2 s, leading edge off, trailing edge on, writes setItem("ade-viewer-state", json)), flushViewerState() (design 7.1: a no-op before start; when clean and nothing pending it returns the last prepared write; otherwise it writes at once and restarts the throttle window; no throttled write starts during a flush). A failed filter writes a layout-only value (expanded [], file null, opener null, layouts and seen kept), with console.warn on the 1st and every 10th consecutive failure and no path in the message.
4. src/stores/tabStore.ts saveSession: the step-0 flush runs after the per-pane getPtyCwd awaits and just before the session's first JSON.stringify and setItem. Then the ladder of design 7.3: 1 session over MAX_SESSION_SIZE (which measures ade-session alone): viewer lean, then today's scrollback tail; 2 setItem throws: viewer lean, retry; 3 still throws: removeViewerState(), retry with the same scrollback; 4 still throws: today's strip of serializedBuffer; 5 still throws: today's removeItem of ade-session. Every viewer failure is caught in step 0 and never reaches ade-session.
5. src-tauri/tests/fixtures/f3-viewer-session.json (new, the golden fixture, design 12.2): an ade-session and an ade-viewer-state with unique path markers in an own view, a sub-terminal and a non-terminal tab.
   TypeScript half, src/stores/__tests__/viewerGolden.test.ts: from a fixed store (testKey keys, fixed seq values, Date.now mocked, getPtyCwd and the serializer mocked), runs saveSession() with persistence started, and asserts both stored strings equal the fixture byte for byte. Regenerate with UPDATE_F3_GOLDEN=1 npx vitest run src/stores/__tests__/viewerGolden.test.ts (the UPDATE_FIXTURES=1 pattern of scripts/bmadTextFixture.test.ts). A regenerated fixture is reviewed as a code change.
   Rust half, src-tauri/src/sync.rs tests: load the fixture into a temporary kv folder, run export_state, and assert the repo holds no marker, no viewerKey and no ade-viewer-state file, and still holds the tab names and the savedCwds (VV-12 AC1). A second Rust test asserts "ade-viewer-state" is in neither SHARED_KEYS nor DEVICE_KEYS.
6. src/lib/__tests__/viewerPersist.test.ts (the pure builder) and viewerSave.test.ts (the store-level saves).

Acceptance criteria (each is one or more named tests, written first):
(1) VV-3 (S1). Closing a sub-terminal discards its viewer state; the view now in sight shows its own state, unchanged. Closing a tab discards every view's state in it (no exception here: VV-4 AC3 is S5). Test viewerSave.test.ts "closing a sub-terminal and closing a tab leave no state for them in the next save" (the PRD's VV-3 AC3: after closing S, the next session save contains no viewer state for S).
(2) VV-4 AC2, main-window part (S1). Move to New Window takes the tab's views out of the main window. The main window's other views are unchanged and its next session save holds nothing of the moved tab. Until S3 the detached window shows neither panel. Test viewerSave.test.ts "moving a tab out of the main window leaves the others unchanged and the next save holds nothing of it".
(3) VV-6 AC3 (S1). Viewer state is saved only on this machine (VV-12). Test viewerPersist.test.ts "a viewer write is read back on the next load from ade-viewer-state, the only key that holds it".
(4) VV-7 AC6 (S1), the byte caps. Tests in viewerPersist.test.ts and viewerSave.test.ts: "a view with 500 expanded folders of 200-character paths saves at most 32 KB and keeps the most recently expanded"; "30 such views save at most 256 KB, the view in sight keeping the most"; "a path of 4,097 bytes in UTF-8 is not stored and one of 4,000 bytes is"; "80 views whose root and open file are each about 4,000 bytes, with no expanded folders, save at most 256 KB; the view in sight keeps its state; the views dropped are the least recently in sight"; "after a restart the eviction and drop orders are the same as before"; "with Date.now stubbed to one constant value, the drop order is the order the views were last in sight"; "trimming changes what is saved and never the in-memory states".
(5) VV-7 AC7 (S1). Viewer state never costs the session. Test viewerSave.test.ts, with the quota pinned as design 7.3 says: a localStorage mock whose quota is the sum over keys of key length plus value length in UTF-16 code units; 30 views each at the 32 KB cap with a layout, an open file and terminal scrollback; the quota set to S + 1,024, where S is ade-session saved with no viewer state and full scrollback (measured by a first save with persistence not started). Expected: ade-session holds every tab and folder with full scrollback; ade-viewer-state is absent (the test asserts the lean value of 30 views is over 1,024 units, so step 3 ran); a restore from that storage brings back every tab and folder. Second case: the quota at S + lean + 1,024; expected the lean viewer value and full scrollback.
(6) VV-9 AC3 (S1). Show hidden stays in ade-file-browser, global. Test viewerSave.test.ts "a viewer write leaves showHidden in ade-file-browser as it was". (The mirror's own writes are story s1c's.)
(7) VV-9 AC5 (S1). Test file src/stores/__tests__/viewerRoundTrip.test.ts, four tests:
   - (a) a session saved by the previous release with ade-file-browser {isOpen: true, width: 300, showHidden: true} restores with every view's file browser open at 300, hidden files shown, preview panels closed at 480, and no open file;
   - (b) new to old to new, as a fixture: the previous release's session is the session exactly as that release's saveSession writes it, rebuilt from the fields that release knows, with every field it does not know dropped (including every viewer-state field and every viewerKey). Write its SavedTab, SavedView and pane record types into the test, copied from the release tag that the F3 branch starts from (main's last release tag at pull; write the tag name into the test). The saved id of every tab, view and pane is the id that release's code produces, by its own counters (newTabId, newViewId, newPaneId) and the order its code calls them on load, restore and create; the test writes down how it derived them;
   - each simulated run starts with vi.resetModules() and then imports every module the run uses that holds the store, so id counters start at 0 on each run;
   - run 1 (F3 build) saves T1 (own view and sub-terminal S), T2 and T3, each view with a distinct state; old run A loads that session, closes T1, moves T3 before T2, and saves; old run B loads run A's save, opens a new terminal tab T4 with a sub-terminal, and saves; run 2 (F3 build, fresh modules) loads run B's save with the separate store still holding every state run 1 wrote. Precondition, checked by the test: at least one record in run B's save carries an id that belonged to a different view in run 1's save, computed from the fixture; the test fails its own setup if not. Expected: run 2 loads without error; every view shows its own run-1 state or the defaults; T2 and T3 do not take each other's; T4 and its sub-terminal get the defaults; nothing of T1 or S appears in any view. (A state stored inline is lost in this round trip and the view gets the defaults; that is accepted, D12.)
   - (c) the S2 case (a session saved by slice 1, code positions) is not in S1 and is not tested here.
(8) VV-12 AC1 (S1). ADE sync's export carries none of the viewer-state markers, none of its fields, and none of the views' keys, and still carries the tabs' names and folders. Tests: the TypeScript and Rust halves of the golden fixture (item 5). ade-session carries viewerKey only as a field that the export strips.
(9) VV-12 AC2 (S1). Saving a workspace (Settings, Workspace) writes no viewer state. Test viewerLocalOnly.test.ts "a saved workspace holds none of the markers". Find the workspace save path by grep on src for the workspace preset writer; it holds {name, splits} only.
(10) VV-12 AC4 (S1 part). Viewer state is written only to localStorage keys that pass isPersistedKey, and reaches disk only through state_write. Test src/lib/__tests__/viewerLocalOnly.test.ts, as F3.7 VV-12 AC4 writes it, with these reviewer notes from F3.9 written into the test:
   - start auto-save with startAutoSave({ snapshots: false }) (so no snapshot interval is created and state_snapshot is not part of the flow), and undo it after with __resetForTests; the test does not use fake timers for auto-save;
   - put spies on localStorage.setItem and on the Tauri invoke bridge, run every action that changes or saves viewer state (a view switch, an expand and a collapse, opening a file, a position change, a panel drag, a session save, and the trim and drop paths of VV-7 AC6 and AC7), then flushNow(). Expected: every localStorage key whose value carries a marker passes isPersistedKey; every state_write call's entries keys pass isPersistedKey; every other invoke is to a command on the allowlist written in the test;
   - the allowlist holds no command that writes a file. Check it against src-tauri/src: each command on the list is named in a comment with the file and function where its handler is, and the comment says the handler writes nothing (today that rules out write_text_file, create_directory, save_temp_image, state_restore_snapshot, vault_set and sync_set_config). state_snapshot is on the list only if its handler copies the profile's own state folder and writes nothing outside it.
(11) VV-14 (S1). Recording positions, expanding or collapsing folders and dragging a panel's edge never make the session save more often than today and never cause an extra scrollback serialization; a viewer write is at most one per 2 s. Test viewerSave.test.ts: with a spy on the scrollback serializer and on saveSession, 100 scroll and cursor changes (recordPosition) and 20 folder expansions over 5 seconds cause no session save and no scrollback serialization that the same 5 seconds without them would not have caused; with a fake clock, viewer changes produce at most one ade-viewer-state write per 2 s.
(12) CONDITIONAL, VV-13 AC1 and AC2 (no engagement paths in the default profile; F3.8 "Merges second", D14). Only if a story that delivers F1 PE-4 AC4 is on main when this story is reviewed (and again before merge), this story includes VV-13 AC1 and AC2 and their test: saved viewer state never holds a path inside an engagement's root or checkouts, nor a position or digest of a file there (the filter decides on the file's path, with the rules of F1 PE-2 AC5); the test runs under F1's D28 gate, as the F1 story and .ade/context/f3-merges-second.md say. PE-4 AC4 is not sharded yet, so until then this criterion is not in the gate, and the F1 story that F1's slice-4 sharding creates for PE-4 AC4 carries it (the obligation is recorded in .ade/context/f3-merges-second.md).
(13) CONDITIONAL, VV-12 AC3 (nothing to the phone; F3.8 "Merges second"). If phone-watch story 8 (ADE's Remote bridge, _bmad-output/initiative-phone-remote/epic-phone-watch, ticket 8) is on main when this story is reviewed (and again before merge), this story includes VV-12 AC3 and its test: the payload built for the relay from a tab with viewer state holds none of the markers and none of the viewerKeys. Test in the file that holds the payload builder (phone-watch story 8's file, the test that this story adds). Otherwise phone-watch story 8 carries it (its ticket has the mirror, item 9).
(14) CONDITIONAL, VV-12 AC4 [Second] (the isolation scan; F3.8 "Merges second"). If F1's story for PE-4 AC9, the slice-1 scenario (_bmad-output/initiative-personas-and-engagements/epic-profile-and-rule, ticket e29), is on main when this story is reviewed (and again before merge), this story includes the criterion and its test, joining e29's: F1's isolation test gives A's instance viewer state holding markers of A (an expanded folder, an open Markdown file scrolled past a heading, a non-terminal tab's opener folder), and finds none of them outside A's profile, root and checkouts. Runs under F1's D28 gate. Otherwise e29 carries it (its ticket has the mirror, item 6).

Supporting tests, not criteria of their own: the ladder race (viewerSave.test.ts "a throttled write made dirty during saveSession's per-pane awaits does not start during the flush; with the quota set so step 3 runs, ade-viewer-state is removed even when a throttled write landed earlier with a higher generation"); the write generation (a path added during the await is not written; an older write resolving last is discarded); a rejecting filter writes layout only and warns on the 1st and 10th failure; the filter gets the snapshot's paths only, and a path with no decision is refused.

Existing tests this story changes: none. Design 12.3 lists none for story 2. If a test breaks, stop and report it in the Results with its name, and do not change its assertions.

Dependencies. Story s1a. Conditional mirrors: phone-watch ticket 8 (item 13), F1 e29 (item 14), F1 slice-4 sharding (item 12, recorded in .ade/context/f3-merges-second.md).

Out of scope. The ade-file-browser mirror (s1c). Any component. The phone payload builder itself (phone-watch story 8). The F1 isolation scenario itself (e29). Positions per kind other than code (S2).'''
