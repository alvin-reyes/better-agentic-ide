#   cd src-tauri && cargo check -p ade-hook
#   cd src-tauri && cargo test -p ade-hook
# The design (section 13) proposes no new line for S1.
#
# Base for every story: main when the story is pulled. The lists of existing tests (design 12.3) were drawn at 6e0ec17 and
