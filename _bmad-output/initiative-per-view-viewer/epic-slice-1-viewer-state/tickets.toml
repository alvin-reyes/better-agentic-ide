# F3 slice S1: five stories, built in order s1a, s1b, s1c, s1d, s1e (no two in parallel).
# Design: docs/superpowers/specs/2026-11-10-per-view-viewer-design.md, sections 4 to 12 and 15 (story split and build notes).
# PRD: docs/prd.md F3.7 (criteria text), F3.8 (slice S1 row and "Merges second" table), F3.9 (handoff, reviewer's sharding notes).
# Contract: .ade/context/viewer-state.md. Decisions: ADR 0031, ADR 0032. Merges second: .ade/context/f3-merges-second.md.
#
# Verification command for every story (docs/architecture.md, "In force", seven lines, each from the repository root, each exits 0):
#   npx tsc --noEmit
#   npm test
#   cd src-tauri && cargo test
#   cd relay && cargo test
