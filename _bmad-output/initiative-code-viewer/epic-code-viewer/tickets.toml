[[entry]]
id = "cv3"
type = "story"
title = "Follow the file live"
description = '''Code viewer plan, story 3 (_bmad-output/plan-code-viewer-panel.md, "Story 3: Follow the file live"). Depends on stories 1, 2 and 4, all merged to main.

Summary. The side panel follows its file live with watch_file (story 1's command), not the folder-wide watch_directory. Watch health is per-path state, separate from the user's LIVE/STATIC toggle. A deleted file shows a "Deleted on disk" banner until it comes back. A BinaryView keeps its view during a reload.

Code map.
- src/components/PreviewPanel.tsx:188: today's watch_directory effect (invoke at 188, unwatch_directory at 194 and 203; extensions: [ext], default withContent, errors swallowed, reloads only on changed with event.path === filePath).
- src-tauri/src/watcher.rs:186-190: every Modify, renames included, becomes changed (changed_event).
- src/components/viewer/BinaryView.tsx:17-25: setData(null) on every reloadKey change.

Rules (plan, Story 3 section): the panel calls watch_file with the path and never watch_directory. Watch status is watch: { path, status: "live" | "failed" | "off" | "stale" | "arming", reason? } per path. The LIVE badge shows when the user's toggle is on and status is live, stale or arming for the current path; "Not live: <reason>" shows only for failed, and for off while the file is missing. Any event re-reads; "deleted" is decided by a not-found read and cleared by a good one. A removed event marks the watch stale and the next good read re-arms it. Re-arms run one at a time with a rearmAgain flag; a stale watch id is unwatched at once; backoff 2, 4, 8, 16, 30 s is kept across failed arms and reset only by a successful arm. One re-read after every successful arm.

Acceptance criteria (fake timers; watch_file mocked to capture the channel and return ids; read_text_head mocked per call):
1. The panel calls watch_file with the path and never watch_directory. -- PreviewPanelCode.test.tsx "watches only its file"
2. Three events 50 ms apart cause one read_text_head call, 150 ms after the last. -- "debounces bursts"
3. An event every 50 ms for 3 s causes a re-read at least every 1 s (at least 3 calls). -- "continuous appends still refresh"
4. Each of changed, created, removed schedules a re-read. Sequence removed then created with the file present: no "Deleted on disk" after the re-read. Sequence created then removed with the file gone (read rejects with not-found): "Deleted on disk" in a role="status" element and the editor keeps its last text; a later successful read clears it. -- "removed then created", "created then removed"
4b. Folder event, file already back (N1 fast path): with a live watch (id 1), a removed event and then a re-read that succeeds: unwatch_directory(1) is called, then watch_file again (id 2), and an event on id 2's channel triggers a reload. The same holds when the removed arrives inside a burst that ends with the 1 s max wait. -- "a folder replaced before the re-read is watched again"
5. Folder deleted and re-created (N1 slow path): after a removed whose re-read rejects with not-found, the panel unwatches the old id and makes no further watch_file call while reads keep failing; it re-reads at 2 s, 4 s, 8 s, capped at 30 s. When a read succeeds, the banner clears, the new text is shown, watch_file is called again, and an event on the new channel triggers a reload. -- "a deleted folder that comes back is followed again"
6. Per-path watch failure (N2): watch_file rejects for A: "Not live: <reason>" in a role="status" element, and the LIVE/STATIC toggle still reads LIVE. Opening B: watch_file(B) is called, B shows LIVE with no "Not live". Back on A with the file present: the next successful read calls watch_file(A) again. An error event on a live watch behaves like the rejection. With the toggle on STATIC, no watch and no re-check run. -- "a failed watch is per file and never flips the toggle"
7. Switching tab (another previewPath), or closing the panel, with a re-read or re-check timer pending: the timers are cleared, the watch is stopped with unwatch_directory, and advancing fake timers 60 s causes zero read_text_head calls for the old path. -- "a tab switch mid-reload", "closing the panel stops the re-check"
8. A watch_file that resolves after the panel moved to another path (or unmounted): its id is passed to unwatch_directory at once, and its events are ignored. -- "a late watch is unwatched"
8b. Two re-arm triggers while the first watch_file is pending: only one watch_file call is in flight at a time; when it resolves, exactly one more arm runs; every id returned except the last has been passed to unwatch_directory. -- "re-arms never leak a watcher"
8c. watch_file rejecting on every arm while reads succeed: re-check reads happen at 2, 4, 8, 16, 30, 30 s (not every 2 s); a successful arm resets the interval. -- "a watch that keeps failing backs off"
8d. Re-read after arming: on opening a file, watch_file resolving triggers exactly one more read_text_head for the path (two in total for the open, with no events); likewise after each re-arm in 4b and 5. If the file changed between the first read and the arm, the newer text is shown. -- "a write before the watch registers is not missed"
8e. Badge: LIVE (no "Not live") while status is stale or arming during a re-arm (watch_file held pending); "Not live: <reason>" when watch_file rejects (failed), and when a read fails with not-found (off); LIVE again after a successful re-arm. -- "the badge does not flicker during a re-arm"
9. A content reload does not re-apply an earlier reveal (no setPosition call after the reload). -- MonacoWrapper.test.tsx "a reload does not jump back to the target line"
10. BinaryView: changing only reloadKey keeps the current view rendered (no "Loading...") until the new bytes resolve; changing path shows "Loading...". -- src/components/viewer/__tests__/BinaryView.test.tsx "a reload keeps the current view"
11. BinaryView's error is a status message (plan Implementation Notes, Story 2 review, 2026-10-17). When BinaryView's read fails (for example "Not a regular file"), the panel shows "Can't open <name>: <reason>" in an element with role="status" and aria-live="polite". The plan's Boundaries say every message the panel shows in place of content is role="status" aria-live="polite". Today BinaryView.tsx returns the raw error in a bare element (its error return), and this item changes that. -- src/components/viewer/__tests__/BinaryView.test.tsx "a failed read says Can't open <name> in a role=status message"
12. Re-clicking a path:line past the stale text (plan Implementation Notes, Story 4 review, 2026-10-18, minor 6). Re-clicking a path:line on the file already shown re-reads the file, and the reveal waits for that read (the plan allows re-read or keeping the reveal pending; this story takes re-read). A line still past the end of the whole (not truncated) text after the re-read goes to the last line, as today, with no message. The rule applies when the line is greater than the line count of the text the editor holds. -- src/components/__tests__/PreviewPanelCode.test.tsx "re-clicking a line past the stale text re-reads the file first" and "the reveal waits for the re-read, then lands on the line"

Docs (3): files.md: live updates, the deleted banner, "Not live".

Manual checks (not gating Done, pending the owner): scroll halfway down a file and let an agent edit it: the view does not move. A loop appending to a log that is open: updates about once a second. Save from vim (rename-write): updates, no lasting banner. Delete the file: banner. rm -rf dist && npm run build with a dist file open, then rebuild: followed on Linux and macOS. The macOS mv gap is documented, not a failure.

Out of scope: any change to how the file tab loads, edits or saves files; the file tab's dead "keep the cursor" branch in MonacoWrapper; PDF page and zoom reset on reload (pre-existing, out of scope; F3 S2 changes it under D10).

Note for the F3 S1 stories: F3 story s1d rewrites the setPreviewPath helper in src/components/__tests__/PreviewPanelCode.test.tsx, and the about 15 tests of this item list that use it (items 1 to 8e in that file) move to openInSight with the same assertions. Story s1e's "Deleted on disk" test relies on item 4 of this story.'''
verify = "The seven In-force lines each exit 0, with the named tests of items 1 to 12 (including 4b, 8b to 8e, and items 11 and 12) passing by name, and the BinaryView test passing. Manual checks listed above are recorded for the owner, not gating."
