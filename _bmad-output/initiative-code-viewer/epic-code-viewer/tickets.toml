[[entry]]
id = "cv5"
type = "story"
title = "File browser clicks land in the panel; modifier-click opens a tab"
description = '''Code viewer plan, story 5 (_bmad-output/plan-code-viewer-panel.md, "Story 5: File browser clicks land in the panel; modifier-click opens a tab"). Depends on story 4 (Done on main), shares openFile.ts and the open callback's options. Built after cv3 is merged to main.

Summary. A file clicked in the file browser opens in the side panel; a modifier-click (⌘ on macOS, Ctrl on Linux) opens an editor tab instead. A terminal link activated with the modifier opens a tab too. From a detached window, the modifier-click sends inTab to the main window.

Code map.
- src/components/FileBrowser.tsx:70-82: handleClick opens every file with addEditorTab.
- src/lib/terminalFileLinks.ts:226: the link's activate is `() => open(f.abs, lineColOf(f))`. It takes no event today; this story changes it to take the MouseEvent that xterm passes (ILink.activate(event, text)).
- src/lib/openFile.ts:48 (the emitTo payload in openFileFromTerminal) and :53 (listenForFileOpens).
- src/lib/shortcuts.ts:14: IS_MAC.

Rules: openFileFromTerminal(path, { inTab }) adds an editor tab for path (addEditorTab, which focuses an existing tab for that file) and dispatches no open-preview. Without inTab it dispatches open-preview. Story 5 adds opensInTab(e: { metaKey, ctrlKey }, mac = IS_MAC) and sets inTab from the MouseEvent that xterm passes to the link's activate (terminalFileLinks.ts:226 changes to take it, see the code map). FileBrowser.handleClick calls openFileFromTerminal(path, { inTab: opensInTab(e) }). The detached-window payload and listenForFileOpens carry inTab.

Acceptance criteria:
1. opensInTab is true for { metaKey: true } on macOS and { ctrlKey: true } on Linux; false for a plain click on either, Ctrl on macOS and ⌘ on Linux. -- openFile.test.ts "which click opens a tab"
2. openFileFromTerminal(p, { inTab: true }) adds an editor tab for p and dispatches no open-preview; from a detached window the emitted payload has inTab: true, and listenForFileOpens receiving it adds a tab. -- "a modifier-click opens a tab, also from a detached window"
3. A terminal link activated with the platform modifier passes inTab: true. -- terminalFileLinks.test.ts "a modifier-click link opens a tab"
4. Clicking a file in the file browser dispatches open-preview and adds no tab; ⌘-clicking (macOS) adds the tab; clicking a folder still expands it; with an editor tab active, a plain click sets that tab's previewPath. -- src/components/__tests__/FileBrowserOpen.test.tsx "a file opens in the panel, modifier-click in a tab"

Note for F3 S1 (owner's OQ-9 (a), .ade/context/viewer-state.md): F3 story s1d rewrites the last clause of item 4 to "sets the open file of the view in sight" (ADR 0032). That is the same behaviour. Build item 4 as written here; s1d changes the test later. F3 story s1c also touches src/components/__tests__/FileBrowserOpen.test.tsx: its folder-click assertion ("clicking a folder still expands it") moves from expandNode to viewerStore.expand, with the same intent.

Docs (5): files.md: "Click a file in the browser and it opens in the panel beside the terminal; ⌘-click (Ctrl-click on Linux) or Open in tab opens it in a tab, where you can edit it." Same in terminal.md. Extend .ade/context/side-panel-files.md with the modifier rule.

Manual checks (not gating Done, pending the owner): in the file browser click a file (panel), ⌘-click it (tab); on Linux, Ctrl-click. ⌘-click in the terminal opens a tab and does not also select text. In a detached window, ⌘-click a path: a tab opens in the main window.

Out of scope: editing in the panel; the file tab's own behaviour.'''
verify = "The seven In-force lines each exit 0, with the named tests of items 1 to 4 passing by name."
