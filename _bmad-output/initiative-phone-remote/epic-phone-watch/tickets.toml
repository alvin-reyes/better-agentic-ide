[[entry]]
id = 10
type = "story"
title = "Push"
description = '''Adds APNs sending through a2 in the relay with the spec's headers and token lifecycle, push_token handling, the push limits, and the Mac's per-tab 3-second rule with the foreground signal, with injected clocks. The push gate uses story 7's acked column and story 5's pairs.
Acceptance:
(1) Relay: APNs over HTTP/2 with token auth from Fly secrets; headers apns-topic (the bundle id), apns-push-type alert, apns-priority 10, apns-collapse-id ade-needs-you; fixed body "An agent needs you" and no custom data.
(2) BadDeviceToken tries the other environment once and updates the record; 410 Unregistered deletes the token; push_token is accepted only from phones.
(3) A push is sent only to a phone paired with the requesting Mac and only once that phone has acked that pair, including after a relay restart. A Mac may not push to a phone it is not paired with.
(4) Push limits: 1 per 30 s per phone, 30 per hour. A push answered control_limited is not re-sent by the Mac.
(5) Mac, for each tab: a 3-second timer starts when the tab becomes needs you; when it ends with the tab still needing you, the Mac sends push naming its paired phones that are in the background; leaving needs you cancels the timer; entering it again starts a new one; another pane of the same tab needing you does not start a second timer; tabs that already need you when Remote turns on do not push.
(6) The background rule is story 6's (background by default, presence offline, or no foreground {on:true} for 60 s).
(7) E2E in relay/e2e/tests/, with a fake APNs sink and an injected clock: the 3-second rules including re-entry and a second pane; no push while the app reports foreground; push again after the foreground signal lapses; the environment fallback; deletion on 410; no push to a phone that hasn't acked, including after a restart.
Known uncertainty: none beyond the spec.'''
verify = "The approved verification command passes; the e2e test with the fake APNs sink passes every push rule in (1) to (7), using an injected clock."
