# Watch ADE's agents from the phone: stories in build order.

[[entry]]
id = 1
type = "story"
title = "Scaffold relay, protocol package and app with CI"
description = "Creates relay/ (protocol, core, server, cli, e2e crates), packages/protocol and mobile/ with one passing test each, the include changes and a CI job per new check."
verify = "All five verification lines pass on a fresh checkout, the e2e placeholder test appears by name in `cd relay && cargo test`, and `npm ci` in mobile/ then `npx expo export` bundles."
covers = []
after = ["epic-agent-status"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Login and presence through the relay"
description = "Tracer bullet: the relay server, the signed single-use challenge login with roles in core, presence both ways with ping, and the CLI client logging in."
verify = "An e2e test has two keys log in and see each other online, then offline on close; a replayed login and one signed for another host are refused."
covers = []
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Encoding, labels and signatures in Rust and TypeScript"
description = "Implements enc(), the ade-remote/v1 labels and Ed25519 signing in relay/protocol and packages/protocol against shared vectors."
verify = "Both languages pass the same vectors, and a signature made under one label fails under every other."
covers = []
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Noise IK sessions in Rust and TypeScript"
description = "Adds Noise_IK_25519_ChaChaPoly_SHA256 with the spec's prologue, hs1 counter, empty hs2, session ids, explicit nonces and rehandshake rules on both sides."
verify = "The cacophony IK vectors and Rust-TypeScript cross vectors pass, and the replay, gap, other-session and no-loop tests pass."
covers = []
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Pairing in Rust and TypeScript"
description = "Implements commit-then-reveal pairing, the 6-digit code, pair records, pending pairs, unpair and two-way welcome reconciliation, end to end through the relay."
verify = "An e2e test pairs the CLI with core's Mac side, and every refusal and reconciliation case in the spec's pairing tests passes."
covers = []
after = [2, 4]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Snapshots over the session"
description = "Adds the snapshot builder with the frame layout, padding, truncation, seq, want_snapshot, foreground expiry and the rate_limited resend in core and the CLI."
verify = "An e2e test shows the paired CLI receiving the first snapshot and each change in seq order, the latest state after a rate-limited last frame, and the canary title never at the relay."
covers = []
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Relay storage, limits and cleanup"
description = "Adds SQLite storage, every limit in the spec, the 90-day cleanup and the token-guarded /metrics to the relay."
verify = "A test per limit and for the cleanup passes, and no frame bytes appear in logs or the database file."
covers = []
after = [2]
hitl = false
risk = "medium"

