[[entry]]
id = 12
type = "story"
title = "The minimal Expo app"
description = '''Builds the Pair, Macs, Tabs and Settings screens on packages/protocol, with keys and pairs in expo-secure-store (keychainAccessible WHEN_UNLOCKED_THIS_DEVICE_ONLY), the random-values polyfill imported first in the entry file, and story 3's QR parser. Screen rules are the UX spec's, referenced by path only: docs/superpowers/specs/2026-10-15-phone-app-ux.md (being revised in parallel; read it when the story starts).
Acceptance:
(1) Pair: scan with expo-camera; a code whose scheme is not wss:// is refused. A code for a Mac the phone already holds (same relay and I_M) asks "Already paired" and offers to pair again; the old pair stays until the new one is acked. The Mac's name from n is shown; "Mac" when n is missing. The 6 digits are shown with Cancel, which sends pair_abort; the screen waits for paired or pair_declined. The phone aborts 30 s after its commit when no pair_nonce arrives.
(2) Pending pairs, with their 6 digits, survive a relaunch. Discard of a pending pair after the reveal is a cancel: kept hidden with its cancelled mark, sent as pair_abort now or after the next login.
(3) Dev-only URL scheme: dev builds (EAS development profile) register ade-pair; an ade-pair:// URL starts the same flow as a scan, and one arriving mid-pairing is ignored. The release app config registers no ade-pair scheme, and the release link handler ignores such a URL (both tested). This is story 12's simulator test path only.
(4) Macs screen: each paired Mac, online or offline from presence.
(5) Tabs screen for one Mac: title, project, state dot in ADE's colours, and the age of the state. Tabs with state null show "No agent" and rank below finished; an unknown state shows "Unknown" and the rest of the snapshot is used. A snapshot whose seq is not above the last one seen in this session is ignored. A non-null age_s beside a null state is ignored.
(6) Pull to refresh sends want_snapshot; so does coming to the foreground and every 60 s while there. foreground {on} is sent on change and every 30 s while on.
(7) Snapshots are kept in memory only: nothing from a snapshot is written to storage, logs or a notification.
(8) Pending pairs send pair_status after each welcome and every 60 s; cancelled ones send pair_abort. Recorded replaced ids are kept hidden and dropped by story 5's rules.
(9) Settings: Unpair removes every pair with that Mac, discards its pending pairs and queues the unpairs; the app version is shown.
(10) The QR parse uses the shared parser from story 3 and never decodeURIComponent, so a malformed % escape in n counts as missing.
(11) crypto.getRandomValues comes from the polyfill, imported before any @noble module.
Known uncertainty: this story is too large for one Dev agent (screens, pair store, snapshots and the dev scheme); a split is proposed to the owner and is not applied.'''
