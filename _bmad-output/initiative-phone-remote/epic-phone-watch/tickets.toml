[[entry]]
id = "12a"
type = "story"
title = "The pair screens and the pair store in the minimal app"
description = '''Builds the pairing screens of the minimal Expo app, on story 5b's phone side in packages/protocol: Pair: scan, Already paired, Pair: code, Finishing pairing, the endings, Close and Stop pairing, the Pairings off screen rules, the pair store and the dev-only ade-pair scheme. Screen rules are the UX spec's, referenced by path only: docs/superpowers/specs/2026-10-15-phone-app-ux.md, sections "1. Pair: scan", "2. Already paired", "3. Pair: code", "4. Finishing pairing" and "Pairings off screen" (read it when the story starts; it is being revised in parallel). Keys and pairs live in expo-secure-store with keychainAccessible WHEN_UNLOCKED_THIS_DEVICE_ONLY; react-native-get-random-values is imported first in the entry file. The QR parser is story 3's.
Acceptance:
(1) Pair: scan reads one code once. A code that is not a pairing code, that points at an insecure relay, or that is ade-pair://v2 or later shows the UX spec's text under the frame; the code refused just now is ignored if scanned again during the same visit. The n rules (missing, or a malformed % escape, means "Mac") are story 3's.
(2) Already paired: a code whose relay and I_M match a held pair goes to Already paired, with Pair again (to Pair: code) and Cancel (back to scan); the old pair keeps working until the new one is acked. A Mac with only a pending pair goes straight to Pair: code, and the new attempt takes over that Mac's one entry.
(3) Pair: code buttons: before the digits, Cancel. With the digits, Close at top left (leaves the screen; the pending pair keeps going) and Stop pairing at the bottom, with no confirmation. Stop pairing before the reveal sends pair_abort and stores nothing; after it, the pending pair leaves every list at once and is kept hidden with its cancelled mark, and a later paired for it is unpaired at once.
(4) Pair: code states: Connecting ("Reaching your Mac…", and after 30 s with no pair_nonce the phone aborts with "Your Mac didn't answer"); Waiting for confirm (the digits as two groups of three, and a countdown from the ttl_s in pair_nonce, counted from its arrival and never negative; at 0:00 "Waiting for the relay's answer" until pair_ended; the countdown is not a live region); Can't reach the relay (digits stay, "Can't reach the relay. Reconnecting…", unbounded until the relay answers or the user stops); Paired (after the step-8 checks: a check mark, announced, then the next screen after 1 s); Ended. The digits are sent to the reveal as soon as they show.
(5) Endings: each reason maps to the UX spec's title and body (expired, taken, declined, cancelled, disconnected, unpaired, unknown, no pair_nonce in 30 s, checks failed); the phone's own connection drop before the digits is shown as disconnected at once; every ending offers Scan again.
(6) Finishing pairing, reopened from Macs or Settings including after a relaunch: Close, the stored digits with "with <Mac name>", the status line from the last answer ("Confirm on your Mac if the codes match.", "Can't reach the relay. It finishes when this phone reconnects.", or "Checking with the relay…"), and Stop pairing at the bottom; no expiry is shown.
(7) Pairings off screen: an attempt's endings and paired change the screen only while that attempt's Pair: code or Finishing pairing screen is on top. Otherwise a first-pairing ending removes its row and shows a non-modal notice for 6 s or until tapped, announced to VoiceOver; a re-pair ending shows "Pairing again with <Mac name> didn't finish. The current pairing still works."; a cancelled ending while a newer attempt with the same Mac exists is silent; an ending of an attempt the phone stopped is silent; a first-pairing paired turns its row ordinary in place with the notice "Paired with <Mac name>." and no navigation; a re-pair paired is silent and updates the Mac name; a paired for an older attempt whose Mac has a newer attempt on screen makes the Mac paired, and the attempt on screen carries on as a re-pair.
(8) The pair store keeps pending pairs, cancelled marks, replaced records, queued unpairs and aborts, and the 6 digits, across a relaunch; no snapshot content is stored.
(9) Dev-only scheme: dev builds (EAS development profile) register ade-pair, and an ade-pair:// URL goes through the same parser and screens as a scan, ignored while a pairing is under way. Release builds register no ade-pair scheme and their link handler ignores such a URL; both are tested in the app config and the handler. This is the simulator test path only.
(10) Names: the Mac's name is the code's n, cleaned, "Mac" when missing or empty, shown as plain text; the phone's device name sent in the reveal is expo-device's deviceName cleaned by the Names rule.
Not here: the Notifications sheet after a first pairing off screen (story 13); the Macs and Settings screens and the launch rule (story 12b).'''
verify = "The jest-expo tests for (1) to (10) pass under the approved verification command; on a simulator a dev build pairs with core's Mac side through a local relay, and the endings and Finishing pairing screens are reachable."
covers = []
after = ["5b"]
hitl = false
risk = "high"

[[entry]]
id = "12b"
type = "story"
title = "Macs, tabs and settings on snapshots in the minimal app"
description = '''Builds the Macs, Tabs and Settings screens, the launch rule and the navigation, and the app-switcher privacy cover, on story 6's snapshots and story 12a's pair store. Screen rules are the UX spec's, referenced by path only: docs/superpowers/specs/2026-10-15-phone-app-ux.md, sections "Navigation", "6. Macs", "7. Tabs", "8. Settings" (the Notifications row is story 13's), "Privacy on screen", "Foreground and background", and "Accessibility" for these screens. Read it when the story starts; it is being revised in parallel.
Acceptance:
(1) Launch rule: no entries opens Pair (root, no Close); one entry that is paired opens its Tabs, with back to Macs; anything else opens Macs. A cold start from a notification follows this rule; a warm start keeps the current screen.
(2) Macs: one row per Mac key, plus a row for a Mac held only as a pending pair (Finishing pairing, opening the newest attempt). Row states: online (green dot, "Online"), connecting (spinner, "Connecting…"), offline (hollow ring, "Offline"), pending. The needs-you count comes from the current session's snapshot only and shows when above 0 ("2 need you"; VoiceOver "2 tabs need you"). Sort: rows with a count first (largest first), then online, connecting, offline, pending; by name within each. A paired Mac with a pending re-pair shows its paired row unchanged. The caption and the relay-unreachable notice are as the UX spec says.
(3) "No longer paired" alert, once, when a pair is removed and no pair with that Mac remains (a removal that leaves a pair is silent); several at once collapse into one alert; OK removes a Tabs screen that was open for that Mac; with no entries remaining, Pair (root).
(4) Tabs rows: dot, title, project, and the state label with age on the right; sort by state order, then longest in that state first, then title. Unknown and no agent rows show their labels, no age, and sort last below finished. Age is age_s plus the phone's wall clock since the snapshot arrived (a negative difference counts as 0), shown as "12 s", "4 min", "3 h", "2 d" (rounded down), updated each second under a minute and every 30 s otherwise. "Untitled tab" for an empty title; an empty project hides its line; plain text only.
(5) Tabs states: Connecting with nothing in memory ("Loading tabs…"); Connecting or Offline with an earlier snapshot in memory, in past tense with ages frozen and the banner "Last seen: N tabs needed you"; a new snapshot returns to live; total 0 ("No tabs open"); truncated ("Online · 200 of 312 tabs", with the last row "Showing 200 of 312 tabs. The least urgent are left out."); Offline with nothing in memory; relay unreachable ("Can't reach the relay" in the status line).
(6) Pull to refresh sends want_snapshot. With no session but the Mac online it starts a handshake, within the spec's limit of one restart per 10 s (if one was just made, it waits for that one). After 10 s with no snapshot it shows "Couldn't refresh. Showing the last update from 2 min ago." or, with nothing in memory, "Couldn't reach <Mac name>."; with the Mac offline the spinner stops at once. (Follow-up from commit 59e1d9c.)
(7) Foreground: a handshake on coming to the foreground; want_snapshot on coming to the foreground and every 60 s there; foreground {on} on change and every 30 s while on; nothing updates in the background, and there is no app lock in 2a.
(8) Snapshots stay in memory only: nothing from a snapshot is written to storage or to logs, and release builds log no titles, projects or states.
(9) Banner: "N tab(s) need(s) you" with "Answer at your Mac", a header and not a button, hidden when no tab needs you. Footer: "Watching only. Answer prompts at your Mac. Pull down to refresh."
(10) Settings: each paired Mac with Unpair (danger) and its action sheet ("Unpair <Mac name>?", Unpair destructive, Cancel). Unpair removes every pair the phone holds with that Mac and discards its pending pairs (story 5b's rule), takes effect at once and is queued while offline; any Tabs screen for that Mac is removed from the stack. Each pending pair is listed as "Finishing pairing", opening Finishing pairing (story 12a) with Stop pairing. Empty: "No Macs paired" and Pair a Mac. About: the version from the app config and the privacy note verbatim from the UX spec.
(11) App-switcher privacy cover: when AppState goes inactive or background, a full-screen cover shows the app glyph and "ADE Remote" only, and it lifts on active. Test: the cover renders on inactive and background and is removed on active, and no title, project or state is in its render tree.
(12) Accessibility on these screens per the UX spec: a tab row and a Mac row are each one element; the banner is a header; icon-only buttons are labelled; AX1 stacking; every tappable target at least 44 x 44 pt, including Unpair, Stop pairing, the gear and the +; Reduce Motion stops spinners.
Not here: the Notifications screen and its Settings row (story 13); the pair screens (story 12a).'''
verify = "The jest-expo tests for (1) to (12) pass under the approved verification command; on a simulator the app shows Macs, Tabs and Settings from a live local relay, including the No agent and Unknown rows, the truncated line and the privacy cover."
covers = []
after = [6, "12a"]
hitl = false
risk = "medium"

[[entry]]
id = 13
type = "story"
title = "Push on the phone and the TestFlight build"
description = '''Adds expo-notifications with its config plugin and the build-time APNs environment, the token on each launch, the foreground handling, the first-pairing Notifications screen and its Settings row, and builds and submits with EAS to TestFlight. Screens are the UX spec's, referenced by path only: docs/superpowers/specs/2026-10-15-phone-app-ux.md, sections "5. Notifications [S13]", "Notifications [S13] after a pairing off screen" (in "Pairings off screen"), "Navigation" (the Notifications bullet) and "8. Settings" (the Notifications row). Every [S13] item of the UX spec is this story's; no [P3] item is.
Acceptance:
(1) push_token {token, env} is sent on every launch; env is a build-time constant from the EAS profile: production for TestFlight and store builds, sandbox for development builds (a test of the constant per profile).
(2) The iOS permission prompt is not shown at launch; it fires only from the Notifications screen or the Settings row.
(3) Notifications screen [S13]: shown once, after the first pairing ever, on screen, between Pair: code and Tabs for the new Mac; title "Know when an agent needs you" and the body from the UX spec; "Turn on notifications" (the iOS prompt) and "Not now"; either leads to Tabs for the new Mac.
(4) First pairing completed off screen [S13]: the Notifications screen is shown once as a sheet the first time a Tabs screen opens afterwards; either button closes it. Test: a flag is set at the first pairing, the sheet shows once and the flag clears when it is shown, and a later pairing does not show it again.
(5) Settings row [S13]: "On", or "Off" with "Turn on", which fires the iOS prompt if it has not been asked, else opens iOS Settings.
(6) Foreground push [S13]: a push while the app is open shows no banner and plays no sound, and sends want_snapshot to each Mac with a session, and the open screen updates (a test of the notification handler).
(7) Tapping a notification opens the app, which follows the launch rule (story 12b), connects and handshakes. The notification body is the fixed text "An agent needs you" with no custom data; the app does not read or store any payload content.
(8) EAS builds and submits the app to TestFlight; there is no analytics and no crash reporter of the app's own; the UX spec's privacy note about notifications matches the shipped behaviour.
Moved here from story 12: everything the UX spec tags [S13].'''
verify = "The jest tests for (1) to (7) pass under the approved verification command; the TestFlight build installs on the owner's iPhone, shows the Notifications screen after the first pairing, and receives a push through the Fly relay."
covers = []
after = [10, 11, "12b"]
hitl = true
risk = "medium"

