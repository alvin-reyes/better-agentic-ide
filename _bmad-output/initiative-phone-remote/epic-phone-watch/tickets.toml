[[entry]]
id = 8
type = "story"
title = "ADE's Remote bridge"
description = '''Adds remote_tabs_set and the tab registry, the KeyStore with per-build keychain services, the remote.enabled and remote.relayUrl settings, the bridge reading AgentStatus::current() through core, and the Mac's pairing data in ADE's app state, driven through core's Mac side.
Acceptance:
(1) remote_tabs_set takes (window_label, tabs); each tab is keyed by (window_label, tab_id) with an opaque random remote id; two windows that both have tab-1 stay distinct; a closing window's entries are cleared on its Destroyed event; panes roll up into their tab; PTY ids never leave the Mac.
(2) A tab with no agent is in the registry and goes out with state null.
(3) The bridge's sink only signals: no I/O, no lock of its own, no timer; the bridge thread reads current().
(4) KeyStore is in memory for the tests; the dev and release keychain services differ; keys are read only while Remote is on; Remote off closes the connection and keeps the pairs.
(5) App state holds: the Mac's pair list keyed by relay URL and the Mac's identity key; pending pairs (pair id, record fields, sig_M, sig_P, the phone's name, slot); replaced records (each old pair with the id that replaced it); queued unpairs and aborts; and the hs1 counter per (Mac identity key, phone identity key). All survive an app restart. Two identities sharing one state file each keep their own pairs.
(6) The bridge sends a stored pair_confirm again after each welcome and every 60 s while the pair is pending (injected clock), and re-sends a lost pair_abort or pair_decline after each welcome until pair_state answers.
(7) On reconnect with the pairing view open and no reveal received, the bridge sends pair_abort for the old slot, opens a new slot and redraws the QR (the UI is story 9's).
(8) welcome reconciliation touches only the entries under its own relay URL and identity key.
Spec tests: remote_tabs_set including two windows that both have tab-1 and a window closing; panes rolled up into tabs; the sink only signalling; KeyStore in memory; the dev and release services differing; Remote off closing the connection; and the state-file and re-send tests in (5) and (6).'''
