title = "Push"
description = '''Adds APNs sending through a2 in the relay with the spec's headers and token lifecycle, push_token handling, the push limits, and the Mac's per-tab 3-second rule with the foreground signal, with injected clocks. The push gate uses story 7's acked column and story 5's pairs.
Acceptance:
(1) Relay: APNs over HTTP/2 with token auth from Fly secrets; headers apns-topic (the bundle id), apns-push-type alert, apns-priority 10, apns-collapse-id ade-needs-you; fixed body "An agent needs you" and no custom data.
(2) BadDeviceToken tries the other environment once and updates the record; 410 Unregistered deletes the token; push_token is accepted only from phones.
(3) A push is sent only to a phone paired with the requesting Mac and only once that phone has acked that pair, including after a relay restart. A Mac may not push to a phone it is not paired with.
