[[entry]]
id = "h10"
type = "story"
title = "Exemptions: the file, pattern and registry grammar, loaded and checked"
description = '''F1 slice 0. Design 15.4 ("Exemptions") and O8, approved by the owner with the architecture. ADR 0020 (every exemption after slice 0 needs the owner's approval).

Adds isotest/src/exemptions.rs and isotest/exemptions.toml, which holds only a header comment in this story. The starting list of design 15.4 is added by the kind-4 review (h22), not here.

Each entry has reason and platform (macos, linux or windows) and exactly one of:
- file: an exact path starting at a named root ($CACHE, $TEMP, ~, %LOCALAPPDATA%, <harness home>; the plan lists the named roots it uses);
- pattern: a path starting at a named root, each segment a literal or a glob limited to that segment, with the placeholders <id> (harness bundle id), <hex> (one or more hex digits), <n> (one or more decimal digits) and * (any characters but the separator). No **;
- registry: an HKCU key path with the same segment grammar and a value-name pattern, or * for the key's values, never its subkeys.
Load-time rules, the load fails naming the entry: every pattern contains <id> or an app-specific literal segment from the fixed list (com.apple.metal, com.apple.metalfe, EBWebView, claude, ade-<hex>.sock, ade-<hex>.lock, and any the owner adds); * is never the first segment after the root. An exempt path or value that holds a marker is still a finding; the caller reports it.

Acceptance, each a test:
(1) loads_a_valid_pattern.
(2) refuses_double_star.
(3) refuses_pattern_without_app_literal.
