# F1 slice 0: the isolation harness. Prerequisites first (pa, pb1 to pb7: DevOps, owner's order), then the harness (h1 to h22), then the isolation job's set-up (pc1 to pc4).
# Gate: architecture.md, "F1 stories (gate D28)", items 1 to 5. Design: docs/superpowers/specs/2026-11-08-personas-and-engagements-design.md, sections 15, 20, 21.
# Every entry runs the local lines of architecture item 1 and the backend jobs of item 3. Isolation runs follow the slice 0 rule in the epic notes (Q1).

# ---------- Prerequisite (a): the stub, owner merges ----------

[[entry]]
id = "pa"
type = "story"
title = "DevOps: dispatch-only stub isolation.yml on main, and its dispatch test"
description = '''Prerequisite (a) of F1 slice 0. Architecture item 4 and "Depends on (DevOps)". Owner: DevOps. The owner merges it to main; slice 0 does not start until its result is recorded.

Adds .github/workflows/isolation.yml on main with on: workflow_dispatch only, no concurrency group, and one job that prints the word stub and exits 1, so a stub run can never be green. It adds no other file.

Then the acceptance test (architecture item 4, minor 7 of revision 5b). DevOps pushes a throwaway branch whose isolation.yml differs from the stub only in printing branch-file (and exiting 1). It runs gh workflow run isolation.yml --ref <throwaway>, reads the log, and records in this story's Verification section the run URL and which string the log shows.
- branch-file means dispatch runs the branch's file. Item 4 stands as written.
- stub means it does not. Then this story's Verification section says so, and the fallback applies before slice 0 starts: isolation.yml also runs on push to story branches, QA does not dispatch it, and those push runs count under item 4's rule. The owner decides before slice 0 starts.
Delete the throwaway branch afterwards.

Acceptance, each checked by the recorded output:
(1) main's isolation.yml exists, is dispatch-only, and a dispatch of main's stub run ends red with stub in its log.
(2) The throwaway branch's dispatch run is recorded with its URL and the string its log shows.
(3) The throwaway branch is deleted (git ls-remote shows no such branch).
(4) ci.yml is unchanged.'''
verify = '''The workflow file is on main; the throwaway dispatch run URL and its string are in the Verification section; the throwaway branch is gone. Local lines and CI are not affected (no code changes); the stub run is red by design. Isolation: not applicable (a workflow stub, no harness code).'''
covers = ["PE-4"]
after = []
hitl = true
risk = "high"

