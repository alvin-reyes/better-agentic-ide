[[entry]]
id = "h5"
type = "story"
title = "fsx: absolute paths, same_path, the no-follow walk and the no-follow delete"
description = '''F1 slice 0. Design section 20 ("Links are never followed", "Long paths", "Path equality"); ADR 0015 (no-follow delete). The file is Q2's assumption: src-tauri/src/fsx.rs.

Creates the fsx module with only the functions the harness uses in slice 0. Adds rust-version = "1.79" to the src-tauri package manifest (design 20).
- absolute(path): refuses a relative path with an error (a programming error, design 20).
- same_path(a, b): both canonicalised where they exist; on Windows a leading \\?\ or \\?\UNC\ removed and the rest compared ordinal, ignoring case; on macOS and Linux byte-equal.
- walk_no_follow(root): symlink_metadata only; every symbolic link, and on Windows every reparse point (junctions included), is recorded and never entered.
- remove_tree_no_follow(path): built on std::fs::remove_dir_all, which removes a link or junction and not its target.
Platform-only tests are added to src-tauri/platform-tests.txt in this story, as windows entries with crate app.

Acceptance:
(1) same_path_vectors: case, \\?\ and \\?\UNC\ prefixes, and non-ASCII names (every platform).
(2) absolute_refuses_relative_path.
(3) walk_records_a_symlink_and_does_not_enter_it: a planted link to a sentinel folder holding a marker name (every platform).
(4) remove_tree_removes_a_link_not_its_target: the sentinel folder is intact (every platform). This is the planted-link test design section 20 requires.
(5) windows_only: junction_is_recorded_and_not_entered.
(6) windows_only: junction_is_removed_as_a_link.
(7) windows_only: a tree whose deepest path passes 400 characters is walked and deleted (long_path_walk_and_delete).
(8) The three windows_only tests are in platform-tests.txt with the platform windows and crate app.'''
