id = "pc4"
type = "story"
title = "DevOps: compare the two runs of each platform, and the slice 0 gate run"
description = '''DevOps, slice 0. Architecture item 2 ("slice 0 only", two runs), item 4 (how runs are cited); design 15.5 ("Deterministic").

Adds a final job, compare, to isolation.yml. It downloads both runs' keys.json and report for each platform, and fails unless, for each platform: both verdicts equal the xfail line exactly, and the two sets of marker-finding keys are equal. Kind-4 findings are reported and not compared. It prints a table with the platform, each run's verdict and whether the keys are equal. A missing artifact is red. The comparison is a script (scripts/compare-isolation.mjs) with its own tests.

This is the last slice 0 build story. Its Verification section carries the QA same-SHA runs for the slice gate, cited as architecture item 4 says (gh run list for the SHA, the gh run view JSON with headSha, event and attempt, and each job's summary).

Acceptance:
(1) compare_green_when_verdicts_and_keys_match (script test).
(2) compare_red_when_keys_differ.
(3) compare_red_when_a_run_is_missing.
(4) compare_ignores_kind_4_paths.
(5) The compare job is green on the story's SHA for every platform, two runs each.'''
verify = '''Local: all eight lines exit 0 and tests (1) to (4) pass in npm test. CI: the story's SHA has counted runs of isolation.yml on all three platforms, two runners each, all green, with the compare job green; the ci.yml backend jobs are green for the SHA. The runs are cited as architecture item 4 says. Isolation: required (this is the slice 0 gate), item 2's slice 0 rule.'''
covers = ["PE-4"]
after = ["pc3"]
hitl = false
risk = "high"

[[entry]]
id = "h22"
type = "spike"
title = "Kind-4 review of slice 0's runs, and the owner's approval of new exemptions"
description = '''Spike, slice 0's last gate. Design 15.6 ("The kind-4 review"); architecture item 2 ("slice 0 is not Done until the list is complete and the owner has approved the new exemptions"); O8.

Who waits on the answer: slice 1 (its `e29` and `e30`). Where it is recorded: this spike's plan file (Verification section) and the epic's notes.

The architect lists every kind-4 finding of pc4's counted runs, per platform, with its path. Each is marked as one of: exempt, owner to approve (with the pattern); ADE write, fixed in slice 1 (with the story); or OS noise misattributed, rule refined (with the rule change). The owner approves each new exemption. Approved patterns go into src-tauri/isotest/exemptions.toml in one commit, checked by h10's loader. Slice 0 is Done when the list is complete and approved.

Acceptance:
(1) Every kind-4 path from the counted runs appears in the list, with a mark.
(2) Each new exemption has the owner's approval recorded.
(3) exemptions.toml loads (h10's test passes).
(4) The approved exemptions do not hide a marker (an exempt path that holds a marker is still a finding; a test asserts it).'''
verify = '''The list and the owner's approvals are in this spike's Verification section; cd src-tauri && cargo test -p isotest passes with the approved exemptions loaded. Isolation: not a code change beyond the exemptions file; the runs cited in pc4 are the evidence.'''
covers = ["PE-4"]
after = ["pc4"]
hitl = true
risk = "high"
