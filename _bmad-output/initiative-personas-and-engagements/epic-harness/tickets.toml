[[entry]]
id = "h12"
type = "story"
title = "Verdict: every finding kept, one ordered verdict, the determinism keys"
description = '''F1 slice 0. Design 15.5 ("The checks and the one verdict", "Deterministic"), ADR 0020 (one verdict).

Adds isotest/src/verdict.rs. It computes every check and keeps every finding of every kind, then prints one verdict: the first failing check of this order, else pass:
1 step could not run;
2 scanner blind (a marker the scenario wrote was found nowhere);
3 marker of A found outside A's allowed locations;
4 write outside A's allowed locations (while A's process existed, no marker, not exempt);
5 B changed (B's files or secret entries differ byte for byte);
6 marker not in A (positive control);
pass.
The verdict strings are exactly these, for example marker of A found outside A's allowed locations.
Each finding carries its kind, marker role, path, encoding and offset.
Keys, one per finding: (marker role, finding kind, location class: A's allowed, exempt or neither, normalised store root). The normalised store root is the LevelDB folder for a table or log, the SQLite main path for its -wal, -shm and journal, the plist's path, else the file's path. The harness home, profile ids, per-run ids and numeric file sequence numbers are replaced by placeholders. Offset, file within a store and encoding are reported and never part of the key.

Acceptance, each a test:
(1) verdict_order: for each pair of failing checks, the earlier one is printed.
(2) every_finding_is_kept_under_one_verdict.
(3) key_ignores_offset_and_encoding.
(4) key_normalises_a_leveldb_folder.
(5) key_replaces_run_ids_and_sequence_numbers.
(6) pass_when_no_finding.
(7) report_lists_every_kind_4_path.
(8) verdict_strings_match_the_table_exactly.'''
