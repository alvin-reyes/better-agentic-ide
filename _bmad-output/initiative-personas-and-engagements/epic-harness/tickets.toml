# ---------- Slice 0: the harness ----------

[[entry]]
id = "h2"
type = "story"
title = "Shared test helpers: require_shell, require_secret_service, require_keychain, require_console"
description = '''F1 slice 0. Design 20 ("Test support"); architecture item 3, minor 3 of revision 5b.

Creates src-tauri/src/test_require.rs, the one test-support module that listed platform tests may use for preconditions. It holds four helpers, each returning the value or panicking, never returning Option or Result:
- require_shell(name: &str) -> PathBuf (for example require_shell("fish"));
- require_secret_service() -> ();
- require_keychain() -> ();
- require_console() -> ().
Each panic message begins with precondition missing: and names what is missing. Each helper takes its lookup as a parameter (a seam: a function for which, a closure for the probe), so a test can inject absence. The file is shared into ade-hook and isotest with #[path], as ade-hook shares hook_forward.rs. No ADE code uses the helpers in this story.

Acceptance:
(1) require_shell_returns_the_found_path (injected lookup finds the path).
(2) require_shell_panics_naming_the_missing_shell (injected lookup finds nothing; the panic message names fish).
(3) require_secret_service_panics_naming_the_bus (probe fails).
(4) require_keychain_panics_naming_the_keychain (probe fails).
(5) require_console_panics_naming_the_console (injected console check fails).
(6) The helper file has no return of Option or Result (a grep test in the static test of h3, or a unit test on the signatures).'''
