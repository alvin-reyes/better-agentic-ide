[[entry]]
id = "h3"
type = "story"
title = "Static test: the rules for listed platform tests and platform-only modules"
description = '''F1 slice 0. Architecture item 3 ("Platform-only tests live in modules named windows_only, macos_only or linux_only"; the static test's rules) and design 20 ("Tests first"; the listed-test rules, M-C and minor 3 of revision 5b).

Adds src-tauri/tests/platform_tests.rs, a static test run by cargo test on every platform. It reads the source of src-tauri/src, src-tauri/tests, src-tauri/ade-hook/src and src-tauri/isotest/src (parsed with syn; the dependency is Q3) and enforces the rules that concern listed tests:
(a) A #[test] function inside a module named windows_only, macos_only or linux_only must be listed in src-tauri/platform-tests.txt for that platform.
(b) A listed test's body (any test named in the list) must not contain: a return; a string literal containing skip in any case; #[ignore]; a direct call of which, std::env::var, var_os, vars or vars_os; exists, try_exists, is_file, is_dir, metadata or symlink_metadata inside a condition; or Command::new with a string-literal program. A condition is: the scrutinee of if, if let, while, while let, match and let-else; a match arm guard; either operand of && and ||; the receiver of bool::then and then_some; the expression argument of matches! with its guard. The assert family (assert!, assert_eq!, assert_ne! and debug_ forms) is allowed.
(c) A let whose initializer calls one of those primitives, with the bound name used in a condition later in the same body, is rejected. assert!(ok) is allowed. Names are followed, not bindings.
Each rule has a fixture in src-tauri/tests/fixtures/platform_tests/ that must be flagged, and an allowed fixture that must pass.

Acceptance, each a test in platform_tests.rs:
(1) platform_list_missing_listed_test_is_flagged.
(2) platform_list_rejects_return.
(3) platform_list_rejects_skip_string (any case).
(4) platform_list_rejects_ignore_attribute.
(5) platform_list_rejects_lookup_in_condition.
(6) platform_list_rejects_bound_lookup_then_branched.
(7) platform_list_allows_assert_on_exists.
(8) platform_list_rejects_command_new_with_literal_program.
(9) platform_module_test_must_be_listed.
(10) the static test passes on the current tree (no listed test exists yet).'''
verify = '''Local: all eight lines exit 0 and tests (1) to (10) appear by name in cd src-tauri && cargo test. CI: the three backend jobs green (the static test runs on each). Isolation: not required (static, no I/O, Q1).'''
