[[entry]]
id = "e5"
type = "story"
title = "Durable writes in fsx: sync_file, sync_dir, write_atomic, and the macOS fallback"
description = '''F1 slice 1. Design section 20 ("Durable writes (M-F of revision 5)", "A syscall seam"); the contract's "Durable writes" references; ADR 0015 for the deletes.

Extends src-tauri/src/fsx.rs (h5) with:
- sync_file(file) and sync_dir(dir): on Linux, fsync and fsync of the folder read-only; on Windows, File::sync_all and FlushFileBuffers on a folder handle opened with backup semantics, where that is refused the write-through rename is the guarantee; on macOS, fcntl(F_FULLFSYNC) itself, with a fallback to fsync only when it fails with ENOTSUP, EINVAL or ENOTTY, the fallback recorded once per volume through a callback to the log. Any other error is returned.
- the syscall seam trait Sys with full_fsync, fsync, flush_file_buffers and move_file_ex; the production implementation, and a recording one for tests.
- write_atomic(path, bytes): a temp file in the same folder, synced, renamed over the path (no replace on the tombstone case, Windows MoveFileExW with MOVEFILE_WRITE_THROUGH), then the folder synced.

Acceptance:
(1) write_atomic_leaves_old_or_new_never_partial (a kill between steps, recording seam).
(2) order_file_sync_then_rename_then_dir_sync (the recording backend asserts the order).
(3) macos_only: sync_file_issues_f_fullsync and sync_dir_issues_f_fullsync.
(4) macos_only: enotsup_falls_back_to_fsync_and_records_once.
(5) windows_only: write_through_rename_has_no_replace.
(6) windows_only: folder_flush_is_issued.
(7) The macos_only and windows_only tests are in src-tauri/platform-tests.txt with the crate app.'''
