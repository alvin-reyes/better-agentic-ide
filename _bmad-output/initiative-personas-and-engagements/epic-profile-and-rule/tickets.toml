title = "The slice 1 scenario: the real create and start, the ProfilePaths table, and the slice 1 steps"
description = '''F1 slice 1. Design section 15.2, 15.6 (the stand-ins are replaced in this slice), 15.3 (the table built from ProfilePaths); PRD PE-4 AC9 (the slice 1 scenario).

Replaces the slice 0 stand-ins with the real code:
- create A: through the default's UI (or its command, through the driver), with A's name, client name, owner, folder and persona typed. A's markers reach the registry only (e8).
- start A: the default starts A's instance through the engagement starter (e19); A's readiness comes from its own report through the driver (e20).
- the stand-in table of default-owned locations (h11) is replaced by the table built from ProfilePaths (e1). A test asserts that the new table's default-profile rows cover every row of the stand-in table, so the table cannot shrink unseen.
- the stand-in registry file is replaced by the real registry (e6).
The slice 1 steps of A's instance are the ones of h17 and h18, less h18's step 4, with (a) the Scratchpad, notes, drafts, Orchestrator, role-file agent launch (Q6), pasted image, recording, saved workspace, local snapshot and crash-log steps, (b) the temp-variable file, (c) Agent status on and off (e28). No Claude Code step: h18's step 4 (the real claude mcp add and claude mcp list) and any write into A's Claude config dir are not in slice 1. Decided by the owner on 2026-11-08 (epic notes): they join the scenario in slice 2, with ADR 0023's split home.

Acceptance, with fake drivers:
