[[entry]]
id = "e10"
type = "story"
title = "Unix probe, keep-alive and the lost-lock state"
description = '''F1 slice 1. ADR 0018 ("The probe", "Keep-alive", invariant L); contract engagement-profiles.md ("The probe", "Keep-alive pass"); design section 5; PRD PE-12 AC1.

Adds, on Unix, in launcher/channel.rs and launcher/probe.rs:
- probe_instance(profile) -> Liveness: takes the lock as a binder does, without writing a record. Taken: connect to the socket; absent or refused is not running, and the function returns the lock guard; accepted is not answering. Held: the endpoint passes the peer check and answers hello with the expected profile within 1 s is running; anything else is not answering. Any other error (no flock, .run failing its checks) is not answering. Not running comes only from this path (invariant L).
- the keep-alive pass every 60 s, lock file first: a removed lock file is re-opened and its flock taken; then, only while A holds the lock at the lock path, a removed socket is rebound.
- the lost-lock state: when the take still fails after 5 s of retries, and the new file's record names another live process whose serving is confirmed (the socket path's inode is not A's, or a hello there comes from another pid), A logs the conflict once, never runs the socket check or the take again, stops writing in its root, and tells the engineer to quit the window.
The clock is injectable.

Acceptance:
