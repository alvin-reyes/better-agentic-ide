description = '''F1 slice 1. PRD PE-1 (AC2 unknown keys kept, AC3 starters copied and never written back), limited to what slice 1 needs; PRD revision 9k (PE-1 AC3: slice 1 ships one starter, Software Engineer). Contract engagement-registry.md ("Persona library", with the starter rules A1 to A4 and "When a starter is copied", M5); design revision 5h (A1 to A4) and 5i (M5, minor 10). The editing UI is slice 4.

