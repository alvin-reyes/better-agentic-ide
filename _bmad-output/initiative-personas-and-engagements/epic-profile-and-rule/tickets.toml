(6) keepalive_interval_is_60s (injected clock).
(7) lost_lock_never_rebinds_the_socket (linux_only and macos_only, the shared body; listed).
(8) lost_lock_writes_nothing_more_in_the_root (listed with (7)).
(9) a probe error other than the above is not answering (a seam).'''
