# ---------- Channel, lock and requests ----------

[[entry]]
id = "e9"
type = "story"
title = "Unix channel bind: the flock lock, the socket, the peer check, and the frame"
description = '''F1 slice 1. ADR 0018 (channel and lock, invariant L); contract engagement-profiles.md ("Control channel", "The bind"); design section 5; design 21 (the listed rows for Linux and macOS).

Adds src-tauri/src/launcher/channel.rs (Unix). The bind runs in this order, and every step is tested:
1. take the lock: <profiles base>/.run/ade-<h>.lock, created 0600 with O_NOFOLLOW and O_CLOEXEC; flock LOCK_EX|LOCK_NB, retried for 2 s then exit 2; fstat and lstat must give the same device and inode; the lock record is one line (process id and start time). The .run folder is mode 0700, owned by the user, not a symlink, checked before every open.
2. an engagement instance checks its profile root (lstat, a folder); if absent, it unlinks the lock file it holds (if the path still names it) and exits 2.
3. connect to the socket: absent or refused, unlink it and bind; accepted, exit 2 naming the path. The socket is $(getconf DARWIN_USER_TEMP_DIR) on macOS, and $XDG_RUNTIME_DIR/ade/ (a 0700 folder with the checks; /tmp/ade-<uid>/ with the same checks when there is no runtime folder) on Linux.
4. only then, the rest of the start (the log is opened here).
The descriptor lives in a never-dropped static with FD_CLOEXEC.
Peer check on accept and connect: getpeereid (macOS) or SO_PEERCRED (Linux) uid equal to the own uid.
Frame: a u32 big-endian length (at most 65536), then one UTF-8 JSON request per connection. A connection with no request within 5 s is closed.
The channel exists only with F1 on: the bind function takes the flag as an argument, and with the flag off it creates no .run folder (e22 supplies the flag).

Acceptance:
(1) frame_length_limit and the one-request rule (unit).
(2) idle_connection_closed_after_5s (paused clock).
(3) peer_of_another_uid_is_refused (a seam).
(4) the bind order (a recording seam: lock, then root check, then socket, then log).
(5) flag_off_creates_no_run_folder.
(6) linux_only: the lock file and the socket are unlinked under a live A and the first A never rebinds over its socket (the shared body, called from a linux_only test and a macos_only test).
(7) linux_only and macos_only: flock_race_two_binds_one_wins.
(8) linux_only and macos_only: the lock is FD_CLOEXEC and never inherited by a child (a test that spawns a child and reads its fd table).
(9) linux_only and macos_only: .run is refused when it is a symlink or not mode 0700 or not owned by the user.
(10) the listed tests (6) to (9) are in src-tauri/platform-tests.txt for their platforms.'''
