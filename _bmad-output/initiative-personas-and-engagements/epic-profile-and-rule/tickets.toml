(5) the backend jobs are green for the SHA.
(6) the slice 1 gate is recorded as done only when (4) and (5) hold.
(7) no real Claude Code step ran: e29's test (3) passes on the story's SHA, so the counted runs write nothing into A's Claude config dir.'''
