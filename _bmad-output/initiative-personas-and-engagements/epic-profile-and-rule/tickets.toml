(3) the step list for slice 1 matches the PRD's list and has no real Claude Code step: no claude mcp add or claude mcp list, and no write into A's Claude config dir (a test that compares the step names).
(4) the default starts A through the starter, not through a direct spawn (a one-launcher assert on the scenario's start step).
(5) every step returns could not run on a driver rejection (reused from h17).
(6) CONDITIONAL MIRROR, F3 VV-12 AC4 [Second] (viewer state in the isolation scan; F3.8 "Merges second", D14, F1 D28 gate; added 2026-11-10 by the F3 S1 sharding). If F3 S1 story s1b (_bmad-output/initiative-per-view-viewer/epic-slice-1-viewer-state, ticket s1b) is on main when this story is reviewed, and again before merge if it lands in between, this story also carries the [Second] part of VV-12 AC4, joining test (4): the isolation scenario gives A's instance viewer state holding markers of A (an expanded folder, an open Markdown file scrolled past a heading, a non-terminal tab's opener folder), and finds none of them outside A's profile, root and checkouts. If F3 S1 story s1b is not on main, F3 story s1b carries it.'''
