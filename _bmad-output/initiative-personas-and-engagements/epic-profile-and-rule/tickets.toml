[[entry]]
id = "e8a"
type = "story"
title = "Engagements folder rules: the checks before a create, and their refusals"
covers = ["PE-2"]
after = ["e6"]
hitl = false
risk = "high"
description = '''F1 slice 1. PRD PE-2 AC1 (revision 9k: the folder paragraph and its tests); design section 11 and revisions 5h (G2), 5i (M2, minors 4 to 6) and 5j (N1, N3 to N7); contract engagement-registry.md, the engagementsFolder checks 1 to 6; UX spec docs/ux-spec.md section 6.2 (the folder rows, in the contract's order). This story is the check only. The make, the lock and the set-once write are e8's.

Adds src-tauri/src/engagement_folder.rs: check_engagements_folder(typed, ctx) returns Checked::Existing, Checked::Missing { parent }, or the first FolderRefusal. The inputs are values (seams): the typed string, the home folder, a registry snapshot (engagementsFolder and the roots of the registered engagements), the ProfilePaths of e1 and e6, and two seams: resolve (the longest existing prefix canonicalised, the rest appended, as P is) and volume_of (the device id of a folder, for the volume-root test). Checks, in this order, first failure returned:
1. Text: not empty; no character of Unicode general category Cc or Cf (the contract's list, U+200B to U+200F, U+202A to U+202E, U+2060 to U+2064, U+2066 to U+2069, U+FEFF, U+00AD and the rest); absolute after ~ expansion; no . or .. segment. A path that fails here is never echoed in the refusal.
2. Resolved P: every later check uses P (N4).
3. Location, with "inside" and "contains" each including "equal to", tested in this order, each with its own refusal: (a) P contains the home folder (home resolved the same way); (b) P is a file-system or volume root (an existing P whose volume differs from its parent's; a missing P is not a root, N3); (c) P is inside or contains <default app data>, the profiles base (with its .run/), the runtime folder, the OS temp folder, and on macOS and Linux /tmp and /var/tmp, each comparand from ProfilePaths and resolved as P is (N4 to N6).
4. An existing P that is not a folder is refused.
5. A missing P, in this order: (a) a registered engagement's root is inside P: refused as registered (N7), nothing made; (b) its parent is missing or not a folder: refused, naming the parent. Otherwise Checked::Missing, which e8 makes, one level.
6. engagementsFolder is set: P must be fsx::same_path to it, else refused naming the set folder.

Every comparison is fsx::same_path. The check holds no lock and writes nothing; e8 runs it again inside the registry lock.

FolderRefusal kinds, one per folder row of UX 6.2: Empty, NotAbsolute, InvisibleOrControl (no path carried), ContainsHome, VolumeRoot, OverlapsAppData, OverlapsRuntime, OverlapsSystemTemp, NotAFolder, RegisteredMissing, ParentMissing, SetFolderDiffers. Each refusal carries the path (or the parent, or the set folder) the copy names.

Acceptance:
(1) text_check_refuses_format_and_control_characters_without_echoing_the_path (U+202E, U+200B, U+FEFF, U+00AD, a tab, a line break).
(2) relative_path_and_dot_segments_are_refused.
(3) home_is_refused_first: ~ gives ContainsHome, not an overlap (N1).
(4) a_volume_root_is_refused_second: / gives VolumeRoot although it contains home; a mount point (a fake volume_of that differs from its parent's) and a btrfs subvolume read as a mount point are refused.
(5) home_reached_through_a_link: a temporary home that is a symlink to the real folder; a typed path in either form contains home (N4).
(6) overlaps_are_refused_each_with_its_own_kind: equal to, inside, or containing app data, the profiles base, .run/, the runtime folder, the OS temp folder, /tmp, /var/tmp, /private/tmp and /private/var/tmp (macOS and Linux fake canonical map, N6).
(7) comparands_are_resolved_like_p: a fake base reached through a link compares equal to its target (N4).
(8) a_missing_folder_is_not_a_root: a missing P under an existing parent is Checked::Missing (N3).
(9) an_existing_file_is_refused_as_not_a_folder.
(10) a_missing_folder_with_a_registered_engagement_is_refused_as_registered: /Volumes/<x>/Engagements with <x> absent and an engagement's root inside it gives RegisteredMissing, not ParentMissing (N7).
(11) a_missing_folder_with_a_missing_parent_is_refused_naming_the_parent.
(12) a_set_folder_must_be_the_same_path: the same path through ~ or a symlink is accepted; another path gives SetFolderDiffers naming the set folder.
(13) a_missing_set_folder_is_made_again_after_every_engagement_is_deleted: Checked::Missing when no registered root lies under it.
(14) the_check_writes_nothing (a directory snapshot before and after, including a folder that the create would have made).
(15) refusal_order_matches_the_contract (each check's first failure is returned when several would fail; a table test over the order).
(16) same_path_follows_the_volume_rule: macos_only and windows_only, a case-only difference on a case-insensitive volume is the same path; Linux is byte-equal.
'''
verify = '''Local: all eight lines exit 0 and tests (1) to (15) appear by name in cd src-tauri && cargo test; (16) appears by name on macOS and Windows. CI: three backend jobs green; the platform tests line lists (16) for each platform. Isolation: required (item 2): the check reads the folders, links and volumes that it resolves.'''

[[entry]]
id = "e8"
type = "story"
title = "Create an engagement from a persona, in the default profile only, with the refusals slice 1 needs"
covers = ["PE-2", "PE-4", "PE-13"]
after = ["e6", "e7", "e8a"]
hitl = false
risk = "high"
description = '''F1 slice 1. PRD PE-2 steps 1, 4 and 5 (the subset slice 1 needs; Q8), with AC1's text rules (revision 9k); PE-1 AC3 (a starter is copied once, at the create that chooses it); PE-13 AC4 (only the default creates engagements). Contract engagement-registry.md ("Persona library", "Engagement registry", "One critical section", "Text fields"); design revisions 5h (A1 to A4, G2, M5), 5i (M2, minors 4 and 11) and 5j (N1 to N7); design section 4.4 (the profile root).

Adds src-tauri/src/engagement_create.rs: the create command, for the default profile only. Input: name, client name, owner, persona as { "library": "<persona id>" } or { "starter": "<starter id>" }, the engagement folder name, and the engagements folder as a typed path (Q8). Steps, in order:
1. Refused in an engagement instance (Profile::Engagement), before anything else.
2. Text fields: name, client name and owner are trimmed of Unicode White_Space and must be 1 to 80 code points with no Cc or Cf character; any other value is refused naming the field. The form mirrors this rule.
3. Folder name: e6's rules; refused with the reason.
