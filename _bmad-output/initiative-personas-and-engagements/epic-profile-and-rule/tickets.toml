[[entry]]
id = "e0"
type = "spike"
title = "Owner's Dock probe (appendix A with the pinned-icon step) and the architect's PE-13 AC8 check"
description = '''Spike. Precondition for the build of slice 1 (owner's ruling, design O7, F1.12 "first, before slice 1"). Not a gate on slice 0. Owner: the owner runs it; architect: reads it. Who waits on the answer: every story of this epic. The branch it selects decides e26's macOS run and how a reopen from Finder or Spotlight is handled. Where recorded: design section 6 and this spike's Verification section.

The owner runs design appendix A on a Mac, from an empty folder: build the probe, start two instances, click the second instance's Dock tile, open the app from Finder and from Spotlight; then step 3b, the pinned icon: keep the probe in the Dock, quit both, start one instance, click the pinned icon, and read the log. Then step 4's reading.

The architect records, in design section 6 and in this spike:
(1) whether a Dock click's sender is com.apple.dock and arrives at the instance whose tile was clicked (yes or no);
(2) whether a Finder or Spotlight reopen names another sender (yes or no);
(3) what the pinned icon's click shows (one tile or two; the sender);
(4) which branch of section 6 applies: the sender check, or D32's fallback (every reopen brings A forward; the route home covers it).

Acceptance: the four answers are recorded with the log lines quoted; the branch is named; e26 is re-read against it and its entry updated if the branch changes what it tests.'''
verify = '''The four answers and the branch are recorded in this spike's Verification section and in design section 6, with the probe's log lines. No code. Isolation: not applicable (a manual probe).'''
covers = ["PE-13"]
after = []
hitl = true
