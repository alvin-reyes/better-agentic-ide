title = "Engagement mode, tickets, redeem_start_ticket and StartInfo"
description = '''F1 slice 1. Design section 4.1 (mode), section 4.4 (the start), section 11 (the redeem); contracts engagement-requests.md (redeem_start_ticket, StartInfo) and engagement-profiles.md (Modes); ADR 0016 (mode from the arguments only), ADR 0018 (control key).

(1) Mode: --ade-profile <id> is engagement mode and needs a ticket (ADE_START_TICKET in the first image, or the ticket in the rebuild pipe); without a valid ticket it prints why and exits 2, and never falls back to default mode. Without --ade-profile it is default mode.
(2) The default's ticket table, in memory, under its own lock. Minting: 32 random bytes as hex, single use, a 60 s life, and a new control key (32 random bytes) kept with the ticket only.
(3) The request redeem_start_ticket { ticket: 64 hex } on the default's channel (added to e12's enum): the handler marks the ticket used under the table's lock, writes the ticket's control key to the engagement's registry entry (the registry file lock only, no hand-off mutex), and then signals the waiting starter. It replies with StartInfo { ok: true, profile, name, root, checkouts: [], personaId, gitIdentity: null, globalSecretNames: [], deployCommands: [], verdict: { clear: true }, key, seed: null } or ok:false when the ticket is unknown, used or expired, or when the key write fails.
(4) The redeem handler never takes the hand-off mutex.

Acceptance:
(1) mode_with_profile_and_no_ticket_exits_2.
(2) mode_without_profile_is_default.
(3) ticket_is_single_use.
(4) ticket_expires_at_60s (paused clock).
(5) redeem_writes_the_key_only_after_the_mark.
(6) a_failed_key_write_replies_not_ok_and_keeps_the_old_key.
(7) startinfo_serialises_to_the_contract_shape (a golden test).
(8) redeem_answers_while_the_hand_off_mutex_is_held (a seam).'''
verify = '''Local: all eight lines exit 0 and tests (1) to (8) appear by name in cd src-tauri && cargo test. CI: three backend jobs green. Isolation: required (item 2): it writes the registry key and reads the ticket.'''
