description = '''F1 slice 1. Contract engagement-registry.md ("Engagement registry", "Engagement folder names", "Paths"); design section 11 (the registry and hand-off) and section 3 ("Temp and runtime folders", revision 5j, N5); ADR 0015 (folder names are ASCII, 3 to 64 characters; PE-4 AC13 depends on them); PRD PE-2 AC1 (folder names, AC5, and revision 9k). Cited as Accepted: design revision 5j (confirmed by the owner 2026-11-08) and ADR 0024 (Accepted 2026-11-08). ADR 0024's launcher argument is built in e24, not here.

Adds src-tauri/src/registry.rs. The file is <default app data>/engagements/registry.json (schema 1), with the lock engagements/registry.lock (fs4 advisory lock) and the backup registry.json.bak, which holds the file as it was before the last write. Every write goes through fsx::write_atomic (e5) under the lock.

Top level: schema 1, and engagementsFolder, which is null until the first successful create. e8 sets it in the same write as the first entry. This story has no setter for it: a new registry reads engagementsFolder null, and the field survives a round trip as null. The set-once rule and the folder checks are e8a's and e8's.

