[[entry]]
id = "e15"
type = "story"
title = "The rebuild, Unix: the record, the digest, the count, the pipe, and the re-exec"
description = '''F1 slice 1. Design section 4.1 (the steps on Unix, the record, the count), section 21 ("Section 4.1 (re-exec)": the unit tests and the real-binary runs); contract engagement-profiles.md ("Modes and the rebuild"); ADR 0016.

Adds src-tauri/src/launcher/rebuild.rs (Unix) and the first act of main.rs. Before Tauri and before any thread:
1. read once into memory the ticket and, in debug builds, the flag switch (the ticket's reader lands in e18; a seam here); parse the arguments, including --ade-rebuilt=<fd>.
2. a second image (--ade-rebuilt=<fd>) reads the pipe on that fd, non-blocking (O_NONBLOCK set before the first read), to end of file. It must be a pipe (fstat, S_ISFIFO). A read that would block (EAGAIN) marks the pipe foreign. The record: magic and version, count (1 or 2), a SHA-256 digest, the launcher path (login-session or fallback, plus harness-home), the ticket and the flag, under 1 KiB. If the digest equals the image's own start-time view, the image proceeds without reading any login-session source, and reports the launcher path from the record. Otherwise it continues with the count it read, or 0.
3. build the environment and the folder with the builder given to it (e16 on macOS and Linux; the Windows path is e17).
4. compare the built set and folder with the OS's start-time view: KERN_PROCARGS2 by sysctl on macOS, /proc/self/environ on Linux, parsed as a set; never the live environ; folders canonicalised with realpath. Equal: proceed. Different: if the count is already 2, exit 2 naming the differing variables by name only.
5. re-exec: a pipe with O_CLOEXEC on both ends; write the record (count + 1, the digest of the built set, folder and arguments, the launcher path, the ticket, the flag); close the write end; clear O_CLOEXEC on the read end; chdir; execve the process's own image (/proc/self/exe on Linux, including in an AppImage; _NSGetExecutablePath then realpath on macOS) with --ade-rebuilt=<fd>. This is the only execve in the crate (e14 allows exactly one).
A log line is kept in memory until the instance holds its lock (e9 writes it). Nothing is written in a profile root here.

