description = '''F1 slice 1 gate. Architecture item 2 ("slice 1 on"), design 15.6 ("Slice 1 replaces the line with expect: pass ... that refusal is added by slice 1's story, in the same commit"); ADR 0020 (the mark); PRD F1.8 slice 1 ("its expected-to-fail mark removed").

The change, and nothing else: src-tauri/isotest/EXPECTED holds exactly expect: pass. The workflow isolation.yml gets a first step, before any run, that fails when EXPECTED holds any line other than expect: pass (the xfail refusal, M13). The check-expected subcommand (h21) accepts expect: pass and requires the verdict pass with no findings.

The job is green only when both runs of each platform give pass with no findings, every launch run the slice enables (e25, e26) passes its asserts, and the detector test passes where it runs (no detector in slice 1; design 21).

Slice 1 runs no real Claude Code step (owner's decision, 2026-11-08, epic notes): the scenario's claude mcp steps and any write into A's Claude config dir wait for slice 2 and ADR 0023's split home. The gate checks that the counted runs ran without them (acceptance 7).

Verification for this story is the QA same-SHA evidence, cited as architecture item 4 says: the gh run list for the SHA (every run), the gh run view JSON (headSha, event, attempt and the required jobs' conclusions) for each counted run, the backend jobs' platform tests lines, and each isolation job's summary (verdict, launcher path, kind counts, kind-4 paths, the launch suite's results). The e31 frontend and e0 probe are recorded as the slice's manual and frontend precondition.

Acceptance:
