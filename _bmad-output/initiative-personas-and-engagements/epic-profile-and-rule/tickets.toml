[[entry]]
id = "e19"
type = "story"
title = "The engagement starter: start_engagement, with the hand-off mutex, the probe, the spawn and the wait"
description = '''F1 slice 1. Design section 4.2 (the starter), section 4.4 (the sequence); contracts engagement-profiles.md ("Launcher and starter": start_engagement); design section 11 ("the hand-off mutex", the starter's wait); ADR 0016; PRD PE-13 AC1 (one instance per profile; only the default starts one).

Adds src-tauri/src/launcher/engagement_starter.rs.
- pub struct EngagementProfile(ProfileId), with its only constructor from a registry entry.
- pub async fn start_engagement(p: &EngagementProfile) -> Result<Started, StartError>:
  1. take A's hand-off mutex (an in-process mutex of the default instance, taken before the registry file lock and never after it; Q13) and read A's registry entry. Gone: StartError::Deleted, nothing spawned. Marked deleting: StartError::Deleting, nothing spawned.
  2. the probe (e10 on Unix, e11 on Windows). Running: release the mutex and send activate. Not answering: StartError::NotAnswering, nothing spawned, the control key unchanged. Not running: drop the probe's lock guard and continue.
  3. the reconcile of hand-off records: a no-op in slice 1 (Q13), called so the order is fixed.
  4. mint the ticket and the control key (e18). Spawn engagement mode: --ade-profile <id>, environment = the login-session environment + ADE_START_TICKET (the rebuild keeps the ticket out of A's environment), cwd = A's root, and --ade-feature-f1 when the running instance has F1 on in a debug build (e22).
  5. keep the mutex until A has redeemed the ticket or the child is gone. At 60 s after the spawn: take the ticket out (already used counts as redeemed), kill the child through its handle, wait up to 5 s, then release. A failed key write kills the child.

Acceptance, with a stand-in for A (a seam) and a paused clock where time matters:
(1) start_spawns_when_not_running.
(2) start_activates_when_running_and_spawns_nothing.
(3) start_when_not_answering_spawns_nothing_and_keeps_the_key.
(4) start_after_delete_returns_deleted.
(5) start_when_deleting_returns_deleting.
(6) start_waits_for_the_redeem_then_releases.
(7) start_ticket_end_kills_the_child_and_releases (paused clock).
(8) a_second_start_waits_for_the_first (the mutex serialises the two).
(9) the child's environment has ADE_START_TICKET only on the spawn, and the rebuilt set has none (a test with the rebuild's built set).'''
verify = '''Local: all eight lines exit 0 and tests (1) to (9) appear by name in cd src-tauri && cargo test. CI: three backend jobs green. Isolation: required (item 2): it starts a process and waits on the channel.'''
covers = ["PE-13", "PE-2"]
after = ["e10", "e11", "e13", "e18"]
hitl = false
risk = "high"

