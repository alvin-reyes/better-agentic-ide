# ---------- Shell history, Agent status, the scenario, the UI, the gate ----------

[[entry]]
id = "e27r"
type = "story"
title = "History report reader and the not-isolated warning: escalate-only check and bar"
covers = ["PE-4"]
after = ["e21", "e1"]
hitl = false
risk = "high"
description = '''F1 slice 1. PRD PE-4 AC8 (slice 1's check and its tests, revision 9k); design section 9 ("Slice 1's history check", "Encoding, shell side", "Decoding, Rust side", "The state machine, per PTY", "Forged reports") and revisions 5h (G7), 5i (M3, M4, minors 8 and 9) and 5j (N2: the 40 KiB cap); UX spec docs/ux-spec.md section 8.1 (where the warning shows), 8.2 (its copy and when it shows) and 8.3 (the live announcement). The emitters are e27a (zsh, bash) and e27b (PowerShell). This story is the reader and the warning, which every reporting shell shares. Q10 is resolved: the copy is UX 8.2's.

Adds src-tauri/src/ptysink.rs (minimal; slice 2 extends it), the per-PTY state machine beside it, and the bar and tab mark in the frontend.

- Decoder. The OSC parser takes BEL or ST as the terminator, keeps at most 40 KiB (40,960 bytes) of one OSC's payload, discards a longer one up to its terminator, and skips ASCII whitespace inside the base64, line breaks included. A report is well-formed when it decodes to UTF-8 JSON whose v is 1 and whose history, if present, is a string; unknown keys are ignored. Anything else (over the cap, bad base64, bad UTF-8 or JSON, another v, a non-string history) is malformed and changes nothing. A well-formed report without history says nothing about history. The JSON escapes the shells write (\\, \", \u00XX) are decoded.
- Evaluating history. Empty: OK (the shell writes no history). Relative, or with a parent that cannot be canonicalised: mismatch. Otherwise OK only when its canonical parent is fsx::same_path to the canonical <root>/history and its file name equals the expected one; else mismatch. The expected path is passed in as a value.
- State machine, per engagement PTY, states Waiting, Confirmed, Unconfirmed and Mismatch(var): exactly the table of design section 9, every row a test. The 10 s timer is armed from the first output byte, and only for zsh and bash; PowerShell and unsupported shells never arm it, and fish is not checked in slice 1. A timer end in Waiting gives Unconfirmed. Every well-formed report is evaluated; the warning only escalates (none, the first sentence, the full copy) and never clears until the terminal closes. Each escalation, and only an escalation, emits PtyEvent::Integrity { level: "unconfirmed" | "mismatch", var }.
- Copy: UX 8.2's bar texts, with <VAR> in mono and <shell> for an unsupported shell. The first sentence, History is not isolated for this terminal., is the same string in every case.
- Unsupported shell: known at spawn; the bar shows at once (UX 8.2's unsupported rows); no timer.
- Frontend: the tab mark and the pane bar (UX 8.1). Dismiss hides the bar for that terminal only and the tab mark stays until the terminal closes. An escalation shows the bar again even if it was dismissed. Each pane has its own bar; the tab shows one mark. The live announcement is UX 8.3.
- Slice 1 refuses no launch action; slice 2 adds that.

Acceptance:
(1) a_report_at_9_9_s_and_at_10_1_s (paused clock): a late mismatch upgrades the copy; a late match keeps the first sentence.
(2) state_table_rows: every row of design section 9's table is a test (a table test over the states and events).
(3) an_ok_report_before_a_mismatch_ends_in_mismatch, and a mismatch never clears.
(4) a_history_of_4096_control_characters_is_well_formed (a 32,796-byte base64 report is accepted).
(5) malformed_reports_change_nothing: over 40 KiB, bad base64, bad UTF-8, bad JSON, v 2, a non-string history.
(6) base64_with_line_breaks_decodes.
(7) a_relative_histfile_and_an_uncanonicalisable_parent_are_mismatches.
(8) powershell_never_arms_the_timer, and fish is never checked (no event after 10 s on either).
(9) an_escalation_emits_integrity_and_a_dismissed_bar_shows_again (Rust for the event; vitest for the bar).
