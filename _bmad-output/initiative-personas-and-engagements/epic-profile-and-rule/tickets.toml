In an engagement, Agent status's locks and records live under <root>/cache/agent-status/. In the default they stay where they are today. Turning Agent status on and off in an engagement writes only there and in the project's own settings file (the project's .claude/settings.local.json, as today). The refusal of Agent status inside an engagement's folders (PE-4 AC7) is slice 2 and is not built here. Agent status stays not offered on Windows.

