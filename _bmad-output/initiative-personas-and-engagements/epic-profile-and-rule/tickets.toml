description = '''F1 slice 1. PRD F1.8 slice 1 ("from the default profile's UI"); PRD PE-2 steps 1 and 5 (the refusals, shown with the reason); PE-1 AC3 (the persona choices); PE-12 (the list; open only in slice 1); PE-13 AC4 (the default alone lists and creates, and its entry points). UX spec docs/ux-spec.md, confirmed by the owner 2026-11-08: section 2 (words), 4.1 and 4.2 (flows), 5 (the panel, list states and open states), 6.1 to 6.3 (the form, its refusal copy in its order, its states), and 9 to 11 (keys, accessibility, states checklist). Q10 is resolved: the copy and layout are the UX spec's. The mockup is docs/mockup.html.

A frontend story over the commands of e7 (list_persona_choices), e8 and e19. In the default profile only, behind the flag (e22). Nothing else of the list is built here: no close, reopen, delete, persona editing or checkouts.

- Engagements panel (UX 5): the list, with each row's name and client, and Open on each row (the starter of e19, or activate when running). After a create, the new row is selected and its Open has focus (UX 4.1).
- New Engagement form (UX 6.1): fields 1 to 6, with the Engagements folder as 5a (editable while engagementsFolder is null) or 5b (read-only once set), the Folder name derived from Name with the live preview, the Persona select over list_persona_choices with Software Engineer preselected, and the Cancel and Create Engagement footer. Name, client and owner are trimmed and counted in code points ([...s].length); the form mirrors e8's text rules.
- Refusals (UX 6.2): each refusal from e8 or e8a is shown on the field it concerns, in the copy and order of UX 6.2, with the fallbacks at the foot of that table.
- Form states as UX 6.3.
- Entry points, default profile only, flag on: the command palette entries Open Engagements and New Engagement (category Engagements; New Engagement goes straight to the form, UX 4.1), on every platform; and, on macOS, the app menu's Open Engagements as the first item after About Better Terminal, followed by a separator (PE-13 AC4; UX 7.2). The engagement instance's entries are e24's. Whether the default's Dock menu gets the item is open (epic notes).
- In an engagement instance neither the form nor the list is loaded.
- Words: Better Terminal in every title, menu and message; "your main Better Terminal" only where UX 6.2 and 7.4 name it.

Acceptance, with vitest and a fake command layer unless marked:
(1) form_shows_each_refusal_in_ux_order_with_its_reason (each 6.2 kind maps to its copy and field; the fallbacks).
(2) form_submits_the_create_command_with_the_typed_values (name, client and owner trimmed by the code-point rule; persona as { library } or { starter }; folder name; engagements folder with ~ expanded).
(3) list_open_calls_the_starter, and a running row calls activate through the starter's result.
