[[entry]]
id = "e27a"
type = "story"
title = "Per-profile shell history for zsh and bash, with the one-shot history report"
covers = ["PE-4"]
after = ["e27r"]
hitl = false
risk = "high"
description = '''F1 slice 1. PRD PE-4 AC8 (slice 1's history for zsh and bash, and its tests); design section 9 (the zsh and bash rows; "Slice 1's history check", who emits); ADR 0021 (history in <root>/history/). Q15 is answered by design revision 5h, G7: slice 1 emits the one-shot report only, and nothing else of the OSC family. The reader, the state machine and the warning are e27r.

For engagement terminals only:
- zsh: ZDOTDIR=<shell dir>/zsh, where the shell dir is <root>/shell. ADE's .zshenv, .zprofile, .zshrc and .zlogin each source the user's own file (from the original ZDOTDIR or HOME), with ZDOTDIR restored around it. ADE's .zshrc sets HISTFILE=<root>/history/zsh_history before it sources the user's .zshrc, after /etc/zshrc has set its own. After the user's files, a one-shot precmd function, added after the user's .zshrc and removing itself when it first runs, emits the report at the first prompt (after .zlogin): ESC ] 7717 ; check ; <base64 of {"v":1,"history":"<$HISTFILE, empty if unset>"}> BEL.
- bash: bash --init-file <shell dir>/bash/init.bash -i (not -l). init.bash sources /etc/profile and the first of ~/.bash_profile, ~/.bash_login, ~/.profile, as a login shell would, and sets HISTFILE=<root>/history/bash_history before the user's files. Its last line emits the same report with $HISTFILE.
- Encoding (design 9): the JSON escapes \ and " and each control character U+0000 to U+001F and U+007F as \u00XX; the JSON is piped through base64 | tr -d '\r\n'. A shell without base64 sends nothing, which the reader's 10 s fallback covers.
- The default profile: its zsh wrapper puts HISTFILE back to ${original ZDOTDIR:-$HOME}/.zsh_history when /etc/zshrc pointed it at ADE's folder; bash is left as it was. The default emits no report.
- At spawn the PTY is told its shell kind (zsh, bash, or other) for e27r's state machine. fish and PowerShell are not changed here (e27b).

Acceptance, with real shells (listed):
(1) engagement_zsh_history_is_in_the_profile (linux_only and macos_only): a command typed in A's terminal is in <root>/history/zsh_history.
(2) engagement_bash_history_is_in_the_profile (both platforms).
(3) a_command_typed_in_a_is_absent_from_the_default_and_b_histories (asserted inside (1) and (2)).
(4) start_up_file_setting_histfile_warns (real zsh and bash): the report arrives as a mismatch and e27r's state shows the full copy naming HISTFILE.
(5) a_histfile_with_quotes_backslash_tab_and_line_break_gives_a_well_formed_report_and_a_mismatch_naming_histfile (real shell).
(6) a_zshrc_that_execs_sh_gives_the_first_sentence_after_10_seconds (real time).
(7) default_zsh_keeps_the_home_history (real zsh; the default terminal's HISTFILE is the home file).
(8) the_one_shot_report_is_emitted_once (zsh: a second prompt emits nothing; bash: the line is last in init.bash and one report arrives at the first prompt).
(9) the zsh and bash integration tests are listed in src-tauri/platform-tests.txt for their platforms.
'''
verify = '''Local: all eight lines exit 0 and tests (8) appears by name in cd src-tauri && cargo test. CI: backend and backend-macos green; the platform tests line lists (1), (2), (4), (5), (6) and (7) as ok on their platforms. Isolation: required (item 2): terminals write history.'''

[[entry]]
id = "e27b"
type = "story"
title = "Per-profile shell history for fish and PowerShell"
covers = ["PE-4"]
after = ["e27a"]
hitl = false
risk = "high"
description = '''F1 slice 1. PRD PE-4 AC8 (fish and PowerShell; the PowerShell report with no fallback; fish has no check until slice 2); design section 9 (the fish and PowerShell rows; the PowerShell report under "Slice 1's history check"; revision 5i, M4); ADR 0021 (fish exports XDG_DATA_HOME to its terminal; PowerShell's history path). UX spec docs/ux-spec.md section 8.2 (the PowerShell rows; the fish row is slice 2). The reader, the state machine and the bar are e27r.

- fish: fish -l -C 'source <shell dir>/fish/init.fish', with XDG_DATA_HOME=<root>/shell/fish-data for the fish process, so fish's history goes there. Programs started from that terminal see the variable: the side effect ADR 0021 accepts. Slice 1 has no report, check or warning for fish of either kind (design 9, M4). The fish warning work, which is UX 8.2's XDG_DATA_HOME row and its check, moves to slice 2; this story's notes say so.
- PowerShell 7 and Windows PowerShell 5.1: -NoLogo -NoProfile -NoExit -EncodedCommand <base64 UTF-16LE>. The integration is inline text, not a script file. It sets PSReadLine's HistorySavePath to <root>\history\pwsh_history.txt first, clears in-memory history, loads the profile scripts under PowerShell's own rule (only when Get-ExecutionPolicy allows scripts), and as its last statement emits the report: the value of (Get-PSReadLineOption).HistorySavePath, empty when PSReadLine is not loaded, written with [Console]::Out.Write, the escape and bell as [char]27 and [char]7, base64 over UTF-8 by [Convert]::ToBase64String, unwrapped. Under 8 KiB of script.
- No 10 s fallback for PowerShell: a terminal whose report never arrives shows nothing (UX 8.2). A profile that moves HistorySavePath gives a mismatch (e27r).
- First step, before any code: check that ConPTY passes the private OSC through to create_pty's reader for pwsh and powershell on the Windows CI runner (design 9). If it does not, this story stops and goes back to the architect; no workaround is built here.

Acceptance, with real shells (listed):
(1) engagement_fish_history_is_in_the_profile (linux_only and macos_only).
(2) pwsh_history_path_is_in_the_profile (windows_only, pwsh and powershell).
(3) a_profile_script_that_sets_history_save_path_elsewhere_shows_the_full_copy_naming_it (windows_only).
(4) the_encoded_command_decodes_to_the_integration_text (a unit, any platform; under 8 KiB).
(5) a_fish_terminal_emits_no_report_and_shows_no_warning (real fish on linux and macos).
(6) a_powershell_terminal_with_no_report_shows_no_warning (windows_only).
(7) the fish and PowerShell integration tests are listed in src-tauri/platform-tests.txt for their platforms.
(8) the ConPTY check of step one is recorded in this story's Verification with its real output; its pass is a precondition of (2) and (3).
'''
verify = '''Local: all eight lines exit 0 and test (4) appears by name in cd src-tauri && cargo test. CI: backend and backend-macos show (1); backend-windows shows (2), (3) and (6) in the platform tests line, as ok. Isolation: required (item 2): terminals write history.'''

