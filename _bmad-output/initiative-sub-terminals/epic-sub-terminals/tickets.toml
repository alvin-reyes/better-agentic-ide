[[entry]]
id = 7
type = "story"
title = "ade on PATH"
description = '''Puts a symlink named ade on PATH in a checked folder that ADE owns, so an agent can run ade open without knowing where ADE is, and strips inherited ADE bin folders from other builds. Starts after story 4 is on main. Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) The folder is <app data dir>/bin/release (re-pointed each launch) or bin/debug-<16 hex of sha256 of the helper path>. Each holds a symlink named ade to the helper. A debug-* folder whose target is gone is deleted at launch.
(2) ADE uses the folder only if it is the user's, mode 0700, not a symlink, holds only ade (readdir and lstat), and ade is a symlink whose readlink target is exactly this launch's helper path. Checked at launch and in every create_pty.
(3) create_pty always strips inherited ADE bin folders from PATH, and prepends its own only when it sets the ADE_* variables.
(4) Recognising an inherited bin folder from any ADE build (another app data dir, a dev build, a different bundle id, an older install): a PATH entry is stripped when its last two components are bin/release or bin/debug-<16 hex>, and it holds an ade that is a symlink whose target's file name is ade-hook (or ade-hook.exe). Checked with lstat and readlink only, never by running anything; the target need not exist. Tests: a folder from another app data dir is stripped; one whose target is gone is stripped; a look-alike (bin/release without that symlink) is kept.
(5) The name ade is kept (D8); agents use $ADE_HOOK_BIN.
(6) Windows is out of scope: /open answers 422 there.
Slice: src-tauri/src/pty.rs (apply_hook_env, create_pty), a new bin-folder module in src-tauri/src/, launch code in src-tauri/src/lib.rs, and tests.
Verification: the five approved lines plus cd src-tauri && cargo check -p ade-hook each exit 0, with a named test for each criterion (1) to (6) (full names fixed at refinement).'''
