[[entry]]
id = "2bii"
type = "story"
title = "Sub-terminals by hand, part 2: close and keep"
description = '''Part 2 of the former story 2b, split by the owner on 2026-11-04. Needs 2b-i on main. Adds closing a sub-terminal through the busy check, the count badge, and saving sub-terminals in the session. The behaviour is the one the spec and the UX spec define, with the owner's rulings below.

Owner rulings, 2026-11-04: Q1 to Q10 as proposed; Q11 = hook (useOwnFolderCwd, built in 2b-i); restored: boolean on View accepted; the split accepted.

Busy check: this part adds none of its own. Every confirm uses paneBusy through useGuardedClose, from hermes-b-busy-panes (on main).

Sources. docs/superpowers/specs/2026-11-02-open-terminals-from-a-terminal-design.md, sections "Busy check (R1)", "Closing and detaching", "Saving the session" and "Testing". docs/superpowers/specs/2026-11-02-sub-terminals-ux.md, sections "Closing", "The count on the main tab", "Persistence, windows, switcher, toasts, fleet" (restart only), "Keyboard and focus" (⌘W, ⌘⇧W), and "Notices" (not used here). Contracts: .ade/context/terminal-open.md (View, the session) and .ade/context/pane-busy.md.

