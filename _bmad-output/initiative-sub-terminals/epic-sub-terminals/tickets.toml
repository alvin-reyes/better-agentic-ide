[[entry]]
id = "2a"
type = "story"
title = "Views in the store, no behaviour change"
description = '''Replaces Tab.root and Tab.activePaneId with explicit views, so that every reader says which view it means, and the TypeScript compiler lists every site that must change. A tab with one view behaves exactly as today. This story creates no second view in production code: it adds no strip, no action that makes a view, and no shortcut. Spec: "The store: views stored explicitly" and the reader table. ADR 0014 "Views are stored explicitly".

Context. src/stores/tabStore.ts holds Tab with root (the pane tree) and activePaneId. About 50 sites in tabStore.ts read them, and about 25 source files outside it do too (App.tsx, DetachedApp.tsx, TerminalPane.tsx, TabBar.tsx, TabSwitcher.tsx, SettingsPanel.tsx, CommandPalette.tsx, FileBrowser.tsx, useKeybindings.ts, useTerminal.ts, useFleetData.ts, useAgentStatusToasts.ts, useProjectSetup.ts, agentStatusStore.ts, tabDisplay.ts, bmadSwitch.ts, terminalCommands.ts, detachWindow.ts). Do not treat other uses of the word root (project roots, board roots, contract roots) as tab fields; tsc decides.

The new shape:
  interface View { id: string; name: string | null; spawnedBy: string | null; root: PaneNode; activePaneId: string }
  interface Tab { ...other fields unchanged...; views: Record<string, View>; viewOrder: string[]; shownView: string }
  // "own" is always views.own and viewOrder[0]. A tab without sub-terminals has only "own".

Accessors, exported from tabStore.ts: shownView(tab), ownView(tab), allTabPanes(tab) (every pane of every view, in viewOrder), viewOfPane(tab, paneId) (the view holding that pane id, or undefined).

Each reader takes the group the revised spec's table gives it (spec "Every reader", as revised after the final review; ADR 0014):
- view in sight: getActivePane, getActivePtyId, getTabActivePane (and AgentPicker, Scratchpad.tsx:672, OrchestratorTab.tsx:268,275), focusNextPane and focusPrevPane (focusPaneBy), App.tsx:96 (active PTY), App.tsx:481 and DetachedApp.tsx:97 (rendering), TerminalPane.tsx:40,44, useKeybindings.ts:103 (close pane) and :126-127 (splits), CommandPalette.tsx:77-78 (split), :93 (close pane), :200 and :208 (recording), focusActiveTerminal (useTerminal.ts:743), terminalCommands.ts:32 (the new tab of runInNewTabPane);
- own view: tabCwd, tabLabel, tabProject (tabDisplay.ts:19-20), and so tab titles, project grouping and sortTabsBy; activeCwd (App.tsx:290) and everything it feeds (useProjectSetup, useContextGuard, BoardPanel, ContractsPanel, TokensPanel, IntegrationsPanel, Fleet's "This terminal" in useFleetData, the contract actions at App.tsx:250,257). activeCwd follows the tab, not the view in sight (M4), read through tabFolderPaneId(tab) in tabDisplay.ts. CommandPalette.tsx:65 (the BMAD project) and :125 (Set Up Project), which are the same project actions as useProjectSetup. FileBrowser.tsx:160,179. The closed-tab record (closeTab) and reopenClosedTab. SettingsPanel.tsx:201 (workspace layout);
- the view holding a given pane: setPtyId, setActivePaneInTab (a pane id no view holds falls back to the view in sight, as main did), closePane (kills by the store's ptyId, as closeTab does; the own view's last pane stays a no-op), splitPane (by pane id, in whichever view holds it);
- all views: closeTab's kill loop, detachTab, saveSession and loadSession (own view only in this story, as root), tabAgentState (agentStatusStore.ts:38), useAgentStatusToasts.ts:8, TabBar.tsx:60, TabSwitcher.tsx:31, useFleetData.ts:136,201, useTerminal.ts:74,610, bmadSwitch.ts:166, terminalCommands.ts:38, detachWindow.ts:6,27,43 (detachTabToWindow still sends the own view's root and activePaneId in this story).

Slice: the files above and their tests. The list is complete when npx tsc --noEmit is green with Tab.root and Tab.activePaneId removed from the type. Test fixtures that build Tab literals move to the new shape. Nothing else: no Rust, no CSS, no new UI.

Acceptance criteria:
(1) A new tab has views.own, viewOrder ["own"] and shownView "own", and the Tab type has no root or activePaneId. Test: src/stores/__tests__/tabViews.test.ts, "a new tab has one own view, first in order and shown"; the type removal is enforced by npx tsc --noEmit.
(2) The four accessors give the right answers with a second, hidden view present: shownView returns the shown view, ownView returns views.own, allTabPanes lists the panes of both views in viewOrder order, viewOfPane finds the hidden view for a hidden pane and returns undefined for an unknown id. Test: tabViews.test.ts, "the accessors read the shown, own and hidden views".
(3) Every tabStore function named in the spec's reader table has its own test with a pane in a hidden view (the test builds the state; shownView stays own): getActivePane, getActivePtyId, getTabActivePane, focusNextPane, focusPrevPane, splitPane (by pane id in the hidden view), closePane (by pane id in the hidden view), setPtyId (the id is stored on the hidden pane; the agent dot via tabAgentState and the kill path both see it), setActivePaneInTab, closeTab (kills hidden panes, including ones with no instance), detachTab, saveSession and loadSession, tabAgentState, reopenClosedTab (restores the own view only). Each test is named "<function> with a pane in a hidden view" in tabViews.test.ts.
(4) The tab's own presentation ignores a hidden view: tabLabel, tabProject, tabCwd and sortTabsBy give the same result with a hidden view in another folder as without it. Test: tabDisplay.test.ts, "label, project and sort ignore a hidden view".
(5) The saved session is unchanged for a one-view tab: saveSession writes root (the own view's tree) and activePaneId exactly as before. Test: src/stores/__tests__/session.test.ts, "a single-view tab saves the same JSON as before the refactor", comparing against a golden file captured from the pre-change code before the first edit.
(6) A session written before this story loads as one own view with the same tree and activePaneId. Test: session.test.ts, "an old session loads as one own view", using the same golden file.
(7) detachTabToWindow for a one-view tab sends the same payload as before (root and activePaneId of the own view). Test: a new case in the existing detachWindow test, or src/lib/__tests__/detachWindow.test.ts if none exists.
(8) The existing suite passes with no assertion changed: only fixtures that construct Tab objects change shape. Checked by the verification step below.
(9) activeCwd, and everything it feeds, reads the own view: with a sub-terminal in another folder in sight, activeCwd is unchanged. Test: tabViews.test.ts, "activeCwd follows the own view, not the view in sight" (M4).
(10) Each test in (3) also runs with the hidden view shown, so a view-in-sight reader and an own-view reader cannot be swapped unnoticed (review fix 3f46cdf). Test names as in (3), with the hidden view shown.

Verification: the five approved lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest). Then run: git diff origin/main -- "src/**/*.test.ts" "src/**/*.test.tsx" | grep -E "^[-+].*expect\(" and it prints nothing (no assertion changed). Then grep -rn "activePaneId\|\.root\b" src --include=*.ts --include=*.tsx and check that each remaining hit is a View field read through an accessor, or a non-tab root.

Out of scope: any second view created in production (story 2b); the strip; new shortcuts; Rust changes; the session format change (story 2b).
Known uncertainty: the reader table in the spec was written from the code as it stood on 2026-11-02; a site it misses will show as a tsc error, which is the point of the refactor.'''
verify = "the five approved lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest); tabViews.test.ts has one test per tabStore function in the reader table, each named '<function> with a pane in a hidden view'; the golden session test passes; no assertion changed in the existing tests (the git diff check prints nothing)."
