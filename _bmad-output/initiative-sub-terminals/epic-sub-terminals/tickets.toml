[[entry]]
id = 3
type = "story"
title = "Marks per view: attention, activity, roll-up and exited"
description = '''Gives each sub-terminal its own attention and activity marks, rolls them up into the tab's marks, and shows the exited state. Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) Attention is keyed tabId/viewId: output finished while a view is not in sight marks that view; showing the view clears it.
(2) Activity is per view and works from creation, including while hidden and headless (the pane's terminal exists before first show).
(3) The tab's agent dot is the most urgent state over all its views (AgentDot, rolled up by tabAgentState).
(4) The tab's attention and activity marks cover all views; on the active tab, as today, the dot shows and attention and activity are hidden, while the strip shows them per view.
(5) An agent in a sub-terminal raises the dot on that sub-terminal's entry as well as the tab's.
(6) When a sub-terminal's shell exits, its entry shows "exited" (text in #8B929E, name at 60% opacity; no exit code), and its view shows a bar "This shell has exited." with [Close sub-terminal]. The tab's own shell exiting keeps today's [Process exited]; sub-terminals keep running.
(7) A restored sub-terminal keeps "restored" on its entry for its life (tooltip: "Restored after restart: a new shell in <folder>. <name> was not run again.").
Slice: src/stores/agentStatusStore.ts, src/hooks/useAgentStatusToasts.ts only where the view key changes, src/components/TabBar.tsx, the strip component, src/hooks/useTerminal.ts (exit handling), and their tests.
Verification: the five approved lines (see the header) each exit 0, with a named test for each criterion.'''
