[[entry]]
id = 9
type = "story"
title = "ade open -- COMMAND: typing the command into the new shell"
description = '''Adds the command: the words after -- are typed into the new shell with Enter, through feat/cli-guard's line-editor check and writer thread (R2). Adds exit code 5 (opened, command not typed), the not-typed notice with Insert command (N1), the amendment to ADR 0011 for the guard's resolution of "$ADE_HOOK_BIN" open (M6), and the guide entry (R6). Full criteria are refined when this is pulled.
BLOCKED on outside work, held in unknown until all are true: story 4 on main; hermes-a-quoting on main (shellQuote, ADR 0008, D9); feat/cli-guard on main (line_editor_ready, the PTY writer thread, the guard, ADR 0011).
Summary of criteria, each a test at refinement:
(1) Typing (R2): Rust polls line_editor_ready(master, shell pid) every 50 ms and types after two ready answers in a row, for at most 5 s after the window's answer. Not ready by then: nothing is typed, typed:false, why "the shell's line editor didn't start". The line goes through the new PtyInstance's input channel to its writer thread, so a terminal that doesn't read never blocks Rust. Tests: types only after two ready answers; not ready in 5 s gives typed:false; a terminal that doesn't read doesn't block the answer; one real PTY case on Unix reusing feat/cli-guard's test helpers; a 5,000-byte line arrives whole.
(2) Quoting: the window quotes each word with shellQuote (ADR 0008); bare words matching ^[\w./-]+$ are left as they are. Words are printable ASCII (D6; non-ASCII is refused, never altered). At most 64 words; at most 4096 bytes for the typed line.
(3) Rust refuses a command unless the shell is sh, bash, zsh, fish, dash or ksh (422). A shell with no line editor (dash; ksh without emacs or vi) never becomes ready, so it gives typed:false.
(4) A command that can't be typed leaves the shell alone and gives typed:false: CLI exit 5, and a typed message to the window that clears the spinner.
(5) Worst case about 10 s from request to answer (5 s for the window, 5 s for the line editor); ADE answers within 11 s; the CLI gives up at 15 s. Test with injected clocks.
(6) Insert command (N1, R1): the notice shows only the first word and an ellipsis, never the full line. Insert writes the full quoted line at the prompt without Enter, and is enabled only when paneBusy is null for the pane AND line_editor_ready is true for its PTY; both are checked again on click, and if either fails nothing is written. Disabled titles: "Available once the shell is back at its prompt" (busy or not yet ready) and "This shell has no line editor; type the command yourself" (dash, ksh without editing, known from the shell's name). Tests: disabled while paneBusy names a program, while line_editor_ready is false (a read -s prompt), and for dash; re-checked on click. The line is held in memory only.
(7) The ADR 0011 amendment (M6): "$ADE_HOOK_BIN" (also $ADE_HOOK_BIN and ${ADE_HOOK_BIN}) unassigned on the line resolves to the helper; with the verb open, the words after -- are classified as the command, as a runner (env, xargs) is. Tests: "$ADE_HOOK_BIN" open -- gh repo delete o/r asks as the bare gh line does; "$ADE_HOOK_BIN" open --name x does not ask; a line that assigns ADE_HOOK_BIN asks; ade open with no -- is not guarded; the verb constant is enumerated by the guard's test (P6(b)). guard and hook mode are unchanged.
(8) Guide entry (R6): typed commands run after the user's rc files and through their aliases and functions, which the guard cannot see; how to expand secrets inside the new terminal (D3). Documented, not asked.
(9) The spinner clears when the typed result arrives.
Slice: src/lib/terminalOpen.ts, src/lib/shellQuote.ts (from hermes-a-quoting), src-tauri/src/terminal_open.rs (typing), src-tauri/ade-hook (exit 5), src-tauri/src/pty.rs (input channel use), the notice and Insert command in the strip component, the guard's runner table (on feat/cli-guard), the ADR 0011 amendment, the guide entry, and tests.
Verification: the five approved lines plus cd src-tauri && cargo check -p ade-hook each exit 0, with a named test for each of criteria (1) to (9) (full names fixed at refinement). Not pulled while unknown is set.'''
