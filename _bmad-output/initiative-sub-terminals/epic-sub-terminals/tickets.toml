title = "Moving sub-terminals and tabs between tabs and windows"
description = '''Move to New Tab for a sub-terminal, Move to New Window carrying every view, reattach of hidden panes in the detached window, kill on destroy, and the strip and shortcuts in DetachedApp. Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) Move to New Tab (sub-terminal context menu): it becomes a top-level tab right after its tab, with its panes and shells (no restart) and its name, and becomes the active tab. Afterwards ade open from it adds sub-terminals to the new tab.
(2) Move to New Window (S2) carries every view: detachTabToWindow sends views, viewOrder and shownView; detachTab detaches every view's instances.
