[[entry]]
id = "2bi"
type = "story"
title = "Sub-terminals by hand, part 1: open, switch and see"
description = '''Part 1 of the former story 2b, split by the owner on 2026-11-04. Adds sub-terminals to the store and the UI, made by hand from the tab menu: the strip, switching, the two shortcuts, New Sub-terminal, the live announcement, the hidden Move to New Window, and App's folder choice moved into a hook. Closing, the count badge and saving come in 2b-ii. Nothing from the CLI (story 4).

Owner rulings, 2026-11-04: Q1 to Q10 as proposed; Q11 = hook (useOwnFolderCwd, tested directly); restored: boolean on View accepted (2b-ii); the split accepted. All open questions are settled, so this entry is not blocked.

Prerequisites, on main: story 2a (PR #76) and hermes-b-busy-panes (PR #75: pty_foreground_job, paneBusy, decideBusy, and useGuardedClose, which reads allTabPanes). This story adds no busy check.

Sources. The spec owns every rule: docs/superpowers/specs/2026-11-02-open-terminals-from-a-terminal-design.md, sections "The store: views stored explicitly", "Busy check (R1)", "Closing and detaching", "Saving the session" and "Testing". The UX spec owns what the user sees, its copy, colours and keys: docs/superpowers/specs/2026-11-02-sub-terminals-ux.md, sections "Look", "When the strip shows", "The tab's own entry", "A sub-terminal entry", "Keyboard and focus" and "Accessibility". Contracts: .ade/context/terminal-open.md and .ade/context/pane-busy.md.

Not in 2b-i, do not build: closing a sub-terminal, its confirm, the × and Delete on entries (2b-ii); the count badge (2b-ii, per the owner's split); saving and restoring sessions (2b-ii); the agent dot, attention and activity marks, and the exited and restored states on entries (story 3); the CLI and ade open (4); the hidden-terminal budget (4b); Move to New Tab, Move to New Window and DetachedApp's strip (5); the ⌘K sub rows, toasts and Fleet labels (6); Insert command, the not-typed notice, the starting spinner and the "This shell has exited." bar (4 and 9).

Deviation from the summary, owner to note: the summary put some close-related clauses in criteria kept here. They move to 2b-ii with their test names: the "Close <name>" label and the × out of the tab order (B2, B17), Delete on an entry (B18), and "closing the last sub-terminal returns the view to own" (B1). 2b-i has no close control, so a sub-terminal in 2b-i is closed only with its tab.

Names fixed here so the tests can be named (the spec does not name them):
- src/stores/tabStore.ts: addView(tabId, { name, cwd, focus, spawnedBy }) returns the new view id. spawnedBy is optional and defaults to null; it holds the spawning view's id, "own" for the own view. New Sub-terminal passes null. showView(tabId, viewId).
- src/hooks/useOwnFolderCwd.ts (new): useOwnFolderCwd(activeTab: Tab | undefined, folderPtyId: number | null): string | null. It holds App's current folder logic unchanged: it polls getPtyCwd on tabFolderPaneId(tab) every CWD_POLL_MS, skips non-terminal tabs, keeps the last value for them, and re-runs when folderPtyId lands. App calls it in place of its activeCwd state.
- src/components/SubTerminalStrip.tsx (new), rendered in App.tsx above the shown view's PaneContainer for a terminal tab that has sub-terminals.
- src/lib/shortcuts.ts: prevSubTerminal { key: "[" } and nextSubTerminal { key: "]" }, both listed in src/lib/shortcutList.ts.
- src/components/TabBar.tsx: the "New Sub-terminal" menu item and the Move to New Window hide.

Acceptance criteria. Each is one or more named tests in the file given. Write each test first, see it fail, then write the minimal code. Labels B1 to B21 are the summary's numbering, kept so the cross-references stay valid.

B1 (summary 1). The strip is shown only while the tab has at least one sub-terminal: it shows when the tab has views beyond own, and is absent when it has none.
  Tests: src/components/__tests__/SubTerminalStrip.test.tsx "the strip shows only while the tab has a sub-terminal". The closing clause ("closing the last sub-terminal returns the view to own") is in 2b-ii as B1b.

B2 (summary 2). The own entry is first and pinned, shows tabLabel of the tab, and has no close button. A sub-terminal entry shows its name. No entry, tooltip or text shows a command line. The tooltip is "name — /full/cwd".
  Tests: SubTerminalStrip.test.tsx "the own entry is pinned, shows the tab label and has no close button"; "a sub-terminal entry shows its name and tooltip, never a command".

B3 (summary 3). addView without focus appends the view to viewOrder and leaves shownView, activeTabId and keyboard focus as they were. addView with focus: true makes the view shownView and makes its tab activeTabId (U1).
  Tests: src/stores/__tests__/subViews.test.ts "addView in the background keeps the selection"; "addView with focus shows the sub-terminal and activates its tab"; "addView stores spawnedBy and defaults it to null".

B4 (summary 4). The terminal tab's context menu has "New Sub-terminal" (U5). It adds a view named "Terminal" in the own view's folder, makes it shownView, and activates its tab, even when that tab was not active (Q9). The strip has no add control. The item is absent from the menus of editor, browser, fleet, orchestrator and contracts tabs.
  Tests: src/components/__tests__/TabBar.subTerminal.test.tsx "New Sub-terminal adds a Terminal in the own folder and shows it"; "New Sub-terminal activates its tab"; "New Sub-terminal is only in terminal tabs' menus"; "the strip has no add control".

B5 (summary 5). prevSubTerminal is ⌘[ (Ctrl+Shift+[ on Linux). nextSubTerminal is ⌘] (Ctrl+Shift+] on Linux). Both are listed in the shortcuts overlay. On Linux, the overlay note reads "On Linux, Ctrl+Shift+[ and Ctrl+Shift+] switch sub-terminals in every tab, so the shell does not receive them." (Q10). isAppShortcut keeps those keys from the shell in every tab.
  Tests: src/lib/__tests__/shortcuts.test.ts "prevSubTerminal and nextSubTerminal are ⌘[ and ⌘] and map to Ctrl+Shift+[ and ] on Linux"; "isAppShortcut keeps Ctrl+Shift+[ and ] from the shell"; "the overlay carries the Linux note"; the existing "lists every shortcut, with no combo used twice" still passes with the two new ids.

B6 (summary 5, cycling). In a tab with sub-terminals, ⌘] shows the next view (own, then each sub-terminal in viewOrder) and ⌘[ the previous. Both stop at the ends and do not wrap, as tab switching does. In a tab without sub-terminals, neither key calls preventDefault or changes any state.
  Tests: src/hooks/__tests__/useKeybindings.subTerminal.test.tsx "⌘] and ⌘[ step through the views and stop at the ends"; "without sub-terminals the two keys neither prevent default nor change the view".

B7 (summary 6). Each tab keeps its shownView across tab switches. Each view keeps its activePaneId. Showing a view focuses its active pane.
  Tests: src/stores/__tests__/subViews.test.ts "a tab remembers the view it last showed"; "each view keeps its own active pane"; SubTerminalStrip.test.tsx "showing a view focuses its active pane".

B14 (summary 12). Move to New Window is absent from the terminal tab menu when the tab has sub-terminals, and present when it has none (M9). Story 5 brings it back.
  Tests: TabBar.subTerminal.test.tsx "Move to New Window is hidden for a tab with sub-terminals"; "Move to New Window is present for a tab without".

B17 (summary 15, ARIA). The strip is role "tablist" with aria-label "Terminals in <tab label>". Entries are role "tab" with aria-selected, and aria-controls pointing at the content area. The selected entry has tabindex 0 and the others -1. (The × and its tabindex are 2b-ii.)
  Test: SubTerminalStrip.test.tsx "the strip is a tablist with a roving tabindex".

B18 (summary 15, keys). On the strip, ←/→ move focus between entries without wrapping. Home and End go to the first and last. Enter or Space shows the focused entry and moves focus into its terminal. (Delete is 2b-ii.)
  Tests: SubTerminalStrip.test.tsx "arrow, Home and End keys move focus without wrapping"; "Enter and Space show the focused entry".

B19 (summary 15, announcement). One visually hidden aria-live="polite" region per window. A background add says "Sub-terminal <name> opened in <tab label>". Adds within one second merge into "N sub-terminals opened in <tab label>". An add with focus says nothing extra.
  Tests: SubTerminalStrip.test.tsx "a background add is announced"; "adds within one second are merged"; "an add with focus is not announced" (fake timers).

B20 (summary 16). With a sub-terminal in another folder in sight, each call site uses the own view's folder, and each test asserts the folder that is passed or shown, not a helper's return value. The sites: App's activeCwd, which now comes from useOwnFolderCwd (App.tsx, about lines 76 and 286 to 299 on main); CommandPalette "Set up project" and the BMAD switch (CommandPalette.tsx, about lines 63 to 66 and 125 to 133); FileBrowser's root (FileBrowser.tsx, about lines 151 to 161). The App test targets the hook. A mutant that reads shownView at any of these sites must fail its test.
  Tests: src/hooks/__tests__/useOwnFolderCwd.test.tsx "the folder poll reads the own view's folder with a sub-terminal in sight"; src/components/__tests__/subTerminalCallSites.test.tsx "Set up project and the BMAD switch use the own folder"; "FileBrowser shows the own folder".

B21 (not in the summary; UX "The 'new' flash"). A background-added entry flashes its background to --accent-subtle once, over 1.2 s. No flash under prefers-reduced-motion. Built here (Q7).
  Test: SubTerminalStrip.test.tsx "a background add flashes once, and not under reduced motion".

Verification: the five approved lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest). cargo check -p ade-hook is not part of this story (from story 4 on, R4). Every test named above exists and passes. B20 needs its mutant check: a mutant reading shownView at each site must fail. Sizes, colours and the focus ring come from the UX spec's Look; QA checks them by eye against the UX spec and mockup.

Slice: src/stores/tabStore.ts (addView, showView, spawnedBy); src/components/SubTerminalStrip.tsx (new); src/components/TabBar.tsx (menu items only); src/lib/shortcuts.ts and src/lib/shortcutList.ts; src/hooks/useKeybindings.ts (⌘[ and ⌘] only); src/hooks/useOwnFolderCwd.ts (new), and App.tsx (renders the strip, calls the hook); the tests above. Nothing else, except the two files the owner approved during the build (2026-11-05): src/hooks/useTerminal.ts (the B7 split-view focus fix: when terminals mount, only the active pane takes focus) and src/components/ShortcutsOverlay.tsx (rendered by B5's test).'''
verify = '''the five approved lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest), and every test named in the acceptance criteria exists and passes. cargo check -p ade-hook is not part of this story (from story 4 on, R4).'''
