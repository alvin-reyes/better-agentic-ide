[[entry]]
id = "2b"
type = "story"
title = "Sub-terminals by hand: strip, switching, closing, saving"
description = '''Adds sub-terminals to the store and the UI, made by hand from the tab menu: the strip, switching, the count badge, the two shortcuts, New Sub-terminal, closing with its confirms, the live announcement, and saving them in the session. Nothing from the CLI yet (story 4). Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) The strip shows only while the tab has a sub-terminal, appears with the first and disappears with the last (the view returns to own).
(2) The tab's own entry is pinned and shows the tab's label; a sub-terminal entry shows its name; the full command line is never shown.
(3) addView adds a sub-terminal in the background: selection and focus stay; with focus it becomes the shown view and its tab becomes active (U1).
(4) "New Sub-terminal" in the terminal tab's context menu (U5) adds a view named "Terminal" in the tab's folder and shows it. No + on the strip.
(5) prevSubTerminal (Cmd+[ / Ctrl+Shift+[) and nextSubTerminal (Cmd+] / Ctrl+Shift+]) cycle the views; in a tab without sub-terminals they do nothing and do not preventDefault. Linux: isAppShortcut keeps these keys from the shell.
(6) Each tab remembers its shown view; each view remembers its active pane.
(7) Badge: "▤N" after the tab label, title and aria-label "N sub-terminals: x running, y exited", neutral colour, hidden at 0.
(8) Closing a sub-terminal (x, Cmd+W in it, or Cmd+Shift+W on its last pane) closes all its panes; it confirms when running. Running means pty_shell_idle is false (new Rust command pty_shell_idle(id) -> bool, true when tcgetpgrp equals the shell's pid); a Rust test covers an idle prompt (false running) and a program in the foreground (running).
(9) Closing a tab (x, Cmd+W on its own view, Close Others / to the Right) confirms when any view is running (U4), with the dialog wording in the UX spec; an idle prompt asks nothing.
(10) An aria-live polite region announces a background add ("Sub-terminal X opened in Y") and merges adds within 1 s; a focus-moving add says nothing extra.
(11) Session: SavedTab gains subViews (name, tree, folders, scrollback) and shownView; restored sub-terminals come back marked restored, start when first shown, and do not count as running. Commands, status and spawnedBy are never saved.
(12) sync.rs value_for_repo strips serializedBuffer from an ade-session with subViews, and no command line appears in the output (Rust test in sync.rs).
(13) A session saved before this story loads unchanged (one own view).
Slice: src/stores/tabStore.ts, the strip component (new), TabBar.tsx, TabSwitcher.tsx only where the strip needs it, src/lib/shortcuts.ts, App.tsx, src/lib/terminalCommands.ts (New Sub-terminal), src-tauri/src/pty.rs (pty_shell_idle), src-tauri/src/sync.rs, and their tests.
Verification: npm test, npx tsc --noEmit, cargo test in src-tauri, each exit 0, with the named tests for (1) to (13) passing.'''
verify = "npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each of criteria (1) to (13) (full names fixed at refinement)."
