# Sub-terminals and `ade open`: stories in build order.
# Spec: docs/superpowers/specs/2026-11-02-open-terminals-from-a-terminal-design.md, "Suggested stories" and "Testing" (revised after the final review, R1 to R7).
# UX: docs/superpowers/specs/2026-11-02-sub-terminals-ux.md. Contract: .ade/context/terminal-open.md. ADR 0014.
# Verification command for every story (the approved one, R4): the five lines of 2026-10-14-relay-pairing-design.md "Verification":
#   npx tsc --noEmit ; npm test ; cd src-tauri && cargo test ; cd relay && cargo test ; cd mobile && npx tsc --noEmit && npx jest
# plus cd src-tauri && cargo check -p ade-hook from story 4 on. Each must exit 0.
# Stories 1 and 2a were started before the revision (owner override, 2026-11-02). The rest carry refine = true: they get full acceptance criteria when pulled.

[[entry]]
id = 1
type = "story"
title = "Per-terminal hook tokens"
description = '''Each terminal's ADE_HOOK_TOKEN becomes HMAC-SHA-256(master, "pty:<id>") instead of one token per launch, and the endpoint checks the token against the X-ADE-PTY header it parses first. This amends ADR 0003 (ADR 0014, Tokens). Nothing else changes: no route is added, no frontend code changes, and /open does not exist yet (story 4).

Context. Today src-tauri/src/agent_status.rs has one token per launch: AgentStatus::start makes it with new_token(), terminal_env(pty) hands the same value to every terminal, and screen(method, headers, port, token, length) compares X-ADE-Token against it, then parses X-ADE-PTY and answers 400 when that is missing or malformed. The helper (src-tauri/src/hook_forward.rs, also compiled into ade-hook) reads ADE_HOOK_TOKEN and ADE_PTY_ID from its environment and sends both headers. The helper also keys input_hash with the token it was given; ADE itself never computes input_hash.

Slice (the only files to touch):
- src-tauri/src/agent_status.rs: the master key (32 random bytes from getrandom, held as 32 raw bytes in memory only, never hex-encoded, logged, put in an environment or on a command line; only the per-terminal tokens are hex); a pure function pty_token(master, pty) -> String giving the lowercase hex of HMAC-SHA-256 (hmac and sha2 are already dependencies); terminal_env(pty) sets ENV_TOKEN to pty_token; screen() reads X-ADE-PTY first (missing or malformed is 401), then compares X-ADE-Token in constant time with pty_token for that id (a mismatch is 401), then keeps the existing Origin and Host checks (403), the length check (413) and the method check (405). The test accessor token() is replaced by one that gives a terminal's token. serve() passes the master key through.
- src-tauri/src/agent_status.rs tests: the existing endpoint tests are updated to use per-PTY tokens; no assertion is weakened.
- src-tauri/src/pty.rs: test code only (the env tests near lines 640 to 705 read terminal_env, whose signature does not change). reserve_id is not changed.
- src-tauri/src/hook_forward.rs: no logic change; its tests stay as they are.
- .ade/context/agent-events.md: the token rows (lines 42 and 126 to 130) change from "Proposed (ADR 0014, not built)" to built for the token part only. The /open rows stay proposed.

Acceptance criteria (each is one test; names are the tests to write or update):
(1) A terminal's ADE_HOOK_TOKEN is the lowercase hex of HMAC-SHA-256 keyed by the master for the message "pty:<id>", and two terminals never share a token. Test a_terminal_token_is_the_hmac_of_its_pty_id: pty_token with the fixed key [7u8; 32] and id 12 equals a vector computed outside the code (openssl dgst -sha256 -mac HMAC with the same key, message "pty:12"); terminal_env(12) carries that value; terminal_env(13) differs.
(2) A request with a valid token for PTY 9 but X-ADE-PTY: 7 is refused with 401 and changes no state; and PTY 7's token with X-ADE-PTY: 9 likewise. Test a_pty_token_is_refused_for_another_pty.
(3) A request with no X-ADE-PTY header is 401, not 400, has body {} and changes no state. Test the_endpoint_refuses_and_changes_nothing (its "no PTY" case now expects 401).
(4) A malformed X-ADE-PTY (empty, "abc", "-1", "4294967296") is 401 and changes no state, even when the token is the right one for a valid id. Test a_malformed_pty_header_is_401.
(5) The master key is not accepted as a token: X-ADE-Token equal to the master's hex with a valid X-ADE-PTY is 401. Test the_master_key_is_not_a_token.
(6) A valid event from PTY 9 with PTY 9's token is 200 and changes the state of pane 9 only. Test the_endpoint_takes_a_right_token_and_answers_empty (updated to per-PTY tokens).
(7) The screening that already exists is unchanged: a wrong token, an Origin header, a foreign Host, GET and an oversize body all still refuse with the same codes and {} bodies. Test the_endpoint_refuses_and_changes_nothing (its other cases, unchanged except (3)) and the_endpoint_listens_on_loopback_only (updated to call the new screen signature).
(8) The helper still forwards with the token and PTY id it was given: the existing forwarding test in hook_forward.rs (the one asserting "X-ADE-Token: tok" and "X-ADE-PTY: 7") passes unchanged.
(9) PTY ids are never reused, so a token is never valid for a second terminal: the existing test the_child_sees_the_reserved_id_and_this_ades_values (pty.rs, asserting reserve_id(&next) == 42 after 41) passes unchanged.
(10) The input hash is keyed by the terminal's own token: the existing input_hash tests in hook_forward.rs (the same input gives the same hash, a different key gives a different one) pass unchanged.

Verification: the five approved lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest), and the tests named in (1) to (10) appear in the output by name. Also, grep for the old accessor token() in agent_status.rs finds no uses in tests.

Out of scope: the /open route and CLI (story 4); any change to the helper binary; any frontend change; the Windows path.
Known uncertainty: the master key lives in ADE's memory for the run; a process that reads a terminal's own environment can use that terminal's token, as before (ADR 0014 consequences).'''
verify = "the five approved lines each exit 0 (npx tsc --noEmit; npm test; cd src-tauri && cargo test; cd relay && cargo test; cd mobile && npx tsc --noEmit && npx jest); the named tests for ACs (1) to (10) pass, including a_terminal_token_is_the_hmac_of_its_pty_id, a_pty_token_is_refused_for_another_pty, a_malformed_pty_header_is_401 and the_master_key_is_not_a_token."
