description = '''Move to New Tab for a sub-terminal; Move to New Window carrying every view (and shown again for tabs with sub-terminals, which 2b-ii hid, M9); the headless reattach of hidden panes in the detached window; kill on destroy; and the strip and shortcuts in DetachedApp. Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) Move to New Tab (sub-terminal context menu): it becomes a top-level tab right after its tab, with its panes and shells (no restart) and its name, and becomes the active tab. Afterwards ade open from it adds sub-terminals to the new tab.
(2) Move to New Window carries every view: detachTabToWindow sends views, viewOrder and shownView; detachTab detaches every view's instances. Present again in the tab menu for tabs with sub-terminals.
(3) The detached window reattaches the shown view on mount and every hidden pane at once, headless (createReattachedInstance without a container). The hidden-terminal budget covers this once story 4b is in (whichever lands first). The PTY owner label moves to the new window.
(4) The destroy handler kills allTabPanes, so closing the detached window ends all its shells.
(5) DetachedApp shows the strip (left inset 84 px for the window controls), supports the two shortcuts and the closing confirms; Move to New Tab is hidden there.
(6) No Move to New Window for a single sub-terminal (cut in v1).
(7) Guard inside detachTabToWindow itself, not only at the menu: 2bi hides the menu item, and detachTab removes the whole tab while detachTabToWindow sends only the own view, so a call on a tab with sub-terminals would drop them from the main window while their PTYs live on. Called directly on such a tab, detachTabToWindow sends every view, viewOrder and shownView (as in (2)); if it cannot carry a view it refuses and changes nothing. A sub-terminal never leaves the main window except in the same call that carries it. Test: src/lib/__tests__/detachWindow.test.ts "detachTabToWindow on a tab with sub-terminals carries every view and leaves none in the main window", calling detachTabToWindow directly, not through the menu.
(8) CONDITIONAL MIRROR, F3 VV-2 AC3 (Move to New Tab carries the viewer state; F3.8 "Merges second", D14; added 2026-11-10 by the F3 S1 sharding). If F3 S1 story s1a (_bmad-output/initiative-per-view-viewer/epic-slice-1-viewer-state, ticket s1a) is on main when this ticket is reviewed, and again before merge if it lands in between, this ticket also carries VV-2 AC3: Move to New Tab moves the sub-terminal's View object unchanged, so its viewerKey and its viewer state (root, expanded folders, open file at its position, layout) go with it, and the new tab's own view has them. Test, in this ticket's Move to New Tab test file: "Move to New Tab keeps the viewer key and the viewer state of the moved view". Relevant contract: .ade/context/viewer-state.md ("Viewer key", Move to New Tab). If F3 S1 story s1a is not on main, F3 story s1a carries the criterion. Refine this item into the full criteria when this ticket is pulled.
