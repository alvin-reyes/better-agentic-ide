[[entry]]
id = 4
type = "story"
title = "ade open adds a sub-terminal"
description = '''Adds the CLI verb ade open with the no-flags form: it adds a sub-terminal to the caller's tab, in the caller's folder or --cwd, optionally named, optionally focused, through POST /open on the existing endpoint. Command and split answer 422 "not supported yet" in this story (stories 8 and 9). Includes the claim, the limits, the headless creation with its cost budget, and manual check V3, which gates this story's Done. Large: may be split into 4a (route, window, claim, limits), 4b (headless creation and budget) and 4c (CLI) when pulled.
Summary of criteria, each a test at refinement:
(1) ade-hook acts as the CLI only when argv0 is ade or ade.exe or args[0] is open, help or --help. mode(argv0, args) is a pure function in src-tauri/src/ade_cli.rs, with a test for each case; guard is never the CLI.
(2) The CLI exit codes: 0 opened; 1 refused or failed with ADE's message (a 400 with {} says "this ADE is too old for ade open; restart ADE"); 2 usage (for example "--cwd: no such folder"); 3 not in an ADE terminal (a variable missing); 4 ADE gone or the terminal closed (message mentions tmux and screen); 5 is story 9's. Tests against a local TcpListener.
(3) POST /open is screened by the same screen() (405, 403, 401, 413); unknown fields and wrong types are 400; /open with a bad cwd, name, or command shape is 422 per the contract table. Tests for each row.
(4) The CLI resolves --cwd against $PWD logically, like cd, checks it is a folder with stat, and sends the logical path.
(5) Routing: / is hook events, /open is this, anything else is 404 {}. Hook events still served while an /open waits.
(6) The window answers: the caller's window has a listener (409 if not; listeners dropped on WindowEvent::Destroyed); the caller pane must be live (410 if not).
(7) expiresAt is 5 s after the request; a window past it does nothing; on timeout Rust answers 504 "ADE didn't answer; no terminal was opened", types nothing, and sends expired; the window then closes what it added late.
(8) The PTY claim: at the request Rust records floor (the next PTY id) and the window passes requestId into create_pty, which stores it on the new PtyInstance. Rust accepts ptyId only if it was created with that requestId, is at or above floor, is unclaimed, is live and is owned by that window. Each of these gives typed:false in a test: below the floor; already claimed; dead; foreign window; created without this requestId (a terminal the user opened).
(9) Headless creation: the window calls openTerminal(paneId, {cols, rows}) at the caller's size (24x80 if no instance) and then create_pty, before any mount; a never-shown terminal gets scrollback min(setting, 1000), no GPU renderer and no image addon; first show gets all three. Tests cover a normal mount and first show after headless creation (enableGpuRenderer path).
(10) Limits: each caller pane has a bucket of 8 refilling 1 per second; at most 32 /open shells running, counting requests in flight; both answer 429. Tests with an injected clock.
(11) Naming: --name wins; else the command's first word skipping VAR=value words (for example "npm run dev" gives npm; "env TOKEN=x npm run dev" gives env; "FOO=1 make" gives make); else the folder basename; else "Terminal". Never the full line. Tests for each.
(12) Owner label: create_pty records the owner window; reattach replaces it.
(13) Manual check V3 (ADR 0009, cost budget): with 8 hidden sub-terminals each running ade open -- sh -c 'yes "$(printf %0100d 0)" | pv -qL 1m' (pv from Homebrew), run window.__adeEchoProbe(200) (added in this story, dev builds only) in the visible pane and record p50, p95 and max. Passes when p95 is under 50 ms. The machine, the macOS version and the three numbers go in this story's Verification section. Until the owner runs it, QA records "not run, pending the owner" and story 4 is not Done.
Slice: src-tauri/src/ade_cli.rs (new), src-tauri/ade-hook/src/main.rs, src-tauri/src/hook_forward.rs (the CLI client), src-tauri/src/agent_status.rs (route /open, the answer and its timeout), src-tauri/src/terminal_open.rs (new: validation, limits, claim, expiry), src-tauri/src/pty.rs (requestId on PtyInstance, owner), src/lib/terminalOpen.ts (new), src/hooks/useTerminal.ts (headless creation and the first-show path), src/App.tsx or the window's listener, and tests.
Verification: npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each criterion (1) to (12); plus manual check V3 recorded per (13).'''
verify = "npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each of criteria (1) to (12); AND manual check V3 (criterion 13) run by the owner on a Mac and recorded here with p50, p95, max, the machine and the macOS version (p95 under 50 ms). Until then, QA records 'not run, pending the owner' and the story is not Done."
