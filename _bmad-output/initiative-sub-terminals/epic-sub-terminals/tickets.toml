type = "story"
title = "ade open -- COMMAND: typing the command into the new shell"
description = '''Adds the command: the words after -- are typed into the new shell with Enter, best effort, through the claim and the typing rules of the contract. Adds exit code 5 (opened, command not typed). Adds the not-typed notice with Insert command, and the runner entry in the CLI-library guard (D1). Full criteria are refined when this is pulled.
BLOCKED on outside work, held in unknown until it is on main or the owner rules otherwise: (a) shellQuote (ADR 0008) from branch hermes-a-quoting (commit 8b06ea4), or its quoter and tests cherry-picked unchanged (D9); (b) the CLI-library guard (ADR 0011) from branch feat/cli-guard, which must classify ade open and "$ADE_HOOK_BIN" open as a runner.
Summary of criteria, each a test at refinement:
(1) The window quotes each word with shellQuote; bare words matching ^[\w./-]+$ are left as they are. Words are printable ASCII (D6; non-ASCII is refused, never altered). The line is at most 1000 bytes. At most 64 words.
(2) Rust refuses a command unless the shell is sh, bash, zsh, fish, dash or ksh (422).
(3) Typing happens only after the window answers with ptyId and the claim passes: Rust waits for the first output, then 300 ms of quiet, at most 5 s; at 5 s it goes on if there was any output, otherwise nothing is typed; it types only if tcgetpgrp equals the shell's pid; it writes line plus Enter. Tests against scripted output and an injected foreground probe.
(4) A command that cannot be typed leaves the shell alone and gives typed:false: CLI exit 5 and a typed message to the window.
(5) The not-typed notice shows only the first word and an ellipsis, never the full line; Insert command writes the full quoted line without Enter, is disabled while pty_shell_idle is false (title "Available once the shell is back at its prompt"), and checks again on click. The line is held in memory only.
(6) The spinner clears when the typed result arrives, at most about 5 s after the open.
(7) The known typing failures (a builtin read in an rc file, an rc child started before job control, exec tmux) are documented in the contract and checked by manual check V2 (does not gate Done).
Slice: src/lib/terminalOpen.ts, src/lib/shellQuote.ts (from hermes-a-quoting), src-tauri/src/terminal_open.rs (typing), src-tauri/ade-hook (exit 5), the notice component, the CLI-library guard's runner table (on feat/cli-guard), and tests.
Verification: npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each criterion (full names fixed at refinement). Story is not pulled while unknown is set.'''
verify = "npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each of criteria (1) to (6) (full names fixed at refinement); held until the unknown is gone."
