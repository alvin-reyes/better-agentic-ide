[[entry]]
id = "4b"
type = "story"
title = "Hidden-terminal budget, dev helpers and V3"
description = '''The cost budget for terminals created without a container (story 4's ade open, and story 5's detached-window reattach), with the dev helpers that measure it, the "only the last 1000 lines" tooltip, and manual check V3. V3 gates this story's Done (ADR 0009, on the unmerged branch docs/claude-md-paths), and does not gate story 4. Starts after stories 4a and 4c are on main. Full criteria are refined when this is pulled.
Budget. It applies to every terminal created without a container: createInstance with a null container and createReattachedInstance for a hidden pane. A terminal created with a container (every normal mount, and a restored session's panes whose saved scrollback is written before the seat) is unchanged.
(1) Until its first seatTerminal: scrollback is min(setting, 1000); refreshAllTerminals keeps the cap on a not-yet-seated instance; no ImageAddon.
(2) At its first seatTerminal, before the renderer is decided: scrollback becomes the setting and the ImageAddon is loaded before loadGpu (D3 of #73), and also on the paths where WebGL is off or unavailable. An instance is marked seated so this happens once.
(3) Tests: a hidden instance has the capped scrollback and no image addon; refreshAllTerminals keeps the cap; the first seat loads the image addon before the WebGL addon (order of loadAddon calls) and lifts the cap; a normal mount is unchanged; a restored pane keeps more than 1000 lines of saved scrollback.
(4) Dev helpers, dev builds only (import.meta.env.DEV): window.__adeEchoProbe(200) writes 200 single characters to the visible pane's PTY, 50 ms apart, and records for each the time from the write_pty call to xterm's onWriteParsed seeing it echoed; it prints p50, p95 and the maximum. window.__adeTypeInHidden(command) types command and Enter into every sub-terminal of the active tab that has not been shown.
(5) The tooltip "Opened in the background: only the last 1000 lines are kept until you view it" ships here, not before (N6).
(6) Manual check V3 (gates this story's Done). Load: run plain ade open --name load1 ... load8 from the visible pane, then window.__adeTypeInHidden('yes "$(printf %0100d 0)" | head -c 10000000 | pv -qL 1m') (1 MB/s for 10 s each; pv from Homebrew). Starting it by hand instead means showing each sub-terminal, which lifts its budget; record which way was used. Measure: window.__adeEchoProbe(200) in the visible pane while the load runs. Passes when p95 is under 50 ms. The machine, macOS version and the three numbers go in this story's Verification section. Until the owner runs it, QA records "not run, pending the owner" and the story is not Done.
Slice: src/hooks/useTerminal.ts, the instance module that owns createInstance and refreshAllTerminals, the dev-helper module (new, DEV-gated), the tooltip in the strip component, and tests.
Verification: the five approved lines plus cd src-tauri && cargo check -p ade-hook each exit 0, with a named test for each of criteria (1) to (5), and V3 recorded per (6).'''
