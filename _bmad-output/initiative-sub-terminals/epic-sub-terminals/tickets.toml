[[entry]]
id = 4
type = "story"
title = "ade open adds a sub-terminal"
description = '''Adds the CLI verb ade open, no-flags form: it adds a sub-terminal to the caller's tab, in the caller's folder or --cwd, optionally named, optionally focused, through POST /open on the existing endpoint. Command and split answer 422 "not supported yet" in this story (stories 8 and 9). No manual check gates this story; the hidden-terminal budget and V3 are story 4b. Starts after story 1 and 2b are on main. Full criteria are refined when this is pulled. Large: may be split into 4a (route, threads, claim, limits) and 4c (CLI) when pulled.
Terminal creation (R5): the window creates the new pane's terminal at once, through today's createInstance with no container, at the caller's size (24x80 if no instance), then create_pty with the requestId. Rust never spawns or kills.
Summary of criteria, each a test at refinement:
(1) ade-hook acts as the CLI only when argv0 is ade or ade.exe or args[0] is open, help or --help. mode(argv0, args) is a pure function in src-tauri/src/ade_cli.rs, one test per case; guard is never the CLI (keep guard ahead of mode(); feat/cli-guard rebases onto this or the reverse).
(2) CLI exit codes per the contract table: 0 opened; 1 for any answer other than 200, 401 or 410, or no answer within 15 s, with ADE's message (a 400 with {} says "this ADE is too old for ade open; restart ADE"); 2 usage (for example "--cwd: no such folder"); 3 a variable unset or malformed; 4 connection refused, 401 or 410 (message mentions tmux and screen); 5 is story 9's. Tests against a local TcpListener, one per row.
(3) POST /open is screened by the same screen() (405, 403, 401, 413); unknown fields and wrong types are 400; a bad cwd, name or command shape is 422 per the contract.
(4) The CLI resolves --cwd against $PWD logically, like cd, checks it is a folder with stat, and sends the logical path.
(5) Routing: / is hook events, /open is this, anything else is 404 {}. Hook events are still served while an /open waits (test).
(6) Threads and the handler (N7): serve screens, reads the body and calls admit(caller_pty) on its own thread. A refusal is answered there. An admitted request and its tiny_http::Request go to a new thread that calls handle(admission, body) and answers. AgentStatus::set_open_handler(Arc<dyn OpenHandler>) is called once in .setup(); until then /open answers 409 "ADE is still starting". Tests inject a fake handler.
(7) The in-flight slot is an RAII Admission whose Drop releases it. Tests: a handler that panics, and an injected spawn failure (answered 503 on the serve thread), each leave the count where it started.
(8) Owner window: a listener per window (409 if none; dropped on WindowEvent::Destroyed); the caller pane must be live (410 if not).
(9) expiresAt is 5 s after the request. A window past it does nothing. On timeout Rust answers 504 "ADE didn't answer; no terminal was opened", types nothing, and sends expired; the window closes whatever it added late.
(10) The PTY claim: at the request Rust records floor (the next PTY id). create_pty stores the requestId on the new PtyInstance. Rust accepts ptyId only if it was created with that requestId, is at or above floor, is unclaimed, is live and is owned by that window. Each of these gives typed:false in a test: below the floor; already claimed; dead; foreign window; created without this requestId.
(11) Exactly one create_pty: a test opens with --focus and counts one create_pty; another does a background add shown at once.
(12) --focus resize (N10): if the mounted size differs from the size the PTY was created with, once create_pty returns the window sends resize_pty with the pane's current size. Test: mount with a different size before create_pty resolves; one resize_pty follows.
(13) PtyInstance fields: the owner window label (create_pty sets it; reattach replaces it) and requestId. Merge pair with feat/cli-guard: if feat/cli-guard is on main first, add the fields after PtyInstance::new; otherwise carry them through new()'s arguments. Either way one test covers construction with both fields.
(14) Limits: 8 per caller pane, refilling 1 per second; at most 32 /open shells running, counting admitted requests in flight; both answer 429. Tests with an injected clock.
(15) Naming: --name wins; else the command's first word after leading VAR=value words; else the folder basename; else "Terminal". Never the full line. Tests: "npm run dev" gives npm; "env TOKEN=x npm run dev" gives env; "FOO=1 make" gives make; no command gives the folder name or Terminal.
(16) Flattening: a sub-terminal's own ade open adds a sibling to the same tab (spawnedBy = the caller's view name), never a nested strip.
Slice: src-tauri/src/ade_cli.rs (new), src-tauri/ade-hook/src/main.rs, src-tauri/src/hook_forward.rs (CLI HTTP client), src-tauri/src/agent_status.rs (route /open, thread per request, set_open_handler, Admission), src-tauri/src/terminal_open.rs (new: validation, limits, claim, expiry), src-tauri/src/pty.rs (requestId, owner label, PtyInstance::new pair), src/lib/terminalOpen.ts (new), src/hooks/useTerminal.ts (creation at once, resize), the .setup() wiring in src-tauri/src/lib.rs, and tests.
Verification: the five approved lines plus cd src-tauri && cargo check -p ade-hook (added from this story on, since no other line compiles the helper), each exit 0, with a named test for each criterion (1) to (16). No manual check.'''
