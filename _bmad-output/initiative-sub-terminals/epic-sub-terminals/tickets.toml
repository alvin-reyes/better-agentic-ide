title = "Moving sub-terminals and tabs; Move to New Window back"
description = '''Move to New Tab for a sub-terminal; Move to New Window carrying every view (and shown again for tabs with sub-terminals, which 2b hid, M9); the headless reattach of hidden panes in the detached window; kill on destroy; and the strip and shortcuts in DetachedApp. Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) Move to New Tab (sub-terminal context menu): it becomes a top-level tab right after its tab, with its panes and shells (no restart) and its name, and becomes the active tab. Afterwards ade open from it adds sub-terminals to the new tab.
(2) Move to New Window carries every view: detachTabToWindow sends views, viewOrder and shownView; detachTab detaches every view's instances. Present again in the tab menu for tabs with sub-terminals.
(3) The detached window reattaches the shown view on mount and every hidden pane at once, headless (createReattachedInstance without a container). The hidden-terminal budget covers this once story 4b is in (whichever lands first). The PTY owner label moves to the new window.
(4) The destroy handler kills allTabPanes, so closing the detached window ends all its shells.
(5) DetachedApp shows the strip (left inset 84 px for the window controls), supports the two shortcuts and the closing confirms; Move to New Tab is hidden there.
(6) No Move to New Window for a single sub-terminal (cut in v1).
