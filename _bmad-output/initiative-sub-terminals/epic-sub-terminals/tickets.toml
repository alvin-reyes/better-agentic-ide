type = "story"
title = "ade open --split, in any view"
description = '''Adds --split right|down to ade open: it splits the caller's pane, in the caller's view (hidden or not), and makes no sub-terminal. Until now split answers 422 "not supported yet" (story 4). Full criteria are refined when this is pulled.
Summary of criteria, each a test at refinement:
(1) split right or down is accepted; splitPane runs by pane id in whichever view holds the caller's pane, so it works from a hidden view.
(2) The split limit is 4 per direction per view; the window refuses past it with 409 and the CLI exits 1 with ADE's message.
(3) --split from a pane whose tab is not a terminal tab is refused with 409.
(4) --name is refused together with --split (CLI usage error, exit 2; the Rust body refuses with 422).
(5) A split never creates a sub-terminal, and the new pane gets its terminal headless as in story 4.
Slice: src-tauri/src/terminal_open.rs, src-tauri/ade-hook (CLI check), src/lib/terminalOpen.ts, src/stores/tabStore.ts (splitPane), and tests.
Verification: npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each criterion (full names fixed at refinement).'''
verify = "npm test, npx tsc --noEmit and cargo test in src-tauri each exit 0, with a named test for each of criteria (1) to (5) (full names fixed at refinement)."
