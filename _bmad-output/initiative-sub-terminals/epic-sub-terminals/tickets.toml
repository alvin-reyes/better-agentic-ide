[[entry]]
id = "2b"
type = "story"
title = "Sub-terminals by hand: strip, switching, closing, saving"
description = '''Adds sub-terminals to the store and the UI, made by hand from the tab menu: the strip, switching, the count badge, the two shortcuts, New Sub-terminal, the busy-checked closing, the live announcement, and saving them in the session. Nothing from the CLI yet (story 4). Starts only when 2a is merged to main and hermes-b-busy-panes is merged to main (R1). Full criteria are refined when this is pulled.
Busy check (R1): this story adds no busy check of its own. Every sub-terminal confirm uses hermes-b-busy-panes: the Rust command pty_foreground_job, paneBusy and decideBusy, applied by useGuardedClose. pty_shell_idle is not added. A view is running when paneBusy is non-null for any of its panes; a tab is running when any of its views is, its own included.
Summary of criteria, each a test at refinement:
(1) The strip shows only while the tab has at least one sub-terminal; it appears with the first and disappears with the last, and the view returns to own.
(2) The tab's own entry is pinned and shows the tab's label; a sub-terminal entry shows its name; the full command line is never shown.
(3) addView adds a sub-terminal in the background: selection and focus stay. With focus (--focus, used by story 4) it becomes the shown view and its tab becomes active (U1).
(4) New Sub-terminal (U5), in the terminal tab's context menu, adds a view named "Terminal" in the tab's folder and shows it. No + on the strip.
(5) prevSubTerminal (Cmd+[ / Ctrl+Shift+[) and nextSubTerminal (Cmd+] / Ctrl+Shift+]) cycle the views. In a tab without sub-terminals they do nothing and do not preventDefault. On Linux isAppShortcut keeps those keys from the shell.
(6) Each tab remembers its shown view; each view remembers its active pane.
(7) Badge: "▤N" after the tab label, title and aria-label "N sub-terminals: x running, y exited", neutral colour, hidden at 0.
(8) Closing a sub-terminal (x, Cmd+W in it, Delete on its entry) uses requestCloseView; Cmd+Shift+W on its last pane uses requestClosePane and then closes the view. A running view confirms (paneBusy over its panes); an idle prompt asks nothing.
(9) Closing a tab (x, Cmd+W on its own view) uses requestCloseTab over allTabPanes, and confirms when any view is running (U4), with the UX dialog wording; Close Others / to the Right uses the existing one confirmation over allTabPanes of each tab.
(10) Restored-not-shown guard: useGuardedClose skips a pane with neither an instance nor a ptyId. Test: a session restored with a sub-terminal that is never shown, then the tab closed, asks nothing.
(11) requestCloseView and Cmd+Shift+W on a sub-terminal's last pane kill every pane through the instance or, with none, the store's ptyId (kill_pty). Test: a pane with no instance is killed. (N4; 2a's closePane already kills by the store's ptyId.)
(12) Move to New Window is hidden in the tab menu for a tab with sub-terminals (M9), and present for a tab without. Story 5 brings it back for tabs with sub-terminals.
(13) Session: SavedTab gains subViews (name, tree, folders, scrollback) and shownView. The 5 MB truncation in saveSession keeps the tail of each pane's scrollback across root and every subViews tree. Test: a session over 5 MB whose bulk is in a sub-terminal is truncated. An old session loads unchanged as one own view. Restored sub-terminals start when first shown and do not count as running. Commands, status, spawnedBy and the typed line are never saved.
(14) sync.rs value_for_repo strips serializedBuffer from an ade-session with subViews, and no command line appears in the output (Rust test in sync.rs).
(15) An aria-live polite region announces a background add ("Sub-terminal X opened in Y") and merges adds within 1 s. Roving tabindex and the arrow, Home, End, Enter and Delete keys work on the strip (UX, Accessibility).
Slice: src/stores/tabStore.ts (addView, shownView changes, session), the strip component (new), TabBar.tsx and TabSwitcher.tsx only where the strip needs it, src/lib/shortcuts.ts, App.tsx, src/lib/terminalCommands.ts (New Sub-terminal), the useGuardedClose and the detached-window menu only for the M9 hide, src-tauri/src/sync.rs, and their tests. No Rust busy check is added here.
Verification: the five approved lines (see the header) each exit 0, with a named test for each of criteria (1) to (15) (full names fixed at refinement).'''
