[[entry]]
id = "w2"
type = "story"
title = "Session save, restore and Reopen"
description = '''F7 slice S1, story 7 of 16. VERTICAL (store): a server tab is saved, restored ended, closed and reopened, and the saved shape is a checked-in fixture. No process is started and no connect request is made (SV-2 AC6 forbids a start by restore or Reopen). Design sections 8.1 (the record, origin), 8.3 (closeTab, reopenClosedTab, decision D-1 as PRD revision 8 now states it), 8.5 (session save and restore; the fixture) and 17 (row W2). Needs W1 (the types and serverTabs.ts).

Build, test first:
1. saveSession (tabStore.ts, about lines 735-830): a remote pane is saved as { id, serializedBuffer, remote: { serverId, destination, summary, state } }; it is not asked for a folder and gets no savedCwd. A tab is saved with serverNamed: true when set. Nothing else changes; the session has no version field and gains none. The never-saved members (notice, end, refusal, origin) are not written.
2. The fixture src/lib/serverFixtures/session.json, written by the test from a fixed state (a local tab; a server tab; a server tab the engineer renamed; a server tab with a local split; each remote record holding markers), with UPDATE_FIXTURES=1 regenerating it (the pattern of scripts/bmadTextFixture.test.ts). The test asserts that saveSession's output equals the file, byte for byte.
3. loadSession: a pane with remote comes back with state "ended", origin "restored", ptyId null, no initialCwd. Mounting it takes the remote branch, which is w3b's; this story only sets the state.
4. closeTab for a server tab: the ClosedTab entry gains server?: { serverNamed, serverId, destination, summary } and its cwd is null. reopenClosedTab then opens a tab with that name and mark whose first pane has remote with state "ended", origin "reopened" and no PTY: no create_pty, no connect request.
5. A server-named tab with no remote pane (only a session not written by this build can hold one) is remembered as a local tab named "Terminal" with no mark and no folder (PRD SV-4 AC3 as revision 8 states it; design D-1, now the PRD's text). Duplicate stays not offered for it (W6's menu).
6. Mutation-free reads: the save and restore code reads the store once per action; nothing here calls a Tauri command.

Acceptance (PRD SV-4, SV-2 and SV-3 items; each named test as the design gives it):
(1) SV-4 AC1, owner of the criterion (PRD SV-4 item 1, "Saved"): a remote pane is saved with its tab's name and server-named mark, its serverId, destination, summary and state, and no savedCwd; the saved record equals session.json (TypeScript, saveSession against a stubbed store). A marker in the record's destination appears only where the fixture has it.
(2) SV-4 AC2, partial (owner w3b; PRD SV-4 item 2, "Restored ended"): a restored remote pane is ended, with origin "restored" and no PTY; the create_pty count for it is 0 (the mount test is w3b's).
(3) SV-4 AC3, partial (owner w6; PRD SV-4 item 3, "Reopen Closed Tab and Duplicate"): a closed server tab reopens as a server tab whose remote pane is remote and ended with no process and no connect request; for a server-named tab that held no remote pane, it reopens as a local tab named "Terminal" with no mark; an edited Host between close and reopen makes no request until confirmed (the confirmation is w6's and w3b's).
(4) SV-2 AC6, partial (owner w6; PRD SV-2 item 6, the table's Close then Reopen row): for that row the tab's pane is remote and ended, with no process, and the store test asserts 0 connect requests and the state in the row, on the tab's and the pane's records.
(5) SV-3 AC9, partial (owner r6): the save after the close-and-reopen sequence holds no marker of a server name where the tab is local; the Rust export test is r6's.
(6) Tests named as the design gives them: a single-view tab and a server tab save and restore; the fixture equals saveSession's output; closeTab then reopenClosedTab for a server tab (state ended, origin reopened, cwd null); the server-named no-pane case reopens as "Terminal" with no mark.

