[[entry]]
id = "d1"
type = "story"
title = "zsh on the Linux backend CI job"
description = '''F7 slice S1, story 3 of 16 (DevOps; the design's D1; docs/architecture.md, "F7 stories that start processes", item 2: the runner prerequisite). INFRASTRUCTURE (CI). It delivers no PRD criterion. It makes the Linux Backend job able to run F7's process tests, which fail, and never skip, when zsh or bash is missing (SV-2 AC2). It must be Done before story r4's first step, and before the Linux runs of r3a and r5.

Build. In .github/workflows/ci.yml, the job "Backend (cargo test)" (runs-on ubuntu-22.04), its step "Install Linux dependencies" (lines 108 to 119 on main): add zsh to the apt-get install list, beside the webkit and GTK packages. Nothing else in the workflow changes. The job already has bash; the Frontend job installs zsh and fish for shellQuote.test.ts and is not changed. Add a line to the same step, or a following step, that prints zsh --version and bash --version, so that the run's log shows both shells on the Linux job (this is evidence for the gate; it is not a test).

Acceptance.
(1) The Linux backend job's install step installs zsh (the change is visible in the workflow file on the story's commit).
(2) The job's log, on the story's commit, shows the zsh and bash version lines and the job's result.
(3) No other job, step or test changes.
(4) The workflow file stays valid YAML (the workflow parses; the check is the CI run itself).

Verification of the story. The general command in force passes on the story's work. Plus one green run of the CI workflow's job "Backend (cargo test)" on the story's final commit, attempt 1, with its log showing the zsh version line. This story is not one of the F7 stories that start processes, so the F7 gate's two-job requirement does not apply to it; QA cites the run by URL in the Verification section.

Files (expected): .github/workflows/ci.yml (changed). docs/ops.md does not exist on main, so no ops note is written; the DevOps role owns docs/ops.md when it is written. ADE's devops agent is the owner of the change.

Dependencies. after = []; it may run beside c1, r1 and w1 (the design's order starts them together). Story r4 depends on it.

Out of scope. Installing fish or any other shell; changing the macOS job (macOS has zsh and bash); any test; any F7 code; the Windows job (SV-8 AC3: no Windows build of F7). Do not weaken or skip a test to get the job green.

Stop rule. If the Linux job's package list cannot install zsh on ubuntu-22.04 with the job's apt source, stop and report it; do not swap the runner image.'''
