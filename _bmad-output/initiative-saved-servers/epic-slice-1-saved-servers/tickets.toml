(8) SV-2 AC10, owner of the criterion (PRD SV-2 item 10, "Under an unsupported shell, Connect is refused"): the message, with and without the name (the kind's base name only when the rule allows it).
(9) SV-4 AC3, owner of the criterion (PRD SV-4 item 3, "Reopen Closed Tab and Duplicate"): the reopened bar; the menu has no Duplicate for a server tab; an edited Host between close and reopen shows the held form and makes no request until confirmed (the menu and the hand-built tab).
(10) SV-3 AC5 partial (owner w3b; the split marks): the split panes of a server tab carry no remote mark.
(11) SV-5 AC3, owner of the criterion (PRD SV-5 item 3, "Tab sets"): the saved workspace's left-out count names the number of server tabs left out.
(12) SV-6 AC1, AC2, AC4, partial (owner w4, as the design's table names): the words of the on-a-server state and the refused write's message; the test asserts the words the UX gives and that the scratchpad keeps the text.
(13) SV-2 AC9, partial (owner r5; PRD SV-2 item 9): the messages' rendering of each kind of hand-over notice, and End's presence only with the message; the judgement is r5's.
(14) SV-8 AC2, partial (owner r5): the "Possibly no SSH client" title and its announcement, with the status and the OS line (UX 5.6); the no-ssh-client kind's rendering.
(15) SV-7 AC5, owner of the criterion (PRD SV-7 item 5, "The list's store is untrusted input", which has no test of its own; its tests are SV-1 AC2 and AC4, SV-2 AC5, SV-7 AC2, SV-3 AC4 and SV-9 AC2): the last of those to pass in build order is this story's (SV-3 AC4 and the held press); its completion is the named tests of those criteria passing on the story's final commit, and the hostile text in the file is never drawn (UX 9, "hostile" in the mockup).

