5. Every reader of design 8.8's table is covered by one of the three facts or the changes above; the readers the table marks "not read beyond the call" are checked by the store test of F2 and F3, not by reading them again.
6. The close question's decision (design 8.7): useGuardedClose (src/hooks/useGuardedClose.ts:19-23, 154) asks paneKind first: connecting or live asks, ended does not, and paneBusy is not called for a remote pane in either case; a local pane goes through today's path unchanged; a tab asks when any pane would. The question's component test is w6's.

Acceptance (PRD SV-6 items 1 to 4 and SV-5 item 5, each named as the design gives it):
