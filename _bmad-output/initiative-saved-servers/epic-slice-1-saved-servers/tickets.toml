# F7 slice S1: sixteen stories, in the design's build order (no two in parallel unless the story's `after` allows it).
# Build order: c1, r1, w1, d1; then r2, r3a, w2, w4; then r3b, r6, w3a, w3b; then r4, w5, w6; then r5.
# Design: docs/superpowers/specs/2026-11-18-saved-servers-design.md (section 17 is the story list and the criterion map).
# PRD: docs/prd.md F7 revision 10, SV-1 to SV-9 (the criterion text is the PRD's; each entry names its criteria by id and the
# PRD location of the item). Contracts: .ade/context/saved-servers.md, .ade/context/server-panes.md (both approved 2026-11-18).
# Merges second: .ade/context/f7-merges-second.md. Mirror items: the S1 stories r2 (SV-5 AC8, availability), r6 (SV-5 AC7, the
# outward name) and w3a (SV-5 AC8, serversAvailable), phone-watch ticket 8 and F1 ticket e29.
#
# Owner rule (in this epic file, "Coverage"): each S1 criterion has exactly one owning story, the last story in build order that
# delivers one of its named tests. Earlier stories deliver their named tests as partial deliveries, marked "partial, owner <id>", and
# are not Done for that criterion.
#
# Verification command in force (docs/architecture.md, "In force", seven lines, each from the repository root, each exits 0):
#   npx tsc --noEmit
#   npm test
#   cd src-tauri && cargo test
#   cd relay && cargo test
#   cd mobile && npx tsc --noEmit && npx jest
#   cd src-tauri && cargo check -p ade-hook
#   cd src-tauri && cargo test -p ade-hook
# Extra gate for r3a, r3b, r4 and r5 (docs/architecture.md, "F7 stories that start processes"): a green run of both backend CI jobs,
# "Backend (cargo test)" (Linux, ubuntu-22.04) and "Backend on macOS (cargo test)", on the story's final commit, cited by the
# procedure of F1's gate, item 4, applied to these two jobs. Every counted run has attempt 1.

[[entry]]
id = "c1"
type = "story"
title = "The shared dialog components"
description = '''F7 slice S1, story 1 of 16. Design section 22 (story C1), section 17 (order: first, with R1, W1 and D1). It delivers no PRD criterion of its own: it is the shared confirm dialog that SV-1 AC3 (story w5) and SV-3 AC6 (story w6) rely on, and it changes existing behaviour for every caller, which F7.9 and the PRD's revision 9 say.

Summary. ConfirmDialog joins the Escape stack, gains its role, labels, a focus trap and focus return, and loses its window-level Enter. useFocusTrap skips tabindex -1 controls and the trap that acts is the last-mounted one whose dialog holds focus. No key handler on the buttons, no new dependency (no user-event).

Decided (the owner, 2026-11-18, D-15): Enter activates the focused button only, and focus opens on Cancel, for every caller, today's five close questions included. Story c1 is the one place this rule is built. There is no enterConfirms prop.

Build, test first:
1. The change list of design section 22, in its order: (a) ConfirmDialog calls useEscapeToClose(onCancel) and drops its own Esc handling; (b) the panel gets role alertdialog, aria-modal true, aria-labelledby (title) and aria-describedby (message), ids from useId, tabIndex -1; (c) it calls useFocusTrap on its panel and gives focus back to the opener on closing when the opener is still in the document and focus is not elsewhere; (d) the window-level Enter handler is removed, and the two buttons are type button with onClick only, no key handler anywhere; (e) useFocusTrap's selector excludes [tabindex="-1"]; (f) useFocusTrap keeps a module-level stack and the trap that acts on Tab is the last-mounted one whose dialog holds focus, with the two fallbacks of section 22 (focus on the page: the last-mounted trap brings it back; focus outside every dialog: none acts).
2. Tests (design section 22, the C1 test table), written first, in the files named under Files.

Acceptance (the tests that pin this story; each is a named test):
(1) Esc over a panel that uses useEscapeToClose: the question's onCancel once, the panel's onClose not at all; a second Esc closes the panel.
(2) role alertdialog, labelled by the title, described by the message.
(3) Tab and Shift+Tab cycle between Cancel and the confirm button, also when the question sits in a panel with its own trap.
(4) A click on Cancel calls onCancel once and never onConfirm; a click on the confirm button calls onConfirm once.
(5) An Enter key-down sent to window, to the panel, to the focused Cancel and to the focused confirm button calls neither onCancel nor onConfirm; both controls are enabled button elements of type button.
(6) A source test: ConfirmDialog.tsx holds no keydown, onKeyDown, onKeyUp or onKeyPress.
(7) Focus opens on Cancel; on closing focus returns to the opener when it is still in the document.
(8) useFocusTrap, a grid with one roving stop: Tab from the real last stop goes to the first; a tabindex -1 button is never a stop.
(9) useFocusTrap, two nested traps: with focus in the inner dialog only the inner trap moves focus; after it unmounts the outer acts again.
(10) useFocusTrap, a second dialog mounted while a question is open, outside it: with focus still in the question, Tab from its last stop goes to its first; with focus moved into the second dialog, Tab cycles there and the question's trap does nothing; Esc calls the second dialog's handler and not the question's onCancel.
(11) Through App's wiring: an Enter key-down on window straight after the close question opens leaves the tab open (this is red on today's code, which confirms from the window, and it pins change 4).
(12) The existing tests stay green and unchanged: SwitchConfirm, MethodologyPrompt, useEscapeToClose, useGuardedClose, and the three other files that render ConfirmDialog (closeConfirm, SubTerminalStrip, CommandPalette).

Files (the design read these on this branch: src/components/ConfirmDialog.tsx, src/components/useEscapeToClose.ts, src/components/useFocusTrap.ts, src/hooks/useGuardedClose.ts, App.tsx at its ConfirmDialog render site, the five questions of design section 22's table):
- src/components/ConfirmDialog.tsx (changed)
- src/components/useFocusTrap.ts (changed)
- src/components/useEscapeToClose.ts (read; expected unchanged)
- src/components/__tests__/ConfirmDialog.test.tsx (new, expected name)
- src/components/__tests__/useFocusTrap.test.tsx (new or extended, expected name)
- src/__tests__/closeConfirm.test.tsx (extended for item 11; expected name, the design names it)
- App.tsx (read at the render site, line 449 on main; expected unchanged)

Dependencies. None (after = []). Stories r1, w1 and d1 may run beside it; w5 and w6 depend on it.

Contracts. Reads .ade/context/saved-servers.md only for the dialog's use by W5 and W6. Records nothing new in the Context Store.

Out of scope. The F7 components themselves (the list, the marks, the palette): stories w5 and w6. The five questions' texts. Any change to useEscapeToClose's own behaviour (not changed by C1; section 22 says Esc goes to the dialog opened last). A methodology prompt's Esc order over a question (section 22 states it, does not fix it). No new dev dependency. The user guide's sentence on closing: the guide change is written in this story as the design's C1 note says, in the same change, only for the sentence that says Enter confirms a close (docs/guide/terminal.md; PRD F7.11, "The user guide, with S1", Closing).

Notes for the developer. jsdom does not turn Enter on a focused button into a click, so the test asserts what the component owns (no handler), not the platform's click. The manual check, which does not gate Done: with something running in a pane, Cmd+W then Enter leaves it open; Cmd+W, Tab, Enter closes it once.'''
verify = "The general verification command in force passes on the story's work, and the named tests (1) to (12) appear by name in the npm test output and pass. No CI gate: this story starts no process."
covers = []
after = []
hitl = false
risk = "medium"
refine = false

[[entry]]
id = "r1"
type = "story"
title = "Rules with reason codes, the quoter, the grammar, the kinds and the wire types"
description = '''F7 slice S1, story 2 of 16. INFRASTRUCTURE (Rust, pure): nothing else in S1 can be checked without it. It builds the rules every later Rust story calls, the one quoter, the one grammar, the twelve kinds and every type that crosses to the webview, with their checked-in fixtures. It starts no process, adds no command to lib.rs and reads and writes no file. Design sections 6, 7, 2.3, 9 (the log rules), 10 (the fixtures table) and 17 (row R1). Contracts: .ade/context/saved-servers.md (the record, the 23 reason codes, the kinds) and .ade/context/server-panes.md. ADR 0043 (the new crate is recorded there).

Partial deliveries (their criteria are owned by later stories; the tests named here are the Rust and pure halves):
- SV-1 AC1 (owner w5, which adds the form messages): the Rust table of rules.rs, every reason reached.
- SV-2 AC1 (owner r4): the grammar table and the home-folder rows, as pure tests.
- SV-7 AC1 (owner r4): no -o, -F, -J, -A, -X, -t, -v, -L, -R, -D, no user@host form and no remote command in any grammar.
- SV-7 AC2 (owner r4): the hostile fixture, pure half.
- SV-7 AC3 (owner r4): the quoter table and Word.
- SV-5 AC4 (owner r5): the twelve kinds, their JSON and the 23 pairs in kinds.json, the redacting Debug.
- SV-9 AC1 (owner w5): the summary and order tables.

Build, in this order, each piece test first:
1. The crate: unicode-normalization added to src-tauri/Cargo.toml with its lock file committed in the same change (CI builds with --locked). ADR 0043 cites it. The test is that cargo test --locked builds.
2. quote.rs: Word has exactly two makers, Word::saved(&str) (a saved value is checked by check() first; the type takes the home folder's bytes only through under_home, design 2.3) and Word::under_home(home: &OsStr, rest) (the home folder's bytes followed by the saved value after ~). shell_quote(&Word) -> OsString works on bytes: maximal runs without ' or \ are single-quoted, and each of those two bytes is escaped outside quotes. The Rust test reads src/lib/shellQuote.cases.json with include_str! (new file; the rows: empty, plain words, every character 0x20-0x7e, runs of ' and \, a leading and a trailing quote, a space, non-ASCII: /Users/Zoë Q/.ssh/id, a CJK path, an emoji path, a path with ' beside a non-ASCII letter). The TypeScript test src/lib/__tests__/shellQuote.test.ts asserts the existing TypeScript quoter against the same file. A case added for one side is a test on both.
3. rules.rs: check(input, existing) -> Result<Record, Vec<Failure>>, every field checked, one Failure per failing field, the first matching row of the table, in the order name, host, port, user, identityFile. Failure is one enum of the 23 (field, reason) pairs, serialised { "field", "reason" }; a pair not in the table cannot be built; it holds no value. The reason codes are those of .ade/context/saved-servers.md (empty, too-long, characters, taken, first-character, holds-port, not-ipv6, unspecified, not-ipv4, leading-0x, not-a-port, out-of-range, and the rest). existing is an input: the callers decide it (the table in saved-servers.md). The name key is NFC then str::to_lowercase. The name rule calls terminal_open::name_char_ok (terminal_open.rs:180); if that function is private to its module, it is made crate-visible in this story and nothing else in it changes.
4. rules.rs: the summary [USER@]HOST[:PORT] (an IPv6 host in brackets when a port follows) and the list order (name key, then code points). Pure.
5. grammar.rs: arguments(record, home: Option<&OsStr>) -> Result<Vec<Word>, Failure>: [-p PORT] [-l USER] [-i FILE] -- HOST, each pair only when its field is set, at most 8 words, -- always present, HOST last. A leading ~/ in the identity file is replaced by the home folder's bytes (Word::under_home), passed as they are. Home unset or empty with a ~/ identity file gives the failure { identityFile, home-unknown }. A record with no identity file, or an absolute one, does not need home. The expanded path exists only in the argument list.
6. kinds.rs: Kind, one enum, serialised { "kind": "<id>", ...payload }, the twelve ids of design section 7: server-failed-checks (fields: 1 to 5 {field, reason}), list-unreadable, list-not-saved (errno absent or integer), list-full, server-gone, shell-not-supported (shell absent or the base name), not-in-engagement, terminal-not-started (cause always present: start, closing or pane; errno only with start, absent when the library's error holds none), no-ssh-client (status 127), ended-before-ssh (status integer, or absent), not-handed-over-another-program, not-handed-over-yet. An optional member is absent, never null. No variant holds text ADE did not choose, except the shell's base name under section 2.2's rule.
7. wire.rs: every type that crosses to the webview with its serde shape (rename_all camelCase, deny_unknown_fields on arguments): ServerRow, SaveArgs, SaveResult, RemoveArgs, ConnectArgs, Connected, Destination, EndArgs (section 10). Each has a hand-written Debug that prints the type name and no member; Record, Destination and every error holding one too.
8. Fixtures, checked in under src/lib/serverFixtures/ (Rust reads them with include_str!): kinds.json (each of the twelve kinds with every payload form, each cause, each of the 23 pairs, and one refusal listing five fields) and commands.json (the arguments of the five commands as the webview sends them; ServerRow whole, minimal, with problems and with withheld members; SaveResult with and without a warning; Connected). Rust: each Kind serialises equal to its row; a thirteenth variant fails; every arguments row deserialises into its struct and an extra member is refused. TypeScript side (in w3a, not here): each row parses as the union.
9. The hostile fixture src-tauri/src/saved_servers/hostile.json, at least 40 values per field; the pure half (each value refused, or accepted with every character in the field's set) runs in rules.rs.
10. The static tests (wiring.rs, cfg(test)): sources.list (the checked-in list of every .rs file under src-tauri/src/saved_servers/ that builds or makes a client start, with its inline tests) is checked against the directory: a file not in the list fails. The text test over the listed files: none contains keyring or find_command; the only reference to the vault module is named in the list (none yet in this story, since the reader is r4's). The no-panic scan: outside tests, no unwrap, expect, panic!, unreachable!, assert!, dbg!, println! or eprintln!, except .lock().unwrap(). The redacting-Debug unit test formats each type with {:?} and {:#?} holding markers and asserts none appears. fixture.rs and wiring.rs are test support and exempt from the scan.
11. mod.rs with the module declarations, and one mod line in src-tauri/src/lib.rs (mod saved_servers;). No command is registered in this story.

Acceptance (each a named test in the design's own words, written first):
(1) SV-1 AC1, Rust, pure, the rules half: a table of accepted and refused values per field with each refusal naming field and reason: db1.example.com:2222 gives host holds-port; 2130706433 gives host not-ipv4; 022 gives port not-a-port; 0 gives port out-of-range; -l gives user first-character; ~/.ssh/%h gives identityFile a token the SSH client expands. Every reason of the closed list reached by at least one row; one record whose five fields each fail gives five field-and-reason pairs in the order name, host, port, user, identity file. Accepted and refused lists as PRD SV-1 AC1 gives them (db1.example.com, 192.0.2.7, 2001:db8::7, ::ffff:192.0.2.7, staging-db, xn--bcher-kva.example; a second server DB1 when db1 exists; and the refused values of the PRD, including ::, 254-character host, a name with a right-to-left override).
(2) SV-2 AC1, partial (owner r4), the grammar table: {host db1.example.com, port 2222, user deploy} gives ["-p", "2222", "-l", "deploy", "--", "db1.example.com"]; for every valid record the list has at most 8 arguments and ends "--", HOST; home /Users/Zoë Q with ~/.ssh/id gives the one argument /Users/Zoë Q/.ssh/id; home rel/home gives rel/home/.ssh/id; no home with ~/ gives the home-unknown failure and no list; no home with an absolute identity file gives its list.
(3) SV-7 AC1, partial (owner r4): no -o, -F, -J, -A, -X, -t, -v, -L, -R, -D, no user@host form, no remote command in any grammar the table produces.
(4) SV-7 AC3, partial (owner r4): the quoter's table through shell_quote equals the file's expected column (the Rust half); Word has no third maker; wiring: shell_quote is the only function under saved_servers/ that emits a quote character into an instruction.
(5) SV-7 AC2, partial (owner r4): the hostile fixture's pure half: every value refused or accepted with every character in its field's set; at least 40 values per field.
(6) SV-5 AC4, partial (owner r5): each Kind serialises equal to its row in kinds.json; a thirteenth variant fails the test; each terminal-not-started cause is in the file, with errno only on start; the 23 pairs in the file match Failure's enum exactly.
(7) SV-9 AC1, partial (owner w5): the summary table and the order table (name key, then code points) in rules.rs.
(8) SV-7 AC4, partial (owner r4), the text test and sources.list (written here; r4 adds the vault-reference rows and the vault-index check): a .rs file under saved_servers/ not in sources.list fails; each file in the list is named.
(9) The no-panic scan and the redacting-Debug test pass, over the files this story creates.
(10) cargo test --locked builds with unicode-normalization, and the lock file change is in the same commit.

Stop rule. If a row of the PRD's tables gives a different outcome from the one the design and saved-servers.md state, stop and write the difference into the Results; do not pick one.

Files (expected unless marked read):
- src-tauri/Cargo.toml (changed), src-tauri/Cargo.lock (changed, new crate and its own dependencies)
- src-tauri/src/lib.rs (changed: one mod line)
- src-tauri/src/terminal_open.rs (read; name_char_ok made crate-visible only if private)
- src-tauri/src/saved_servers/mod.rs, rules.rs, grammar.rs, kinds.rs, wire.rs, quote.rs, wiring.rs, sources.list, hostile.json (new)
- src/lib/shellQuote.cases.json (new), src/lib/__tests__/shellQuote.test.ts (changed: the case-file assertion)
- src/lib/serverFixtures/kinds.json, commands.json (new)
- .github/ no change; docs/ no change

Dependencies. After c1 is not required (after = []); it may run beside c1 (the design's order starts them together). Story r2 and everything later need it.

Out of scope. The store (r2), the five commands and their registration (r2 and r4), the client start, the supported shell, the home folder's lookup home_of (r4), the process code of any kind (r3a, r3b, r5), the TypeScript kinds mirror and its test (w3a), the vault reader (r4).

Notes for the developer. Byte-wise quoting: the quoter takes bytes (OsStr), so a non-ASCII home folder works. Read the design's section 2.3 for the Word makers before writing quote.rs.'''
verify = "The general verification command in force passes on the story's work, with cargo test --locked for src-tauri. The named tests (1) to (10) appear by name in the cargo test output and pass, and the TypeScript shellQuote test (item 4's file) passes in npm test. No CI gate: this story starts no process."
