[[entry]]
id = "w4"
type = "story"
title = "Writes, file links, the folder and the close question's paneKind"
description = '''F7 slice S1, story 8 of 16. VERTICAL (webview: the write rule, file links, the folder's facts and readers, the close question's decision). No process is started by this story and no connect request is made. Design section 8.7 (close confirm, paneKind), 8.8 (writes, file links, the folder, every reader) and 17 (row W4). Needs W1 (serverTabs.ts: paneKind, remotePane, isServerTab).

Build, test first:
1. Writes. writePty(id, text, opts?) (src/lib/terminalCommands.ts:43) looks the pane up by PTY id; when it is remote and opts?.userSend !== true it shows the server-session message and rejects with RemotePaneError. Callers that resolve the active pane before they have a PTY id (sendToActiveTerminal, the agent picker's "This terminal") ask remoteRefusal(pane) first, so an ended remote pane (no PTY) refuses with the same message. The checked-in list src/lib/ptyWriters.sites.json (new) names every call of writePty(, writePtyInput( and invoke("write_pty" under src/ outside tests, by file and enclosing function, with the classes of design 8.8's table: terminal input; named user send; refused in a remote pane. A static test compares the list with the source. The scratchpad's send to a remote pane with an image attached sends nothing, keeps the text and says why.
2. File links. registerFileLinks(term, getCwd, open, enabled) (src/lib/terminalFileLinks.ts:179) gains a predicate; the provider returns no links while it is false; useTerminal passes () => paneKind(pane) === "local". URL links are another provider and are untouched.
3. The folder, three facts, each with its own test: F1, getPtyCwd(paneId) gives null for a remote pane without an invoke (useTerminal.ts:743); F2, the folder store (usePaneCwd's cwds) never holds an entry for a remote pane (a store test asserts no entry after three polls of TerminalPane's 3 s poll); F3, a remote pane never has initialCwd or savedCwd (a store test asserts both absent after creation, save and restore, and Reopen).
