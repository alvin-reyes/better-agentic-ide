[[entry]]
id = "r2"
type = "story"
title = "The store and the list commands"
description = '''F7 slice S1, story 5 of 16. VERTICAL in Rust for the server list's data (no webview component; the list's form is w5). No process is started. Design section 5 (the store, ADR 0043), 6 (the rules' callers and existing), 7 (the kinds this story reaches), 10 (the three list commands), 11 (availability) and 17 (row R2). Contracts: .ade/context/saved-servers.md ("The record", "Why a value was refused", the kinds). Needs R1 (rules.rs, grammar, kinds, wire.rs, quote.rs and the fixtures).

Build, test first:
1. store.rs: load(path) -> Result<List, Kind> exactly as design section 5's table states (no file gives an empty list; any unreadable, newer or malformed file gives list-unreadable and nothing is written by any command until it loads; a member other than id and the five is dropped on load; a row whose values fail check is loaded with problems; two rows with one name key: the first keeps its name, each later one gets taken, checked against the rows earlier in the file; more than 200 rows loads and Add is refused). The file is saved-servers.json in the instance's app-data folder, beside vault-index.json, outside state/ (not a persisted key; not exported by ADE sync). Format version 1, as section 5's example.
2. Mutations add, edit, remove, under one process-wide mutex: load from disk, check, apply, write through state::atomic_write (sibling temp file, fsync, rename). Nothing is cached between calls. add refuses at 200 rows with list-full. A refused check writes nothing (byte-identical file). A failed write returns list-not-saved with the error number when there is one (absent otherwise) and the next load gives the list as it was. After every successful mutation Rust emits the Tauri event servers-changed with no payload to the main window.
3. Rows for the webview: ServerRow built from the record with problems (each failing field with its reason code, fileIndex) and withheld members: a value that fails its field's rule is left out of the row (a failing name is sent as the empty string). Rows are ordered by the name key then code points, with rows whose name is withheld last. The summary of section 6 is in the row.
4. identity_warning(path) -> Option<Warning>: std::fs::metadata only, never open; "not found" or "not a regular file". Returned by servers_save beside the saved row, never as a refusal. servers_list returns no warning (section 6).
5. mod.rs: availability(platform, engagement: bool) (the table of section 11: macOS and Linux with no engagement are available; an engagement gives not-in-engagement; Windows gives no, and the commands are registered only under cfg(unix)); instance_is_engagement() returns the constant false in S1. The three commands servers_list (rejects list-unreadable, not-in-engagement), servers_save (rejects server-failed-checks, list-unreadable, list-full, list-not-saved, server-gone for an edit of a removed row, not-in-engagement) and servers_remove (rejects list-unreadable, list-not-saved, not-in-engagement), each #[tauri::command(async)], each checks that the calling window is main and that availability holds, each takes one serde struct from wire.rs. Registered in lib.rs under cfg(unix). server_connect is not in this story (r4).
6. The kinds this story reaches, with the log test: server-failed-checks at a save, list-unreadable, list-not-saved, list-full, not-in-engagement. The log test uses a log helper that captures ade.log's lines for the call; it asserts the kind name is logged where design 7's log rule says and that no value appears (or nothing is logged by F7's code: the rule is in section 7, "The log").
7. sources.list and the wiring test (r1's) updated for the new files in the same commit (store.rs and the rest).

Acceptance (the PRD's text, by item; each test named as the design names it):
(1) SV-1 AC2, owner of the criterion: a record carrying added members password, options, command and proxyCommand loads to the five fields; after one save through ADE the store holds none of those member names or values (Rust). The grammar built from it has none of their values (the grammar part is r1's; this story asserts the store).
(2) SV-1 AC4, owner of the criterion: with a corrupt store and with a newer-version store, every write action (add, edit, remove) leaves the file byte-identical and returns the "could not be read" kind (list-unreadable); the 201st add is refused with list-full. A list that cannot be written: with the store's folder made read-only (Unix), an add, an edit and a remove each return list-not-saved, the file is byte-identical, and a load afterwards gives the list as it was.
(3) SV-1 AC3, partial (owner w5, which adds Remove's question; PRD SV-1 item 3): after an add, an edit and a remove the list holds what was asked (Rust), and a refused save leaves the store byte-identical. The refusal's content is r1's rules; the add/edit/remove tests are this story's.
(4) SV-1 AC1, partial (owner w5): a save whose five fields each hold a marker and each fail a rule returns five field-and-reason pairs and no marker, and ade.log holds no marker.
(5) SV-1 AC5, partial (owner r4): identity_warning on a FIFO with no writer, and on a regular file of mode 000, returns (the call does not block; bound 30 s, a generous one), the FIFO case warns "not a regular file", and the saved path is kept. (The client start's half is r4's.)
(6) SV-5 AC1, partial (owner r6): the store file is in no folder-keyed or ADE-sync key: the sync key list of sync.rs does not name saved-servers.json; markers saved through add are absent from the export of the ade-sync keys (the export is r6's).
(7) SV-7 AC4, partial (owner r4): vault-index.json is byte-identical after add, edit, remove and a load (the fixture: a checked-in vault-index.json with a marker name).
(8) SV-5 AC4, partial (owner r5): the log test of the kinds this story reaches (server-failed-checks at a save, list-unreadable, list-not-saved, list-full, not-in-engagement) with the log helper; no marker appears in ade.log.
(9) SV-5 AC8, partial (owner w5; PRD SV-5 item 8): with the engagement input true, the three commands refuse with not-in-engagement, read no store and write nothing (Rust, pure through availability(platform, true)); the default profile's list is not readable from an engagement, which this story states and whose instance test is the merges-second item below.
(10) SV-8 AC3, partial (owner w5): availability for macOS and Linux with no engagement is yes; with an engagement is no; for Windows is no (pure, every platform).

CONDITIONAL MIRROR, F7 SV-5 AC8 (engagements; the PRD's F7.11 mirror, "Merges second", D15; written at the S1 sharding 2026-11-19). If F1 ticket e29 (_bmad-output/initiative-personas-and-engagements/epic-profile-and-rule, ticket e29) is merged to main when this story is reviewed, and again before merge if it lands in between, this story also carries SV-5 AC8's instance test: connect instance_is_engagement() to F1's real signal, so that the answer is no by F1 slice 1's gate; then, in A's instance of e29's scenario, a connect request is refused with not-in-engagement and makes 0 client starts (the connect is r4's; this story adds the list commands' refusal), and a marker in the default profile's server list is found nowhere in A's instance. Until e29 is on main, the constant false stays and the S1 test (9) above is the criterion's test. Gate: this story's verification command; F1's side is F1 D28. Item (11) names the carrier; the item passes by name if its condition held at review. Its item in this file is (11).
(11) CONDITIONAL, SV-5 AC8 instance test (see the mirror above): by name, "a list command in an engagement's instance is refused not-in-engagement and reads no store" and the instance test of e29's scenario, if e29 was on main at review; otherwise the item is not in this story's gate.

