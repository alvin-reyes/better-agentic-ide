[[entry]]
id = "r4"
type = "story"
title = "The client start: server_connect, the environment and the shell's instruction"
description = '''F7 slice S1, story 13 of 16. VERTICAL in Rust, the first story that makes the SSH client run. It starts processes (the user's shell, the recording stub, real zsh and bash), so the F7 CI gate applies: the local lines plus a green run of both backend CI jobs on the final commit, zsh on the Linux job (d1). FIRST STEP (design section 17, R4): SV-2 AC2's table run under the CI image's bash 5.1 and zsh on the Linux backend job, before the rest is built; a row that gives another outcome there is a finding for the product manager's table, and the story stops until the owner decides. Design sections 2.1 (the invocation), 2.2 (supported shells), 2.3 (quoting in Rust; the home folder), 2.4 (the environment), 2.5 (the command and its steps 1 to 7; the start folder), 2.6 (the tests that need a real shell), 6 (the rules' use at a connect), 7 (kinds), 17 (row R4). Contracts: .ade/context/saved-servers.md, ADR 0044 (the login shell replacing itself with ssh), ADR 0008 (the quoter's rule). Needs R1 (rules, grammar, quote, kinds, wire), R2 (the store), R3b (ending::admit and ending::insert) and D1 (zsh on Linux).

Build, test first:
1. vault::secret_names(): a plain reader of vault-index.json in app data, names only; no keychain call, no secret's value read. The design (section 4) lists vault.rs (secret_names) as the one change to vault.rs. Its test: the function reads the file as a plain file and returns the names.
2. client_env.rs: client_env(base environment, names) builds the environment the shell is started with (PRD SV-2 AC8, the five rules (a) to (e), with the design's section 2.4): no vault value (no call to env_for_terminals); no ADE_* variable set; every inherited ADE_* variable removed; no SSH_* set or changed (the user's own SSH_ values reach ssh unchanged), SSH_ASKPASS and SSH_ASKPASS_REQUIRE never set; every inherited variable whose name is a vault secret's name removed, a listed name starting SSH_ included. ADE hands what a new terminal's shell gets otherwise (ADE's environment, TERM, the default locale).
3. secret_names is the one vault reference in the saved_servers tree; wiring.rs names it in the checked-in list.
4. supported_shell(path) -> Result<Shell, Kind> (design 2.2): the base name after the last slash; zsh and bash exactly; anything else is shell-not-supported, carrying the base name only when it is 1 to 32 characters of A-Z a-z 0-9 . _ + -. Runs before anything is started.
5. home_of(base) -> Option<&OsStr> reads HOME as bytes from the base the client start is given (not crate::env_home); start_folder(home) per design 2.5's table (set and not empty: the folder as it is; unset: no folder set, the library picks the user's folder or /; set and empty: /).
6. The instruction (2.1): the shell is started as <shell> -l -i -c <instruction>, where the instruction is exec command ssh G... for zsh and exec ssh G... for bash, every word quoted by shell_quote (r1's) and joined by one space. Its output for {host db1.example.com, port 2222, user deploy} under zsh is 'exec' 'command' 'ssh' '-p' '2222' '-l' 'deploy' '--' 'db1.example.com'.
7. server_connect(app, window, ptys, agent, args: ConnectArgs { serverId, paneId, rows, cols }, on_event: Channel<PtyEvent>) -> Result<Connected, Kind>, #[tauri::command(async)], main window only, the steps of design 2.5 in order: (1) availability (not-in-engagement; window main); (2) load the store (list-unreadable); (3) find the identifier (server-gone); (4) rules::check on the record with existing = the rows earlier in the file (server-failed-checks with every field and reason); (5) supported_shell (shell-not-supported); (6) build the grammar and the instruction and the environment, then ending::admit (closing, pane; a paneId that is not 1 to 64 of A-Z a-z 0-9 - _ is refused with cause pane); spawn in the start folder (terminal-not-started, cause start, with errno only when the library's error holds one); a start is never refused for lack of a home folder unless the identity file starts ~/ (home-unknown); (7) ending::insert (closing or pane refusals; the instance is then ended by the routine). Connected { ptyId, destination, summary } on success. The command's ConnectArgs has deny_unknown_fields.
8. The call site: client_start::start has exactly one call site outside tests, server_connect (the wiring test asserts it). No other caller; Reconnect is the same command for the same pane.
9. The per-pane rule and the gate's two tests repeated through the command, with the stub: a late start, a closed gate (r3b's tests through server_connect); with closed set a new server_connect starts 0 processes.
10. The keychain test binary: src-tauri/tests/saved_servers_keychain.rs (a separate integration test binary) with a recording stand-in: a connect and a second one make 0 keychain calls and the vault-index.json file is byte-identical after each (SV-2 AC8, SV-7 AC4).
11. Tests that need zsh and bash (design 2.6): each fails, never skips, when zsh or bash is missing (#[cfg(unix)]); the fixture sets HOME and ZDOTDIR to the fixture home and removes BASH_ENV and ENV; a fixture home whose start-up files export SSH_AUTH_SOCK=/marker and put the stub ssh first on PATH.

Acceptance (PRD SV-1, SV-2, SV-5, SV-6 and SV-7 items; each named as the design gives it):
(1) SV-2 AC1, owner of the criterion (PRD SV-2 item 1, "The grammar"): the grammar table through a client start (the stub's argument list equals the table's row); the home-folder rows (/Users/Zoë Q with ~/.ssh/id gives one argument /Users/Zoë Q/.ssh/id; no home with ~/ gives the home-unknown refusal with 0 starts and the kind server-failed-checks, field identityFile, reason home-unknown; no home with an absolute identity file gives its list); the client start for a record with no home folder and no identity file starts (not refused).
(2) SV-2 AC2, owner of the criterion (PRD SV-2 item 2, "How the SSH client is started"): the fixture table (both shells, both quoted-alias rows, the rows of design 2.1's run table) through server_connect with the stub: one connect gives exactly one stub record, its arguments equal AC1's, its environment has SSH_AUTH_SOCK=/marker, its folder is the fixture home, its process id equals the pane's; each row asserts its definition is in effect (the start-up file's last line); the rows' required outcomes (i), (ii) as the table states; the quoted-Host row has one record whose last argument is the alias's value. The live half of the table is r5's (partial).
(3) SV-2 AC5, owner of the criterion (PRD SV-2 item 5, "Checked again at every client start"): an edited record on disk to host -oProxyCommand=touch /tmp/x (use a fixture path, not /tmp) and to user $HOME: a connect request gives 0 stub records, starts no process, and returns server-failed-checks naming the field and "a character that is not allowed"; two rows sharing a name key: the first starts, the second is refused with taken (design 6).
(4) SV-2 AC8, owner of the criterion (PRD SV-2 item 8, "The connection's environment"): the builder with its five rules (a) to (e) as unit tests; the process-only variable through a child run of the test executable (the variable reaches the stub); the index missing and damaged (no failure beyond the rules); the keychain binary (item 10).
(5) SV-2 AC10, partial (owner w6; PRD SV-2 item 10): under an unsupported shell (a fixture $SHELL of fish, or an unlisted name) Connect is refused with shell-not-supported and 0 starts; the base name is carried only as item (4) states.
(6) SV-1 AC5, partial (owner of the criterion: this story; PRD SV-1 item 5, "The identity file is never opened"): a FIFO with no writer and a regular file of mode 000 as the identity file: the client start returns (a generous bound of 30 s, not a tight one), the grammar holds the path, and no open is made.
(7) SV-7 AC1, owner of the criterion (PRD SV-7 item 1, "Host key checking is the SSH client's"; the design's test "no -o in any grammar; .ssh byte-identical"): a fixture home's .ssh directory is byte-identical after an add, a connect and a second connect (the test reads every file's bytes); the grammar of the client start has no -o.
(8) SV-7 AC2, owner of the criterion (PRD SV-7 item 2, "Hostile values run nothing"): the hostile fixture through a client start with the fixture shells: no hostile value that passes the rules runs anything; the check's refusal makes 0 starts.
(9) SV-7 AC3, owner of the criterion (PRD SV-7 item 3, "Through the shell, safely"): accepted values through both shells: the stub gets each word as one argument, byte for byte; a fixture home with a space and a non-ASCII character in its path: the stub gets the ~/ identity file as one argument, byte for byte, and (in R5) the pane goes live; history untouched (no history file written).
(10) SV-7 AC4, owner of the criterion (PRD SV-7 item 4, "S1 uses no keychain"): the text test (r1's list) names no keyring and no find_command in every file of the list; the only vault reference is secret_names; vault-index.json byte-identical after add, edit, remove, connect and Reconnect (the keychain binary; the store half is r2's).
(11) SV-6 AC3, owner of the criterion (PRD SV-6 item 3, "Agent status"): the agent state of a remote pane: ADE runs and installs nothing for it (the client start's process list has only the shell and the ssh of the grammar; the agent tracker is not called for a remote terminal).
(12) SV-5 AC4, partial (owner r5): the log test for the kinds this story adds a way to reach (server gone, shell not supported, could not start a terminal, failed checks at a connect), with the log helper of r2; no marker in ade.log. The "could not start" kind carries cause start, closing or pane, with errno only with start; the messages are the webview's (w6).
(13) SV-2 AC5's Rust half and the TypeScript half (w3b) together satisfy the Reconnect row: Reconnect with a changed row leaves the pane remote and ended (the TypeScript side is w3b's item (6)).

Gate. The general verification command in force passes on the story's work (the local lines, zsh and bash on PATH, with the fixture home isolation). Plus the F7 gate: a green run of both backend CI jobs, Backend (cargo test) on ubuntu-22.04 and Backend on macOS (cargo test), on the final commit, attempt 1 each, cited by URL; plus the first step's record (item FIRST STEP, the Linux table under bash 5.1 and zsh) in the Verification section.

Files (expected unless marked read):
- src-tauri/src/saved_servers/client_env.rs (new), client_start.rs (new), mod.rs (changed), wiring.rs (changed: one call site of client_start::start; the vault reference list), sources.list (changed), fixture.rs (changed: the fixture home, start-up files, the stub on PATH), hostile.json (read; R1's)
- src-tauri/src/vault.rs (changed: secret_names, a plain reader)
- src-tauri/src/lib.rs (changed: server_connect registered under cfg(unix))
- src-tauri/src/platform.rs (read: shell_from, lines 45-58; not changed)
- src-tauri/tests/saved_servers_keychain.rs (new, the integration test binary)
- src-tauri/Cargo.toml (changed only if the test binary needs a dev dependency; recorded in the lock file)

Dependencies. after = ["r1", "r2", "r3b", "d1"]. Story r5 depends on it. Story w3b and w5 are webview-side and use its command through the stubbed invoke (w3b) or the real command after this story (w6).

Contracts. Reads .ade/context/saved-servers.md and server-panes.md. Records nothing new unless the table's outcome differs from the design's (then the story stops and reports).

Out of scope. The hand-over judgement and the sampling (r5); the live state (r5); the webview messages (w5, w6); the Windows build (not registered); a stored password or any secret value (S2, not sharded); the architect's invocation for any shell other than zsh and bash (SV-2 AC10: refused).

Notes for the developer. The fixtures are the contract for R5: the same start-up-file rows feed the hand-over test. Never let a test read the developer's own start-up files: the fixture sets HOME, ZDOTDIR, and removes BASH_ENV and ENV.'''
verify = "The general verification command in force passes on the story's work, and the named tests (1) to (13) pass by name in cargo test under zsh and bash. Gate: the first step's record in the Verification section (SV-2 AC2's table under the CI image's bash 5.1 and zsh, Linux), then a green run of both backend CI jobs (Backend (cargo test) and Backend on macOS (cargo test)) on the final commit, attempt 1, cited by URL."
covers = ["SV-1 AC5", "SV-2 AC1", "SV-2 AC5", "SV-2 AC8", "SV-6 AC3", "SV-7 AC1", "SV-7 AC2", "SV-7 AC3", "SV-7 AC4"]
