[[entry]]
id = "w3b"
type = "story"
title = "Connect, the session object, the remote branch and Reconnect's store side"
description = '''F7 slice S1, story 12 of 16 (the second half of the design's W3, see the epic file, "Story cuts"). VERTICAL (webview store and hook): the connect request, the session object that keeps what arrives before and after the resolve, the new server tab, the remote branch that never calls create_pty, the end of a remote pane on a close, and Reconnect's store side. No component is built here (the marks, the menu and the messages are w6's); the server list's component is w5's. The Connect path needs the Rust command, which is r4's: this story's tests run against a stubbed invoke (serverInvoke.ts), as the design's section 17 allows for a webview story. Design sections 8.2 (Connect, steps 1 to 7), 8.3 (the remote fact to destroyInstance), 8.4 (the pre-send check, the held press, Reconnect), 8.5 (restore: the remote branch) and 17 (row W3). Needs W3a (the wrappers, the list store, serversAvailable), W2 (restore and Reopen states) and R3a (the event shape, events.json).

Build, test first:
1. src/lib/serverSessions.ts (new): requestConnect({ serverId, paneId?, shown, confirmed? }) as design 8.4 and 8.2 step 1 state it: sets the pane's in-flight mark at the press, synchronously (a Reconnect); asks serversAvailable; runs the pre-send check (a fresh servers_list, the row found by serverId, compared with shown; sends only when the row exists, has no problems, equals shown, and either equals the pane's destination or equals confirmed); otherwise sends nothing, clears the mark and answers { outcome: "held", check } with the ConnectCheck of 8.4, put in serverListStore.held. While the mark is set a second press makes no request and no list read.
2. The connect request: a Channel and a session object for this call; invoke server_connect with { args: { serverId, paneId, rows: 24, cols: 80 }, onEvent } and nothing else of the server. paneId is the ended pane's id for a Reconnect and a newly made pane id for a Connect.
3. The session object (events before the resolve): it keeps the state (connecting, or live, or ended with its end), the notice and the output chunks, and nothing else; no pane exists yet. Events after the resolve update the store on arrival, mounted or not: live sets state live and clears notice; notice sets it; exit writes today's "[Process exited]" line, sets state ended, end, and ptyId null. Only output goes to the terminal, never to the store.
4. Rejected: the kind is returned to the caller (the overlay or the palette shows the message); no store update happened, so no tab exists. For a Reconnect the pane stays ended and shows the kind (refusal).
5. Resolved, Connect: openServerTab makes, in one set, a new active tab named after the server (the name from the list the webview holds), serverNamed true, whose first pane has the id paneId, the returned ptyId, and remote with the state the session object holds. In the same step the xterm is created with no container, as createSubTerminalInstance does (useTerminal.ts:620-626), the buffered output is written to it, and its input is wired.
6. Resolved, Reconnect: one set gives the pane the new ptyId, destination, summary and the session's state, and clears end and refusal; a new xterm takes the saved scrollback's place; the blank line written to the xterm is a write to the display only (term.write), not writePty, not in ptyWriters.sites.json, and sends 0 bytes to the PTY. Resolved and the pane is gone or no longer that (closed while in flight): the same step sends server_terminal_end for the id, drops the session object and its output, and updates nothing.
7. The remote branch of useTerminal: when the pane mounts and pane.remote is set, it never calls create_pty; with an instance for the pane it seats it and sends one resize_pty; without one (restored, reopened) it shows the saved scrollback and starts nothing.
8. destroyInstance(paneId, storePtyId, remote) (useTerminal.ts:158-163): with remote true it sends server_terminal_end in place of kill_pty, not awaited. closePane and closeTab read "this pane is remote" from the pane's record before the store update that removes it, and pass it (w1 read it; this story passes it on).
9. Splits and sub-terminals of a server tab go through today's paths and are local: their panes have no remote, start in the home folder, and call create_pty (SV-3 AC5).

Acceptance (PRD SV-2, SV-3 and SV-4 items; each named test as the design gives it):
(1) SV-2 AC7, owner of the criterion (PRD SV-2 item 7, "Where it opens"): the tab count rises by one, the new tab is active, server-named, and its first pane is remote and connecting; each refusal named there (a record that fails its checks; an unsupported shell; a list that could not be read; a saved server that no longer exists; not in an engagement) leaves the tab count unchanged and the store with no new tab (TypeScript, store, with the stubbed invoke rejecting with each kind).
(2) SV-4 AC2, owner of the criterion (PRD SV-4 item 2, "Restored ended"): a restored remote pane is ended and has no process; the create_pty count for it is 0 after every mount, and 0 connect requests after every mount (TypeScript, store and hook).
(3) SV-4 AC3, partial (owner w6; PRD SV-4 item 3): the Reconnect-after-Reopen row: a reopened server tab's Reconnect runs one request for its pane and the pane is the one reopened; an edited Host between close and reopen makes no request until confirmed (the held press; the store test).
(4) SV-3 AC5, owner of the criterion (PRD SV-3 item 5, "Splits and sub-terminals"): a split of a server tab is a local pane: create_pty is called for it, it starts in the home folder, and it has no remote record.
(5) SV-2 AC3, partial (owner r5): a confirmed close of a remote pane and a close of its tab each make exactly one server_terminal_end request for that pane's PTY id, 0 kill_pty and 0 write_pty for it; a local pane's close still sends kill_pty; the pane is gone at the resolve (TypeScript, store).
(6) SV-2 AC5, partial (owner r4): Reconnect with a changed row (held) leaves the pane remote and ended, and Connect with the held result leaves the tab count unchanged (TypeScript, store, the stubbed invoke).
(7) The Reconnect store test: 0 write_pty calls across a Reconnect; one request per pane at a time (a second press with the mark set makes no request and no list read); a Reconnect whose pane was closed before the connect resolved sends exactly one server_terminal_end, for the id the connect returned, by closePane and by closeTab.
(8) SV-3 AC3, partial (owner w6; PRD SV-3 item 3, "Ending"): a process exit of a remote pane writes "[Process exited]", sets state ended with end and ptyId null, for the events before and after the resolve (events.json rows, through the session object: each row gives the state the row names).

Gate: the general verification command in force. No process is started by the webview; the processes are the Rust commands' (stubbed here). No CI gate.

Files (expected unless marked read):
- src/lib/serverSessions.ts (new)
- src/hooks/useTerminal.ts (changed: the remote branch, destroyInstance's remote argument, the xterm at resolve; lines 158-163, 620-626, 671)
- src/stores/tabStore.ts (changed: openServerTab, the Reconnect set, closePane and closeTab's remote fact)
- src/lib/detachWindow.ts and src/components/TerminalPane.tsx (read; not changed here)
- tests: src/lib/__tests__/serverSessions.test.ts (new), src/stores/__tests__/serverTabsOpen.test.ts (new), src/hooks/__tests__/useTerminal.remote.test.tsx (new), src/stores/__tests__/reconnect.test.ts (new); each expected names
- src/lib/serverFixtures/events.json (read; R3a's)

Dependencies. after = ["w3a", "w2", "r3a"]. Story r4 depends on this story (the webview half of Connect it calls); w5 and w6 depend on it.

Contracts. Reads .ade/context/server-panes.md (the session object and the remote branch). Records nothing new.

Out of scope. The Rust command (r4); the list's component, the Remove question and the palette entries (w5); the marks, the tab menu, the messages, the Reconnect control's look and the close question's component (w6); the server-restored pane's scrollback display's visual (w6).

Notes for the developer. Read design 8.2 and 8.4 before writing; the order of the session object's events and the command's answer is not fixed (review A-m10), so a test must run both orders.'''
verify = "The general verification command in force passes on the story's work, and the named tests (1) to (8) pass by name in npm test, both orders of events and resolve tested. No CI gate: the process starts are the Rust commands', stubbed here."
covers = ["SV-2 AC7", "SV-3 AC5", "SV-4 AC2"]
after = ["w3a", "w2", "r3a"]
