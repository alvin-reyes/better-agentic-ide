[[entry]]
id = "r5"
type = "story"
title = "The hand-over check: the pane goes live only when ssh is seen"
description = '''F7 slice S1, story 16 of 16 (the last). VERTICAL in Rust: ADE watches the pane's own process and makes the pane live only when an image of it is ssh with exactly the grammar, and reports the other outcomes. It starts processes (the fixtures, the stub, the shells), so the F7 CI gate applies: the local lines plus a green run of both backend CI jobs on the final commit, zsh on Linux (d1). FIRST STEP (design section 17, R5): one test that prints every reading of the pane's own process for the first 2 s of each fixture start, run on the Linux backend job; record the forms seen (the shell, the stub, each script wrapper), the early readings, and any reading that is neither a whole list, empty, nor ADE's own. If the observation rule does not hold there (a partial list; a form section 3.3 does not place), the story stops and the finding goes to the owner, as PRD SV-2 AC9 says a form the rule does not list comes back as a question. Design sections 3.1 (how the pane's own process is observed, sysinfo and the image of the process), 3.2 (what a sample can be that is not an image of the shell's making), 3.3 (judge, the table and the rows the design places), 3.4 (the monitor's one state machine, step), 3.5 (a $SHELL that is itself a script), 3.6 (the pane's events and the exit status), 3.7 (the tests), and 17 (row R5). ADR 0046 (the hand-over is judged once, from the pane's own argument list). Needs R4 (the client start, the instruction, the grammar).

Build, test first:
1. observe (3.1, 3.2): the sample of the pane's own process: the list of its words as the kernel gives it, read through the process table (sysinfo, as the design states), with the four readings of 3.2 (unreadable; empty; equal to Better Terminal's own; anything else). A reading that is unreadable, empty, or still Better Terminal's own is not an observation: nothing is judged and the pane stays connecting. The test: observe over the four rows, and one that the test's own process's image is not empty.
2. judge(started, observed, grammar) -> Judged { StillShell, SshClient, Other } (3.3, pure, byte-wise word equality): equal to started gives StillShell; [P, G] with base(P) == "ssh" gives SshClient; [I, P, G] with I one of sh, bash, zsh, dash, ksh gives SshClient; [E, I, P, G] with base(E) == "env" gives SshClient; anything else is Other. G must equal the grammar exactly, nothing before, between or after. The rows the design places: [/bin/sh, -e, /x/ssh, G] gives Other; [bash, -l, /x/ssh, G] gives Other; a shell wrapper script as the pane's process gives Other; [ssh, G] whose executable is /bin/echo (a hash entry) gives SshClient (the argument list decides, PRD SV-2 AC2's stated case). The type gives no way to call judge for NotObserved.
3. step (3.4): the one pure state machine of the monitor, over every row of 3.4 (the watching rows, the sampling, live, notice, and the exit rows; the unwatched rows, EndedByUser and GaveUp are r3a's): the notice-then-live sequence; judged once (ADR 0046); nothing after an exit. live is sent once the SshClient image is judged; the notice kinds are not-handed-over-yet (the bound passes and the process is still the shell) and not-handed-over-another-program (the judged image is not the SSH client, at once).
4. The sampling and the monitor thread (3.1, 3.4): the sampler reads the pane's own process at the design's rate; the notice of the bound (2 s, SV-2 AC9's bound) and ADE keeps watching; the pane's events (3.6): live, notice (both kinds), exit with its status (0, 255, null) and kind (no-ssh-client for status 127, ended-before-ssh with its status when the process ended before ssh was seen to start, with the status absent when a signal ended it), each serialised as events.json (r3a's fixture).
5. The kinds this story adds a way to reach (design 7): no-ssh-client (status 127), ended-before-ssh (status, or absent), not-handed-over-another-program, not-handed-over-yet. Each reaches the webview as the event's kind; the log test (item 11) reads them.
6. The wrapper cases (3.5): a $SHELL that is itself a script gives "another program" at once while the session works; the design's shell-wrapper fixture: the notice at once and the stub alive at twice the bound.

Acceptance (PRD SV-2 items 2, 3, 4, 9 and SV-8 items 1 and 2; each named test as the design gives it):
(1) SV-2 AC9, owner of the criterion (PRD SV-2 item 9, "The hand-over is confirmed before the pane is live"): observe's table, then judge's table (item 2) and the rows of 3.3; step over every row of 3.4; SV-2 AC9's eleven fixture cases with the 2 s bound, under zsh and under bash (both always; a missing shell fails the test); the shell-wrapper fixture: "another program" at once, the stub alive at twice the bound; the messages' rendering is w6's (partial).
(2) SV-2 AC2, owner of the criterion, live half (PRD SV-2 item 2): the fixture table of R4's item (2) with the live clauses: a pane is reported live only after the stub was observed; never live for the two quoted-alias rows; the other rows as the table states.
(3) SV-2 AC3, owner of the criterion (PRD SV-2 item 3): the matrix through a real client start: live; connecting as a child; connecting replaced by a fixture program; each ignoring the hangup; ended by server_terminal_end, by kill_pty, by main_closed and by app_exiting: the same outcomes as r3a's and r3b's rows (0 bytes; none alive at 5 s; the ones that ignore the hangup included); the TypeScript write count (w3b's and w4's tests) stays green.
(4) SV-2 AC4, owner of the criterion (PRD SV-2 item 4, "No fall-through to a local shell"): the stub exits 0 and 255 after live; the pane reports an exit with the stub's status; nothing of the pane is alive afterwards; the output after the stub's last byte is empty; the stub's last bytes (a marker) arrive whole before the exit (review A2-m7); a background holder: the exit after 1 s and before the 5 s stop, and no output follows the exit.
(5) SV-8 AC1, owner of the criterion (PRD SV-8 item 1, "macOS and Linux"): the hand-over and the client start are tested on macOS and on Linux under zsh and bash, by SV-2 AC2, AC9 and SV-7 AC4's tests (no find_command in the Rust text; the ssh the user's shell finds is the one started).
(6) SV-8 AC2, owner of the criterion (PRD SV-8 item 2, "None installed"): with no ssh on PATH, under both shells: the shell exits 127, the exit carries no-ssh-client, Connect and Reconnect are not refused beforehand; the message "Possibly no SSH client" is w6's; the test asserts the kind and status.
(7) SV-5 AC4, owner of the criterion (PRD SV-5 item 4): the log test for the four kinds this story adds (no SSH client; ended before ssh; the two notices), with the log helper of r2; no marker in ade.log. The kinds' fixed list stays twelve.
(8) The exit event rows: each event in events.json serialises equal to its row (the Rust side; r3a's file; the TypeScript side is w3b's).
(9) The shell-wrapper and the forking-form fixtures pass their assertions (the fixture asserts the forking form, 1.7).
(10) The first step's test (FIRST STEP above) is kept as a permanent test that prints nothing and asserts the four readings: it fails when a reading is neither a whole list, empty nor ADE's own, on any platform the test runs on.

Gate and verification. The general verification command in force passes on the story's work. Plus the F7 gate: a green run of both backend CI jobs, Backend (cargo test) on ubuntu-22.04 and Backend on macOS (cargo test), on the final commit, attempt 1 each, cited by URL per F1's gate item 4 applied to these two jobs. The first step's Linux record (the forms seen; the early readings; any finding) and its run's URL are in the Verification section. If the observation rule does not hold on Linux, this story stops and is not built further.

