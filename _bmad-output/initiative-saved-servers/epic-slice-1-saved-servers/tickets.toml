title = "Marks, the bar, Reconnect, the connection messages and the tab menu"
description = '''F7 slice S1, story 15 of 16. VERTICAL (components): what the engineer sees and does with a server pane and a server tab: the marks (tab bar, tab switcher, pane), the bar with its states, "ssh not confirmed", the hand-over message and End, Reconnect and its control with the held press, the restored and reopened bars, the tab menu without Duplicate and Move to New Window, the close question for a running connection, the rename boxes' rules as rendered, and the tab set's left-out count. The UX is approved (draft 4, 2026-11-19; docs/superpowers/specs/2026-11-18-saved-servers-ux.md) and its mockup beside it. Design sections 8.4 (Reconnect's control reads the list; the held press), 8.6 (the menu and tab sets), 8.7 (the close question), 17 (row W6). UX sections 5.1 to 5.7 (the mark, its places, the bar, the connecting, live and ended states, a split), 6.1 to 6.7 (the close question, quitting and closing, restore and Reopen, the menu, a closed remote pane, rename, saved workspaces), 7 (what is off in a server pane; its words), 8 (every refusal and its words: the twelve kinds with each cause and each optional member's absent form), 9 (the text rules: 9.1 a destination never loses its end, 9.2 plain strings, 9.3 a comparison shows both sides whole) and 10 (keyboard) are read before building.

Stories cut to the UX's defaults (UX section 17): the tab switcher's search matches a server tab by name only (P3); "ssh ended (exit status N)" shows the status (P6); the "another program" message is the one of UX 5.4 as the PRD's revision 10 sentence now reads (P9); the "no SSH client" title is "Possibly no SSH client" (P10); a many-tab close counts server tabs in its one question (A12); the bar and the header's second row re-fit the terminal when their height changes (A10, the default; if it differs, the largest change in the list); the page reads differsFromPane from the session (A15). A UX default that differs changes only the places UX section 17 names for W6.

Build, test first:
1. The mark (UX 5.1, 5.2): a server tab's mark on the tab bar and in the tab switcher (the tab switcher's search matches by name only, P3); the pane's mark for the server pane only (no mark on the other panes of a split server tab, the owner's decision of 2026-11-19, SV-3 AC5); three states (connecting "ssh not confirmed", live, ended), never "connected"; absent on a local tab; accessible names carry the state.
2. The bar (UX 5.3): the server pane's bar with its buttons; it re-fits no terminal in its default (A10).
3. Connecting, live, ended (UX 5.4 to 5.6): the "ssh not confirmed" state; cleared when live (live: "ssh running"); the ended state keeps the output, prints today's "[Process exited]" line, and offers Reconnect with the destination (or Reconnect with the held or changed-destination form when the check holds the press, UX 4.9 and 9.3); the failed-checks message with each field and reason; End only with a hand-over message (SV-2 AC9).
4. The hand-over message (UX 5.4; PRD SV-2 AC9 as revision 10 states it): the two kinds "another program is running" and "not handed over yet"; the message states as fact only what Better Terminal observed and gives the rest as possibilities (P9); End is its button; the "ended before ssh was seen to start" kind with and without its status (P6: the status shows when there is one).
5. The kind messages (UX 8): every refusal of the twelve kinds with its words, each optional member's absent form ("could not be saved" with no error number, "could not start a terminal" with none), and terminal-not-started's three causes: start (may carry the error number), closing ("Better Terminal is closing or its page is reloading") and pane ("that pane already has a connection or a start in progress"). A message that names a server is composed in the webview from the identifier sent and the list it holds; no kind carries a name.
6. Reconnect (UX 5.6, 8.4): the control on an ended server pane reads the current list (the store's check before the press is w3b's); the changed-destination form (both destinations whole, the differing members named, a second confirmation); the held press; the "the saved server no longer exists" and failed-checks forms.
7. The restored and reopened bars (UX 6.3): the bar comes from origin (restored, reopened); SV-4 AC2 and AC3 say the tab is ended with Reconnect and nothing connects by itself.
8. The tab's menu (UX 6.4; SV-2 AC6, SV-3 AC8): a server tab's menu has no Duplicate and no Move to New Window; a local tab's menu is unchanged.
9. The close question (UX 6.1; SV-3 AC6): for a running connection (connecting or live) closing a remote pane or a tab asks, built on C1's ConfirmDialog; an ended pane does not ask; the many-tab close's one question counts server tabs (A12); Enter straight after the question opens cancels (C1's rule, pinned here by the close test).
10. Quitting and closing the main window (UX 6.2): the copy for the ending (what happens to a live connection on a window close or a quit); no question for a quit or window close (F7 leaves them asking nothing for any terminal, PRD SV-2 AC3).
11. A closed remote pane (UX 6.5): the tab becomes a local tab named "Terminal" with no mark; a renamed tab keeps its typed name (SV-3 AC9). Rename (UX 6.6; SV-3 AC1): the rename boxes commit unchanged text as no change and a changed name removes the mark (the store rule is w1's; the rendering is here).
12. The saved workspaces' left-out count (UX 6.7; SV-5 AC3): "N server tabs were left out" from tabSetEntries's leftOut.
13. What is off in a server pane (UX 7; SV-6 AC1, AC2, AC4): the words of the on-a-server state of the file browser, the file-path links that are not links (no words needed), the refused write's message (the scratchpad's image case: nothing sent, the text kept, a reason shown). W4 built the logic; this story gives the words and the component tests.
14. The "Show this pane's message" and "Reconnect this pane" palette entries' effect: they focus the bar (or the question's Cancel) and start nothing (the palette's entries are w5's).

Acceptance (PRD SV-2, SV-3, SV-4, SV-5, SV-6 items; each named as the design gives it):
(1) SV-3 AC1, owner of the criterion (PRD SV-3 item 1, "Name, and what a rename is"): the name Connect gives, a rename box that commits unchanged text as no change keeps the mark, a changed name removes it (component and store test).
(2) SV-3 AC2, owner of the criterion (PRD SV-3 item 2, "The remote mark"): the mark on the tab bar, the switcher (matched by name only, P3) and the server pane with its three states and accessible names; absent on a local tab; no mark on the other panes of a split (the owner's 2026-11-19 decision).
