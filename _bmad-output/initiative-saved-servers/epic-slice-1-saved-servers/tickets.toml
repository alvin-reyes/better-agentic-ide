title = "Server commands, kinds, availability and the list store"
description = '''F7 slice S1, story 11 of 16 (the first half of the design's W3, cut at sharding, see the epic file, "Story cuts"). VERTICAL-LEANING (webview leaves and the list store, no component): the typed wrappers of the five commands, the kinds mirror, the availability function, the list store, the fixed text for a rejection that is not a kind, and the rejection's logging rule. No process is started. Design sections 7 (the log; the rejection rules), 9 (the list store contract), 10 (the fixtures table: kinds.json, commands.json), 11 (serversAvailable) and 17 (row W3, the cut "W3a"). Needs W1 (serverTabs.ts) and R1 (kinds.json, commands.json).

Build, test first:
1. src/lib/serverKinds.ts (new): the twelve kind ids as a union type, and a parser for a Kind; its mirror test reads src/lib/serverFixtures/kinds.json (R1's) and fails when an id in the file and not in the union, or the reverse, exists; each row parses as the union.
2. src/lib/serverInvoke.ts (new): five wrappers (servers_list, servers_save, servers_remove, server_connect, server_terminal_end), each taking its serde struct from commands.json's shape (the arguments as the webview sends them). Each wrapper catches a rejection, and a rejection that is not an object whose kind is one of the twelve ids is replaced by the fixed Error("server command failed") (SERVER_COMMAND_FAILED); callers show their generic failure text for it. A kind is passed through as it arrived (the whole object with its payload, the refusal form of 8.1).
3. src/lib/crashReport.ts (new): rejectionMessage(reason): string, extracted from src/main.tsx (the inline arrow at main.tsx:15-17 that logs String(reason)); main.tsx calls it. Its behaviour for an Error and for a string is pinned by a test first, unchanged.
4. src/lib/serverAvailability.ts (new): serversAvailable(f: { platform: "macos" | "linux" | "windows"; engagement: boolean }): boolean, the table of design 11. In S1 the engagement input is the constant false, supplied from one place (a function in the webview, matching instance_is_engagement() in Rust, r2).
5. src/stores/serverListStore.ts (new, zustand, not persisted): { status: "idle" | "ok" | "unreadable", servers: ServerRow[], held: Record<string, ConnectCheck> }, with load(), reloaded on servers-changed, when the overlay or the palette opens, and on every Connect or Reconnect press before the request (the press's load is w3b's call). The ServerRow type is design 9's (id, fileIndex, name, host?, port?, user?, identityFile?, summary, problems?). ConnectCheck is the type design 8.4 declares; read 8.4 before writing it.
6. The list store's rows: a row with problems lacks the members that failed; rows with a withheld name are ordered last by fileIndex (the store keeps the order servers_list gives; it sorts nothing itself).
7. The "could not be read" text names the constant file name saved-servers.json (SERVER_LIST_FILE_NAME) in Better Terminal's data folder; no command gives the folder's path.

Acceptance (each named test as the design gives it):
(1) SV-5 AC4, partial (owner r5; PRD SV-5 item 4, "Logs, and the fixed list of kinds"): the TypeScript log test: unhandled rejections through rejectionMessage, for each rejection of server_connect from the fixture (kinds.json), hold no marker; a rejection that is not a kind leaves serverInvoke.ts as the fixed text, and rejectionMessage of that text holds no marker; the message holds the server's name, the kind does not (the name is composed in the webview). W5 adds the rows for the three list commands.
(2) The fixed-text rule: each of the five wrappers, against a stubbed invoke that rejects with a string holding a marker, with an Error holding one, and with an object of an unknown kind, rejects with exactly SERVER_COMMAND_FAILED's text; rejectionMessage of it holds no marker.
(3) SV-8 AC3, partial (owner w5; PRD SV-8 item 3): serversAvailable for macOS and Linux with engagement false is true; with engagement true it is false; for Windows it is false; the one-function rule with its input set: with the engagement input true the function answers no (the merges-second input of r2's item (9) on the webview side).
(4) The kinds mirror: the union and kinds.json agree (item 1).
(5) The list store: status "unreadable" when servers_list rejects with list-unreadable; "ok" with the rows in the order given; a row with problems keeps its fileIndex and lacks the failing members; a withheld name's row is last. Changes on servers-changed: a load on the event (store test with a stubbed event).
(6) rejectionMessage: its behaviour for an Error and for a string is unchanged (pinned first, then main.tsx calls it; the existing main.tsx behaviour is the test's baseline).

CONDITIONAL MIRROR, F7 SV-5 AC8 (engagements; PRD F7.11, "Merges second", written at the S1 sharding 2026-11-19). serversAvailable (item 4) is the one function that decides whether the feature is available, on the webview side; the palette, the overlay's opener and requestConnect all ask it. If F1 ticket e29 (_bmad-output/initiative-personas-and-engagements/epic-profile-and-rule, ticket e29) is on main when this story is reviewed, or lands before it merges, this story connects the engagement input to F1's real signal, so that the answer is no by F1 slice 1's gate, and carries SV-5 AC8's webview half: with the engagement input set, the palette has none of F7's entries and requestConnect is refused with the not-in-engagement kind with 0 starts. Until then the constant false stays and item (3)'s "with the engagement input true" test is the criterion's test. Gate: this story's verification command; F1's side is F1 D28. Item (7) carries it by name if its condition held at review.
(7) CONDITIONAL, SV-5 AC8 webview half (see the mirror above): by name, "a palette with an engagement input set has none of the saved-server entries" and "requestConnect in an engagement is refused not-in-engagement with 0 starts", only if e29 was on main at review or landed before this story merged; otherwise not in this story's gate.

