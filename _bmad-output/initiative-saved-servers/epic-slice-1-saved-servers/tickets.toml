(4) SV-5 AC5, owner of the criterion (PRD SV-5 item 5, "Not in the folder-keyed stores"): recent projects, the agent tracker and the orchestrator's keys are byte-identical across a Connect and its end. NOTE for the developer: the Connect path of the webview (w3b) is not built when this story runs; the test drives a hand-built remote pane in the state a Connect leaves (the design's own note that the store can be exercised with a hand-built tab), and the same assertion is re-run through the real Connect in w6's test suite. Owner: this story.
(5) SV-3 AC6, partial (owner w6; PRD SV-3 item 6): the useGuardedClose three cases: a connecting remote pane asks; a live remote pane asks; an ended remote pane does not ask; paneBusy is not called for a remote pane. A local pane is unchanged.

