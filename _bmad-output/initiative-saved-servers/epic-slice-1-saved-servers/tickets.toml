Dependencies. after = ["r4", "w6"]: R4 (the client start) and W6 (the messages it renders; the hand-over message's rendering is W6's, so the story builds the notice kinds in Rust and the message in the webview). Story R5 is the last in the build order.

Contracts. Reads .ade/context/server-panes.md and ADR 0046. Records nothing new unless a finding changes the observation rule (then the story stops).

Out of scope. The messages' words and the End button (w6); the monitor's removal and the unwatched rows (r3a); the client start (r4); a $SHELL that is not zsh or bash (SV-2 AC10: refused before any start); any F4 or S1b behaviour; Windows (not built, SV-8 AC3).

Notes for the developer. Read design 3.1 and 3.2 before writing observe: a sample can be a partial list, the empty list, or ADE's own image, and none of those is an observation (PRD SV-2 AC9, the revision 8 rule). The stated limits (F7.9) are stated in the messages, not hidden in the code.'''
