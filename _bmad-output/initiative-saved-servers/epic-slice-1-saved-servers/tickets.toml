[[entry]]
id = "w5"
type = "story"
title = "The server list overlay, its form, Remove's question and the palette entries"
description = '''F7 slice S1, story 14 of 16. VERTICAL (components): the list overlay, its form with one message per failing field from its reason code, the rows that fail their checks, Remove's question on C1's dialog, the held press on Connect, the palette entries, and the list's empty, unreadable and full states. The UX is approved (draft 4, 2026-11-19; docs/superpowers/specs/2026-11-18-saved-servers-ux.md) and the mockup beside it (docs/superpowers/specs/2026-11-18-saved-servers-mockup.html) is the visual reference, verified in a mockup only. Design sections 9 (the list's contract, the palette), 10 (the commands), 17 (row W5). UX sections 3 (the palette), 4.1 to 4.10 (the list and its form, the failed row, the messages of a Connect that starts nothing, Remove, the held Connect, keyboard and focus), 10 (keyboard, the one-key rule 10.1) and 11 (accessibility) are read before building, and the defaults in UX section 17's table "If an answer differs from the default" are the ones built (see the list below).

Stories cut to the UX's defaults (UX section 17): palette entries in the SSH category for the server rows and the open-list entry, and in the Panes category for the three pane actions (P8, the PRD's revision 10 text); the list has its filter (P5); only Name and Port are trimmed (P4); one style declaration on the palette label (P11, overflowWrap anywhere, a stated exception); the "no SSH client" title hedged in W6 (P10). What would change if an answer differs: P5 (the filter, its Down rule and empty state) would be cut here; P8 (the three pane entries) would be refused here and the palette would lose them; P11 (the label's declaration) would be left out; A13 (one list read serves the palette's check and the overlay: built here, with W3a and W3b) would add a second read and the dropped-press rule of UX 4.9.

Build, test first:
1. The overlay (UX 4.1): the list in name order with each row's summary, the filter field (P5), every action by keyboard (SV-9 AC1), the Add action, the Edit and Remove actions on a row. Opened by the window event toggle-servers (as Integrations' toggle-integrations, CommandPalette.tsx:175), reloading the list (serverListStore.load) on open.
2. The form (UX 4.5): five fields, Name and Port trimmed, Host, User and Identity file checked as typed (SV-1 AC1); a save that the rules refuse shows a message for each failing field from its reason code and the form's own boxes keep what was typed; no typed value appears in a message (the messages are fixed text per reason, the designer's; SV-1 AC1, SV-5 AC4); a saved row may come with an identity-file warning from servers_save, shown after the save (SV-1 AC5, the warning only).
3. The rows that fail their checks (UX 4.6): the fixed text for a withheld name, the empty destination, the problems listed; the Edit form gets nothing for a failing field but its reason code; fileIndex tells two such rows apart; rows with a withheld name are last.
4. The list's states (UX 4.2, 4.3, 4.4): empty list says what the feature does and offers Add (SV-9 AC3); unreadable says the file's constant name in Better Terminal's data folder (SERVER_LIST_FILE_NAME), Add, Edit, Remove, Connect and Reconnect refused (SV-1 AC4); full refuses Add with a message (SV-1 AC4: 201st add).
5. Remove (UX 4.8, SV-1 AC3): one confirmation naming the server, through C1's ConfirmDialog rendered as a child of the overlay's dialog element; no remove request until confirmed; Esc closes the question only and the list stays open; Enter while focus is on Cancel sends no remove request.
6. The held press on Connect from the overlay (UX 4.9): requestConnect's held result shows the earlier and the current destination (both whole, UX 9.3, the controls name which of host, port, user and identity file differ) and a second, separate confirmation; a cancel removes the held entry.
7. The palette (UX 3; design 9): after every entry the palette has today, the entries in this order: Servers: Open saved servers (SSH, always first of F7's, whenever the feature is available); one per saved server, Connect to DESTINATION, saved as "NAME" (SSH, in the list's order, with the row's name and summary; a row with problems keeps its entry and gets the fixed text for a withheld name, and running it gives the failed-checks message); Servers: Show this pane's message (Panes; only while the active pane has a bar); Servers: Reconnect this pane (Panes; only while the active pane is an ended server pane whose bar offers Reconnect); Servers: End what is running in this pane (Panes; only while a hand-over message shows; always last). No query naming the feature preselects an entry that starts or ends a connection (UX 3). The label's overflowWrap: anywhere on the label's span only (P11). With availability false, or the list unreadable, there are no per-server entries (SV-8 AC3; SV-9 AC2).
8. The palette's entry press for a server: requestConnect({ serverId, shown: row }) with the row the label was built from (design 9); the press of a held check opens the overlay on that row.
9. SV-5 AC4's TypeScript log test for the three list commands (servers_list, servers_save, servers_remove): each rejection from the stubbed invoke, rendered through rejectionMessage and the form's messages, holds no marker (the W3a wrappers' fixed text for an unknown rejection).
10. Keyboard and focus (UX 4.10, 10, 10.1): one key pressed twice, or held, does not run an action twice (the list's activation key then the question lands on Cancel); the overlay is a dialog (role, label) with focus returned to its opener on close.

Acceptance (PRD SV-1, SV-5, SV-8 and SV-9 items; each named test as the design gives it):
(1) SV-1 AC1, owner of the criterion (PRD SV-1 item 1, "The closed list of reasons"): the form shows one message per listed field, each from its reason code, and the message text holds no marker (component test; the Rust table is r1's).
(2) SV-1 AC3, owner of the criterion (PRD SV-1 item 3, "Add, edit, remove", with the component half on Remove and "Enter in that question"): Remove shows one confirmation naming the server, sends no remove request until it is confirmed, Esc closes the question only and the list stays open, and Enter while focus is on Cancel sends no remove request; a refused save with five markers shows a message for each of the five fields and no marker.
(3) SV-8 AC3, owner of the criterion (PRD SV-8 item 3, "the palette"): serversAvailable false (Windows, or an engagement input) shows no palette entries of F7 and no overlay opener; with the input set the palette has none of F7's entries.
