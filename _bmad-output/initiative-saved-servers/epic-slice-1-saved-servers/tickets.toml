Out of scope. The session object, the connect request and the remote branch (w3b); the list's component and the palette entries (w5); the Remove question (w5); the rows' messages (w5).

Notes for the developer. serverInvoke.ts is the only place a server command's rejection is turned into a value the UI shows; a caller never sees a raw rejection from these commands.'''
