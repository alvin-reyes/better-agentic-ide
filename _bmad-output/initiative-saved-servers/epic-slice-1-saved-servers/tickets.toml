[[entry]]
id = "r3b"
type = "story"
title = "End all, the start gate and the app's three handlers"
description = '''F7 slice S1, story 9 of 16. INFRASTRUCTURE (Rust): the teardown that ends every remote terminal when the main window closes, when its page is replaced, and when ADE exits, and the gate that keeps a start from landing after that. It starts processes in its tests (the fixture terminals and sh), so the F7 CI gate applies: the local lines plus a green run of both backend CI jobs on the final commit, with zsh on the Linux job (story d1). Design section 1.5 (who calls it; the gate; the table of paths; end_all; the four ways out of the table), 1.7 (the rows assigned here), 2.5 step 7 (the insert, as the gate reads it) and 17 (row R3b). Needs R3a (the routine, the reader, the monitor, the waiter).

Build, test first:
1. ending::Gate (beside the table, read and written only under the table lock): closed (the main window was destroyed, or ADE is exiting), page (a count of the main webview's page loads), starting (client starts between admission and insert, subtracted on every way out of a start by a guard, a failed spawn included). Its condition variable is used with the table's mutex and notified when a remote terminal leaves the table or starting drops.
2. end_all(table, gate, wait) -> the teardown routine: calls ending::start for every remote terminal not already ending (each on its own thread); with Wait::Yes it blocks until no remote terminal is left in the table and no client start is in progress, or 5 s have passed, whichever is first; Wait::No returns at once. wait_gone(id, limit) is the same wait for one id.
3. main_closed (sets gate.closed, calls end_all(.., Wait::No)), main_page_loaded (adds 1 to gate.page, calls end_all(.., Wait::No)) and app_exiting (sets gate.closed, calls end_all(.., Wait::Yes)).
4. The three handlers in lib.rs: tauri::Builder::on_window_event for WindowEvent::Destroyed of the window labelled main (main_closed); tauri::Builder::on_page_load for PageLoadEvent::Started of the webview labelled main (main_page_loaded); App::run's callback for RunEvent::Exit (app_exiting). This needs the change from .run(...) to .build(...) followed by .run(...) with the callback, as design 1.5 states. The gate is managed state.
5. ending::admit(pane) -> Admission (under the table lock: refuses with closing when gate.closed, with pane when another remote terminal for the pane is in the table or admitted and not ending; grants otherwise and counts gate.starting up by one) and ending::insert(admission, instance) (under the same lock: refuses with closing when gate.closed or the page count moved since admit, refuses with pane when the pane has got another terminal; on success puts the instance in the table and subtracts starting). Every path that drops an admission without an insert (a failed spawn; a monitor thread that could not start) subtracts starting through a guard. The refusals return the cause of terminal-not-started (design 7: closing and pane; no errno). The command that calls them is r4's.
6. The teardown wiring test (static, wiring.rs): the three end_all call sites are exactly main_closed, main_page_loaded and app_exiting, each called from its named handler in lib.rs; a build that lacks any of the three calls fails (SV-2 AC3's static test, the list of three call sites of design 1.5 and PRD revision 9).
7. The manual check of design 1.6 is written into this story's notes and is not part of the gate.

Acceptance (the design's test rows assigned to this story in 1.7, each named as there):
(1) SV-2 AC3, partial (owner r5): the two one-terminal tests, end_all(No) then at once end_all(Yes): (a) the child case: ONE remote terminal with its monitor and waiter running, the stub a hangup-ignoring child of the forking sh that obeys the hangup; the first call returns with the terminal still in the table and before the 2 s deadline, and the second returns after it has left, no sooner than the requirement; the stub's record holds 0 bytes; (b) the leader case: ONE remote terminal, a hangup-ignoring stub as the pane's own process; the same assertions, bar the "leader no longer alive" clause. (Rust, Unix, real PTY, sh.)
(2) SV-2 AC3, partial (owner r5): end_all(Yes) with an empty table, and with a start counted in gate.starting that inserts 300 ms later: returns before the 2 s deadline; returns only after the late instance has left.
(3) The gate's two functions on fixture terminals: ending::admit(pane) then ending::insert(admission, instance), with main_closed, and again with main_page_loaded called between the two: insert returns the closing refusal; the instance is in the table already marked ending and is ended by the teardown.
(4) gate.starting on every way out: an admission dropped without an insert (a failed spawn; a monitor thread that could not start): starting is back to its value before, and a waiting end_all(Yes) is woken and returns.
(5) main_page_loaded with two live remote terminals and one local terminal: both remote terminals are ended; the local terminal is untouched and still in the table.
(6) The per-pane rule on fixture terminals: admit for a pane whose remote terminal is not ending; two admissions for one pane, both granted before either insert, so the second insert is refused pane; admit for the same pane called from the handler of a naturally exited terminal's exit event (granted, so a pane may reconnect after its process ended by itself).
(7) The wiring test of item 6 (static): the three end_all call sites and their three callers.
(8) The handlers are wired in lib.rs: the on_window_event, on_page_load and RunEvent::Exit calls exist (the static test of item 6 reads them).
(9) The shared gate tests through the command (the late start, the closed gate) are r4's; this story does not register a command.

Gate and verification. The general verification command in force passes on the story's work. Plus the F7 gate: a green run of the CI workflow's two backend jobs, "Backend (cargo test)" (Linux) and "Backend on macOS (cargo test)", on the story's final commit, attempt 1 each, cited by URL per F1's gate item 4 applied to these two jobs. No first-step finding is required here (the Linux first step is R3a's); if R3a's first step stopped on a finding, this story does not start.

Files (expected unless marked read):
- src-tauri/src/saved_servers/ending.rs (changed: Gate, end_all, wait_gone, admit, insert, main_closed, main_page_loaded, app_exiting, the guard)
- src-tauri/src/lib.rs (changed: the gate's managed state, the builder's on_window_event and on_page_load, the run callback)
- src-tauri/src/saved_servers/wiring.rs (changed: the teardown wiring test, the handler test)
- src-tauri/src/saved_servers/fixture.rs (changed: fixture terminals for the gate tests)
- sources.list (changed when a file is added)

Dependencies. after = ["r3a"]. Story r6 and w3a are built in the design's order after this story only in sequence, not at the code level. Story r4 depends on this story (the insert and the admit it calls).

Out of scope. server_terminal_end and the command's registration (r3a); the client start (r4); the webview's close paths (w3b); the hand-over (r5); the export (r6); the quit's behaviour for the window (F7 leaves a close and a quit asking nothing for any terminal, as the PRD says; only the ending is added).

Notes for the developer. The gate's tests are timing-sensitive; they use the lower bounds and the routine's own deadlines only (design 1.7). A quit or a window close waits for the ending up to its 2 s when a process is alive (SV-2 AC3): Wait::Yes in app_exiting is that wait.'''
