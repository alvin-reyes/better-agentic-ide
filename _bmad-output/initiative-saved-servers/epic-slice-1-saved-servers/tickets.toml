[[entry]]
id = "w1"
type = "story"
title = "Records, the server-tab fields and the pure store rules"
description = '''F7 slice S1, story 4 of 16. Infrastructure-leaning (webview store, pure): the types of a remote pane and of a server tab, the pure helpers every webview story calls, the rename rule and the single update of closePane. It starts no process and sends nothing. Design section 8.1 (records), 8.3 (rename, close of the remote pane), 8.6 (the detach refusal and tabSetEntries), 8.9 (the outward name, the table), 17 (row W1). Contracts: .ade/context/server-panes.md (the record and the helpers), .ade/context/saved-servers.md.

Build, test first:
1. src/stores/tabStore.ts: Pane gets remote?: RemoteRecord and Tab gets serverNamed?: true, with RemoteRecord exactly as design 8.1 states it (serverId, destination, summary, state, and the never-saved notice, end, refusal and origin). A pane is remote from creation and never becomes local; a local pane never becomes remote.
2. src/lib/serverTabs.ts (new, pure): paneKind(pane) gives local, connecting, live or ended; remotePane(tab) the tab's remote pane or null; isServerTab(tab) is tab.serverNamed === true || remotePane(tab) !== null; sameDestination(a, b) (design 8.4: host, port, user and identityFile compared as stored, and the summary not compared); outwardName is in step 4.
3. renameTab(id, name): when name equals tab.name the state is returned unchanged (the same object, so no subscriber fires and no save is scheduled); otherwise it sets the name and removes serverNamed. The rule is in the store, so every route has it (SV-3 AC1's store half).
4. src/lib/outwardName.ts (new, pure) and src/lib/outwardName.cases.json (new, the table of design 8.9, seven rows). The TypeScript test reads the table. Rust reads the same file in story r6; the file is created here and is not changed by r6.
5. closePane: when the removed pane is remote, the same set that removes it also removes serverNamed and, only if the mark was set, renames the tab "Terminal" (the name addTab gives). A renamed tab keeps its typed name. closePane reads pane.remote !== undefined from the pane it found before its set (next to where it reads ptyId today, tabStore.ts:522), and passes that fact; in this story the fact is read and not yet used by destroyInstance (story w3b passes it on). One store update only: a subscriber never sees the pane gone with the mark or the server's name still on the tab.
6. detachTabToWindow (src/lib/detachWindow.ts:19): returns before anything else when isServerTab(tab): no window, no detachTab, the PTY untouched.
7. tabSetEntries(tabs) -> { entries, leftOut } (pure, in src/lib/tabSets.ts or next to saveCurrentWorkspace's helper, expected name): it drops server tabs and counts them. SettingsPanel.tsx:195-205 calls it (the call is changed in this story; the component is not otherwise changed).

Acceptance (the PRD's criteria, by item, in .../docs/prd.md F7 section SV-3 and SV-5; each test is named as the design names it):
(1) SV-3 AC7 (owner of the criterion: this story; PRD SV-3 item 7, "When the saved server is renamed or removed while a tab is open"): rename and remove of the server leave the tab's name and mark unchanged (TypeScript, store). The server's rename and remove change no tab: a tab holds the identifier and its own name.
(2) SV-3 AC9, partial (owner r6; PRD SV-3 item 9): after the sequence Connect, split, close the remote pane, the tab's name is "Terminal", it is not server-named, it holds no remote pane, and tabCwd is the local split's folder; a subscriber never sees a state in which the remote pane is gone and the tab still has the mark or the server's name; with the tab renamed before the close, the typed name is kept; with a marker as the server's name, the marker is in none of the saved session, a tab set saved then, the record a close of the tab leaves for Reopen, and the name Duplicate gives. (The store half of the sequence; the Rust export test is r6's.)
(3) SV-3 AC1, partial (owner w6; PRD SV-3 item 1): renameTab with an unchanged name returns the same state object; a changed name sets it and removes the mark; both rename boxes already trim (TabBar.tsx:126-131, SettingsPanel.tsx:208-209), and the store test pins the rule for every route.
(4) SV-3 AC2, partial (owner w6; PRD SV-3 item 2): paneKind returns each of its four results for a local pane, a connecting remote pane, a live one and an ended one; isServerTab for a tab with a remote pane, for a server-named tab with none, and for a local tab.
(5) SV-5 AC3, partial (owner w6; PRD SV-5 item 3): tabSetEntries drops every server tab from entries and counts them in leftOut; a tab set saved with a server tab in it holds no server tab.
(6) SV-3 AC8, partial (owner w6; PRD SV-3 item 8): detachTabToWindow called for a server tab opens no window, the tab stays in the main window's store, and its pane's process id is unchanged (src/lib/__tests__/detachWindow.test.ts).
(7) SV-9 AC1 and the outward table, partial: the seven rows of outwardName.cases.json through the TypeScript function (the Rust side is r6's).

Existing tests this story changes: the View literals gain nothing here (they are the sub-terminal shapes of another initiative); the Pane and Tab literals in the store tests keep compiling because the new members are optional. Run npx tsc --noEmit after the type change.

Files (expected unless marked read):
- src/stores/tabStore.ts (changed: the types, renameTab, closePane)
- src/lib/serverTabs.ts (new)
- src/lib/outwardName.ts (new), src/lib/outwardName.cases.json (new)
- src/lib/detachWindow.ts (changed: the refusal)
- src/lib/tabSets.ts (new, or the helper beside saveCurrentWorkspace; expected)
