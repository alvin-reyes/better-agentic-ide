[[entry]]
id = "r3a"
type = "story"
title = "The remote terminal, its monitor and end"
description = '''F7 slice S1, story 6 of 16. INFRASTRUCTURE (Rust): the primitive every later process story starts a remote terminal with, and the one routine that ends it. Nothing is shown to the engineer. It starts real processes (fixture programs: sh and the recording stub), so the F7 CI gate applies (docs/architecture.md, "F7 stories that start processes"): the local lines plus a green run of both backend CI jobs on the final commit, zsh on Linux (story d1).

FIRST STEP (before the rest of the story is built, from the design's section 17, R3a): push the fixture terminal and end (the five cases of 1.4 with sh, the last-step case, the stoppable reader) to the branch, and run them on the Linux "Backend (cargo test)" job. Record in the story's Verification section: the set found, the times to "none alive", the kill's time, 0 bytes, the reader's end, with the run's URL. If the ending routine does not hold there (a member missed, a byte written, a process left, the reader not stopping), the story stops and the finding goes to the owner with the architect. It is not patched inside the story.

Design: docs/superpowers/specs/2026-11-18-saved-servers-design.md, sections 1.2 (the four rules, ADR 0045), 1.3 (a process of the pane, in code), 1.4 (the routine, steps 1 to 5, the runs), 1.5 (who calls it; the invariant, the four ways out of the table), 1.7 (the test rows assigned here, and the forking-form fixture), 3.4 (the monitor, one thread, one state machine), 3.6 (the pane's events and the exit status) and 17 (row R3a). Contracts: .ade/context/server-panes.md, .ade/context/terminal-open.md (the exit event and ADR 0014 are edited here, as the design's section 17 says), ADR 0045.

Build, test first:
1. pty.rs: the remote constructor (a second constructor on PtyInstance with remote: Some(Remote { pane, leader, started, ending, .. })): ADE's own writer (a duplicate of the master's descriptor in a std::fs::File, never the library's take_writer); a stoppable reader (a second duplicate of the master and the read end of a wake pipe, read with poll on both; the instance holds the write end); the instance's remote member. The local constructor and the local terminal's kill are unchanged.
2. The exit event: PtyEvent's exit carries the three fields for every terminal (kind, by, status), serialised as events.json (the shape of design 3.6). ptysink.rs: an exit that carries the fields, and output without an exit for a remote reader. The context file .ade/context/terminal-open.md and ADR 0014 (the decision file under .ade/context/decisions/0014-*.md) are edited for the new exit shape, in this story only.
3. The waiter (one thread per remote terminal, blocking on the leader's exit) and the monitor: step's unwatched rows, EndedByUser, GaveUp (so a remote terminal's exit has its final sender here, 3.4). The monitor's two removals, with their test: after a natural exit it removes the terminal, then sends the exit; it never removes a terminal marked ending; it touches nothing when the instance is already gone (design 1.7, the monitor row).
4. ending::end(table, gate, id) -> Ended (1.4, steps 1 to 5): under the table lock, NotRemote for an absent or non-remote instance, AlreadyEnding at once for a second call; mark ending; read leader, start time and fg; tell the monitor EndedByUser. The set of 1.3 (pure, over a table of rows, with the start-time check); SIGHUP then SIGCONT to each member by pid, EPERM noted and the routine going on; poll every 50 ms or to the 2 s deadline, whichever is sooner; SIGKILL at 2 s to any member still alive, once; stop polling at 5 s; the last step, closing the handles, joining the reader through the wake pipe, dropping the master and the writer's duplicate. GaveUp is told to the monitor when members were left at 5 s; the pane's exit then has by "ended" and no kind.
5. ending::start(id) (the mark and the facts, step 1 under the lock, from kill_pty for a remote id), ending::wait_gone(id), and server_terminal_end(id) (#[tauri::command(async)], main window only; it resolves when the terminal has left the table or 5 s have passed, 1.5; rejects never).
6. Delegation: kill in pty.rs for a remote id calls ending::start (1.5); a local terminal's kill is unchanged. write_to (pty.rs:374-379) refuses while a remote terminal is ending or connecting (the check, 1.4 step 1), and type_line refuses for a remote terminal. A write to a remote terminal is refused, never sent.
7. The input-queue wiring test (the design's 1.5 and SV-6 AC4's input-queue list, the Rust half): every path that writes to a PTY's input queue is listed, and a remote terminal's queue is written only by the user's own input path (the list is checked-in, as the design states).
8. The stub example (a Cargo example target built by cargo test, the recording stub that puts its terminal in raw mode and appends every byte it reads, and stays running), the fixture module fixture.rs (test support: the fixture home, the stub, sh and the forking form of 1.7), and the reader.rs stoppable reader. The fixture asserts the forking form: the stub's process id differs from the leader's and its parent is the leader, and it panics with "the fixture shell did not fork" otherwise, on any platform.

Acceptance (the design's test rows assigned to this story in 1.7, each named as there). PRD criteria are partial deliveries here; the owners are r5 (SV-2 AC3, AC4), w4 (SV-6 AC4) and r3b (the gate and end_all): this story owns none.
(1) 1.3's set, pure over a table: leader, foreground members, other-session and zombie rows, a changed start time is not a member.
(2) end against fixture programs started directly in a remote terminal (the recording stub as leader; the stub as a child of sh through the forking form; each ignoring the hangup; an own-session process): 0 bytes recorded; none alive at 5 s; the kill only in the ignoring cases; the own-session process alive. Lower bounds and the 5 s upper bound only (1.7, wall-clock rule).
(3) The last step: a stub as leader with every signal to it refused through the routine's signal seam, ending when it reads end of input: end returns GaveUp at 5 s; the reader thread has ended; the stub reads end of input and is not alive 1 s later; one exit with by "ended" was sent.
(4) The monitor and the table: (a) a fixture terminal whose process exits by itself; (b) one terminal, the stub a hangup-ignoring child of the forking sh, ended by end; (c) a fixture terminal whose process exits by itself while a background process holds the terminal. Each asserts the table and the exit, by order, never by a sampled time.
(5) kill for a remote id with a hangup-ignoring stub: kill returns before the 2 s deadline with the terminal marked ending and still in the table, and it is gone before the 5 s stop. kill for a local terminal's id: the instance is out of the table when kill returns and its process is gone.
(6) SV-2 AC3, partial (owner r5): end, and kill for a remote terminal, each leave 0 bytes in the stub's record for each of the cases in the design's run table (1.4): the stub as the pane's own process, as a child of the shell, ignoring the hangup, and the fixture the start-up file put in the shell's place (the fixture-in-place case is r5's: here the fixture is started directly).
(7) SV-2 AC4, partial (owner r5): the exit event of a remote terminal carries the three fields (events.json rows for exit 0, 255 and null, with by "process" and by "ended", and the gave-up form); a local terminal's exit carries them too.
(8) The write refusal: write_to and type_line refuse for a remote terminal that is ending or connecting; 0 bytes reach the terminal.
(9) SV-6 AC4, partial (owner w4): the input-queue wiring test (item 7) passes, and the list it checks is the design's.
(10) events.json (R3a's fixture, the event rows of design 10: output; live; both notice kinds; exit with status 0, 255 and null, each kind, by process and ended, and the gave-up form; a local terminal's exit; error): each PtyEvent serialises equal to its row (Rust). The TypeScript side (each row gives the session object's state) is w3b's.

Gate and verification. The general verification command in force passes on the story's work (the local lines). Plus the F7 gate: a green run of the CI workflow's two backend jobs, "Backend (cargo test)" (Linux) and "Backend on macOS (cargo test)", on the story's final commit, attempt 1 each, cited by URL per the procedure of F1's gate item 4 applied to these two jobs. Every test here is #[cfg(unix)]; the tests needing sh and a terminal fail, never skip, when sh is missing.

Files (expected): src-tauri/src/pty.rs (changed: the remote constructor, the remote member, kill's delegation, the write checks), src-tauri/src/ptysink.rs (changed), src-tauri/src/saved_servers/ending.rs (new: set, end, start, wait_gone, the table ownership of ending), handover.rs (new, the monitor and waiter threads only; the hand-over judgement is r5's), reader.rs (new), fixture.rs (new, test support), mod.rs and wiring.rs (changed: the input-queue list), sources.list (changed), events.json under src/lib/serverFixtures/ (new), src-tauri/examples/ or the example target named in Cargo.toml (new: the stub), src-tauri/src/lib.rs (changed: server_terminal_end registered under cfg(unix); the mod lines), src-tauri/Cargo.toml (changed: the example target and any dependency sysinfo or libc needed, recorded in the lock file in the same commit), the context file .ade/context/terminal-open.md and the ADR 0014 file under .ade/context/decisions/ (changed: the exit shape).

Dependencies. after = ["r1", "r2"] (the kind type in the event, the list module's mod.rs, the fixture and wire types). Story r3b depends on this story; w2 and w4 are built in the design's order before r3b, so they do not depend on it at the code level.

Out of scope. end_all, the gate (closed, page, starting), the three handlers in lib.rs for the window's close, the page load and exit (r3b); the wiring test of the three end_all call sites (r3b); the client start and the connect command (r4); the hand-over judgement and the sampling of the pane's own process (r5); the webview's remote branch and the session object (w3b); the marks and messages (w6).

Notes for the developer. Read design 1.2 to 1.4 in full before writing the routine; the table of runs in 1.4 is the evidence to match. Wall-clock bounds are lower bounds, the requirement, or upper bounds that are the routine's own deadlines, never tight numbers (1.7).'''
verify = "The general verification command in force passes on the story's work, and the named tests (1) to (10) pass by name in cargo test. Gate: the first Linux run's record (item FIRST STEP) cited in the Verification section, then a green run of both backend CI jobs (Backend (cargo test) on ubuntu-22.04, and Backend on macOS (cargo test)) on the final commit, attempt 1, cited by URL. Any finding of the first step that the design's routine does not hold on Linux stops the story and goes to the owner."
