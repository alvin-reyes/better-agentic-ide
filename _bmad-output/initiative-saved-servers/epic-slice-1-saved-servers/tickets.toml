description = '''F7 slice S1, story 10 of 16. VERTICAL (Rust, the session export): the rule that gives a server tab its outward name ("Remote server") and that leaves every remote record out of the export, with one table shared with the webview. No process is started. Design section 8.9 (the outward-name rule, the table, the two implementations), 8.5 (the fixture session.json, written by w2) and 17 (row R6). Needs W1 (the table file outwardName.cases.json and the webview's outwardName) and W2 (session.json).

Build, test first:
1. src-tauri/src/sync.rs: the export of ade-session per device. (a) For each tab, the name is set to the outward name; (b) every remote member is dropped at every depth (the design adds it to SESSION_LOCAL_FIELDS, sync.rs:69, so it is stripped with the other local fields). Rust decides the two facts from the saved JSON alone: "the tab object has serverNamed: true, or any pane object in its root or subViews trees has a non-null remote".
2. sync::outward_name(tab JSON) -> String: the Rust side of the rule, reading src/lib/outwardName.cases.json through include_str! (the file is W1's, not changed here). A case added for one side is a test on both.
3. The test inputs are two: the hand-built tabs of PRD SV-5 AC2 (a session not written by this build is the point of two of them), and src/lib/serverFixtures/session.json (W2's fixture, the session the TypeScript store really saves), for which the export holds none of the fixture's markers, "Remote server" for each of its server tabs, and the local tab's name.
4. The export of the other ade-sync keys is unchanged in content for a local-only session (the byte-identical check of the existing sync tests stays green).
5. The Context Store: nothing new is recorded; the outward-name rule is the one stated in .ade/context/server-panes.md.

Acceptance (PRD SV-5 items 1, 2, 7 and SV-3 item 9; each test named as the design gives it):
(1) SV-5 AC1, partial (owner of the criterion: this story; PRD SV-5 item 1, "Not in ADE sync": the server list is in no store ADE sync exports): the sync key list does not name saved-servers.json, and markers saved through the store are absent from the ade-sync export (the store is r2's; this story asserts the export side).
(2) SV-5 AC2, owner of the criterion (PRD SV-5 item 2, "The session's export"): Rust, on ade-session JSON alone: with a marker as the name of a server-named tab, of a second whose saved server was renamed, of a third whose saved server was removed, of a fourth built by hand that is server-named and holds no remote pane, and of a fifth renamed to a typed marker that holds a remote pane, and with markers in each pane's remote record, the export holds none of them and holds "Remote server" five times; a local tab's typed name is still there; for the session saved after SV-3 AC9's sequence, the export holds no marker and the tab's name is "Terminal"; for the fifth tab after the same sequence, its typed name is exported. Plus serverFixtures/session.json: the export of the file holds none of its markers.
(3) SV-5 AC7, owner of the criterion (PRD SV-5 item 7, "[Second] The phone"): the Rust side of the outward-name table: sync::outward_name against every case of outwardName.cases.json; the export test of item (2) is the Rust side of the payload's rule. The phone's payload is the merges-second item below.
(4) SV-3 AC9, owner of the criterion (PRD SV-3 item 9): the Rust export test over the session saved after the sequence (the store half is w1's and w2's).

CONDITIONAL MIRROR, F7 SV-5 AC7 (the phone; PRD F7.11, "Merges second", written at the S1 sharding 2026-11-19). The relay's tab payload (phone-watch ticket 8, "ADE's Remote bridge", remote_tabs_set) and this story merge to main in whichever order; the second one carries the criterion. If phone-watch ticket 8 is on main when this story is reviewed, or lands before this story merges, this story also carries SV-5 AC7's payload test: the payload for a server-named tab, for a renamed server tab holding a remote pane, for the hand-built tab of item (2) and for the tab after SV-3 AC9's sequence holds no marker, and the first three are titled "Remote server" (the webview's outwardName is the function the payload calls). Until then, the obligation sits in ticket 8's item (10) (the mirror written at this sharding). Gate on this side: this story's verification command; ticket 8's gate is its own. Item (5) carries it, by name, if its condition held at review.
