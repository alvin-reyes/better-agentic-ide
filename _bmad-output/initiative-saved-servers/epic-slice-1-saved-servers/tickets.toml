- src-tauri/src/saved_servers/mod.rs, wiring.rs, sources.list (changed)
- src-tauri/src/saved_servers/fixture.rs (changed: the shell-wrapper fixture, the 11 fixture cases of SV-2 AC9, the holder process)
- src-tauri/src/saved_servers/client_start.rs (read; R4's)
