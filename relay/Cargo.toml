# A virtual workspace: it has no root package, so it builds no tests of its
# own. The end-to-end test lives in the `e2e` package for that reason.
[workspace]
resolver = "2"
members = ["protocol", "core", "server", "cli", "e2e"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Versions are at least two weeks old when added (the project's pin rule).
[workspace.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio"] }
tokio-tungstenite = "0.28.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"
hkdf = "0.12.4"
chacha20poly1305 = "0.10.1"
sha2 = "0.10.9"
hex = "0.4.3"
