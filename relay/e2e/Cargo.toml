# Holds the end-to-end test in tests/. A virtual workspace builds no tests from
# its own root, so the test needs a package.
[package]
name = "relay-e2e"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dev-dependencies]
relay-core = { path = "../core" }
relay-protocol = { path = "../protocol" }
relay-server = { path = "../server" }
relay-cli = { path = "../cli" }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
tempfile.workspace = true
