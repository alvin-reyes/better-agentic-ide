[package]
name = "better-terminal"
version = "0.1.0"
edition = "2021"

[lib]
name = "better_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "better-terminal"
path = "src/main.rs"

# `ade-hook` is the small helper Claude Code's hooks run (see
# `.ade/context/agent-events.md`). Its forwarding logic is `src/hook_forward.rs`,
# which this crate also compiles, so `cargo test` here covers it.
[workspace]
members = ["ade-hook"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "7"
# Windows has no /proc and no lsof: a process's cwd comes from its PEB,
# which means NtQueryInformationProcess and ReadProcessMemory. sysinfo does
# that correctly so this crate does not have to carry unsafe FFI. It is a
# dependency on every platform, not just Windows, so the code that uses it
# compiles and is tested here rather than only on a Windows runner.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
glob = "0.3"
# The switch reads a v6 project's merged `_bmad` config to find its output folder.
toml = "0.8"
tauri-plugin-clipboard-manager = "2.3.2"
# windows-native is the Credential Manager backend; without it the vault
# compiles on Windows and then fails at runtime with no store behind it.
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust", "windows-native"] }
tauri-plugin-dialog = "2"
# Agent status: the hook endpoint, the helper's keyed input hash, the endpoint
# token, and the lock around settings.local.json writes.
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
fs4 = { version = "0.13", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the settings lock file.
libc = "0.2"
