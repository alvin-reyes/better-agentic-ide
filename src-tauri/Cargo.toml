[package]
name = "better-terminal"
version = "0.1.0"
edition = "2021"

[lib]
name = "better_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "better-terminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "7"
glob = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
# windows-native is the Credential Manager backend; without it the vault
# compiles on Windows and then fails at runtime with no store behind it.
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust", "windows-native"] }
tauri-plugin-dialog = "2"
