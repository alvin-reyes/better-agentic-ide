[package]
name = "ade-hook"
version = "0.1.0"
edition = "2021"
publish = false

# The helper Claude Code's hooks run inside ADE's terminals. It forwards a
# filtered event to ADE's endpoint, always prints `{}` and always exits 0.
[[bin]]
name = "ade-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

