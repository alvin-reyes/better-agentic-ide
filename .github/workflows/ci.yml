name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      # vite build needs more than Node's default heap (Monaco, pdf.js, Mermaid).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

  vendored-bmad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored v6 tree matches the pinned commit
        run: |
          SHA=$(awk '{print $1}' src-tauri/resources/bmad-v6/VERSION)
          rm -rf /tmp/bmad && git clone --quiet https://github.com/bmad-code-org/BMAD-METHOD /tmp/bmad
          git -C /tmp/bmad checkout --quiet "$SHA"
          diff -r --exclude="*.md" src-tauri/resources/bmad-v6/skills /tmp/bmad/skills
          echo "vendored tree matches $SHA"

  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev

      # tauri::generate_context! embeds frontendDist, so it must exist at compile time.
      - name: Create placeholder frontend dist
        run: |
          DIST=$(node -p "require('./src-tauri/tauri.conf.json').build.frontendDist")
          mkdir -p "src-tauri/$DIST"

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  backend-macos:
    name: Backend on macOS (cargo test)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Create placeholder frontend dist
        run: |
          DIST=$(node -p "require('./src-tauri/tauri.conf.json').build.frontendDist")
          mkdir -p "src-tauri/$DIST"

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  # The PowerShell installer cannot be executed on a developer Mac: the only
  # PowerShell container images are amd64, and qemu crashes running them under
  # Rosetta. So a real Windows runner checks it instead of nobody checking it.
  backend-windows:
    name: Backend on Windows (compile + test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The Tauri build needs something at the dist path; the Rust side is what
      # is being checked here, not the bundle.
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p dist && echo "<!doctype html><title>ci</title>" > dist/index.html

      - name: Check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  installer-linux:
    name: Linux installer (shellcheck, real install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck install.sh
        run: shellcheck --severity=warning docs/install.sh

      - name: Help and dry run
        run: |
          bash docs/install.sh --help | grep -q 'Install ADE' \
            || { echo "::error::--help did not print usage"; exit 1; }
          bash docs/install.sh --dry-run 2>&1 | tee /tmp/dry.txt
          grep -q 'nothing was changed' /tmp/dry.txt \
            || { echo "::error::--dry-run did not report that it changed nothing"; exit 1; }
          test -e "$HOME/.local/bin/ade" \
            && { echo "::error::--dry-run installed something"; exit 1; } || true

      # The runner has sudo and is not root, which is the path a real user takes
      # and the one the container tests cannot reach.
      - name: Install the AppImage for real
        run: |
          bash docs/install.sh
          BIN="$HOME/.local/bin/ade"
          test -f "$BIN" || { echo "::error::no binary at $BIN"; exit 1; }
          test -x "$BIN" || { echo "::error::$BIN is not executable"; exit 1; }
          file -b "$BIN" | grep -q ELF || { echo "::error::$BIN is not an ELF binary"; exit 1; }
          echo "installed $(stat -c%s "$BIN") bytes"

      # Running it again must replace the install cleanly rather than append to
      # it or fail on the existing file.
      - name: Install again (upgrade path)
        run: |
          before=$(stat -c%s "$HOME/.local/bin/ade")
          bash docs/install.sh
          after=$(stat -c%s "$HOME/.local/bin/ade")
          test "$before" = "$after" \
            || { echo "::error::re-install changed the binary size ($before -> $after)"; exit 1; }
          echo "re-install is idempotent"

      - name: Install the .deb for real
        run: |
          bash docs/install.sh --deb
          dpkg -s better-terminal >/dev/null \
            || { echo "::error::better-terminal is not registered with dpkg"; exit 1; }
          test -x /usr/bin/better-terminal \
            || { echo "::error::/usr/bin/better-terminal missing or not executable"; exit 1; }
          dpkg -s better-terminal | grep '^Version:'

      - name: A version that does not exist fails cleanly
        run: |
          if bash docs/install.sh --version v0.0.0-nope --dry-run >/tmp/bad.txt 2>&1; then
            echo "::error::a missing release should not exit 0"; exit 1
          fi
          cat /tmp/bad.txt
          grep -qi 'no release\|not found\|404' /tmp/bad.txt \
            || { echo "::error::error message does not say the release is missing"; exit 1; }

  installer-windows:
    name: Windows installer (parse, dry run)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "docs/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "parsed cleanly"

      - name: Lint install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $found = Invoke-ScriptAnalyzer -Path docs/install.ps1 -Severity Error,Warning
          if ($found) {
            $found | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "::error::PSScriptAnalyzer reported $($found.Count) issue(s)"
            exit 1
          }
          Write-Host "no errors or warnings"

      # Runs it for real on Windows, short of installing. While no Windows build
      # is published it must say so and exit non-zero; once one exists it must
      # resolve the asset. Either is a pass, anything else is not — so this keeps
      # working through the change rather than needing to be rewritten at it.
      - name: Dry run against the live release
        shell: pwsh
        run: |
          $out = & pwsh -NoProfile -File docs/install.ps1 -DryRun 2>&1 | Out-String
          Write-Host $out
          # The script exits 1 on purpose while no Windows build exists, and the
          # pwsh shell would propagate that as a job failure. The assertion below
          # is what decides this step, so the inner exit code is deliberately
          # discarded rather than inherited.
          if ($out -match 'would install') {
            Write-Host "resolved a Windows installer"
            exit 0
          } elseif ($out -match 'no Windows installer') {
            Write-Host "correctly reported that no Windows build is published yet"
            exit 0
          } else {
            Write-Host "::error::unexpected output from install.ps1"
            exit 1
          }
