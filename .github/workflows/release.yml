name: Build & Release Installers

on:
  push:
    tags:
      - 'v*'
  # Manual run from the Actions tab: creates the tag on the selected branch's
  # head, so a release doesn't need a local tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.14.0 (must match the version in src-tauri/tauri.conf.json)'
        required: true
        type: string

permissions:
  contents: write

env:
  # A tag push releases that tag; a manual run releases the tag it was given.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A manual run builds the branch it was started from. If the tag already
      # exists on another commit, the uploaded installers wouldn't match it.
      - name: Check an existing tag points at this commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch -q --tags origin
          if TAG_SHA=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}"); then
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already exists at $TAG_SHA, but this run would build $GITHUB_SHA. Start the run from the tag, or use a new version."
              exit 1
            fi
          fi

      - name: Check tag matches app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match tauri.conf.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # For a manual run the tag doesn't exist yet; create it on the commit being built.
          target_commitish: ${{ github.sha }}
          name: 'ADE ${{ env.RELEASE_TAG }}'
          body: |
            ## Downloads

            | Platform | File | Architecture |
            |----------|------|-------------|
            | **macOS (Apple Silicon)** | `.dmg` | M1/M2/M3/M4 |
            | **macOS (Intel)** | `.dmg` | x86_64 |
            | **Linux** | `.deb` / `.AppImage` | x64 |

            ### Install via Homebrew (macOS)
            ```bash
            brew tap alvin-reyes/tap
            brew install --cask ade
            ```
          # Appends "What's Changed" and a Full Changelog link to the previous tag.
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    env:
      # vite build needs more than Node's default ~2 GB heap on the macOS runners.
      NODE_OPTIONS: --max-old-space-size=6144
      # Signing turns on only once the Apple secrets exist; until then macOS
      # builds stay unsigned exactly as before.
      MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        if: ${{ !(startsWith(matrix.platform, 'macos') && env.MAC_SIGNING == 'true') }}
        run: npx tauri build --target ${{ matrix.target }}

      # Signed with the Developer ID certificate and notarized by Apple, so the
      # app passes Gatekeeper without `xattr -cr` (required by homebrew/cask).
      - name: Build, sign and notarize Tauri app (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') && env.MAC_SIGNING == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: List bundle output (debug)
        if: always()
        shell: bash
        run: |
          echo "=== Listing bundle directory ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "No bundle directory found"
          echo "=== Done ==="

      - name: Find and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "Looking for artifacts in: $BUNDLE_DIR"

          # Find all installer files (using null delimiter to handle spaces in filenames)
          FOUND=0
          while IFS= read -r -d '' FILE; do
            echo "Uploading: $FILE"
            gh release upload "$RELEASE_TAG" "$FILE" --clobber
            FOUND=1
          done < <(find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -print0 2>/dev/null)

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::No installer artifacts found in $BUNDLE_DIR"
          fi

