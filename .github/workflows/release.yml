name: Build & Release Installers

on:
  push:
    tags:
      - 'v*'
  # Manual run from the Actions tab: creates the tag on the selected branch's
  # head, so a release doesn't need a local tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.14.0 (must match the version in src-tauri/tauri.conf.json)'
        required: true
        type: string

permissions:
  contents: write

env:
  # A tag push releases that tag; a manual run releases the tag it was given.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match tauri.conf.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # For a manual run the tag doesn't exist yet; create it on the commit being built.
          target_commitish: ${{ github.sha }}
          name: 'ADE ${{ env.RELEASE_TAG }}'
          body: |
            ## Downloads

            | Platform | File | Architecture |
            |----------|------|-------------|
            | **macOS (Apple Silicon)** | `.dmg` | M1/M2/M3/M4 |
            | **macOS (Intel)** | `.dmg` | x86_64 |
            | **Windows** | `.msi` / `.exe` | x64 |
            | **Linux** | `.deb` / `.AppImage` | x64 |

            ### Install via Homebrew (macOS)
            ```bash
            brew tap alvin-reyes/tap
            brew install --cask ade
            ```
          # Appends "What's Changed" and a Full Changelog link to the previous tag.
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      - name: List bundle output (debug)
        if: always()
        shell: bash
        run: |
          echo "=== Listing bundle directory ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "No bundle directory found"
          echo "=== Done ==="

      - name: Find and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "Looking for artifacts in: $BUNDLE_DIR"

          # Find all installer files (using null delimiter to handle spaces in filenames)
          FOUND=0
          while IFS= read -r -d '' FILE; do
            echo "Uploading: $FILE"
            gh release upload "$RELEASE_TAG" "$FILE" --clobber
            FOUND=1
          done < <(find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -print0 2>/dev/null)

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::No installer artifacts found in $BUNDLE_DIR"
          fi

