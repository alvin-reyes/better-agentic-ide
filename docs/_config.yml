# GitHub Pages builds this folder with Jekyll: the landing page (index.html)
# and the user guide (guide/*.md) share the layouts in _layouts/.
title: ADE
tagline: The terminal for building AI agents
description: >-
  ADE is the desktop terminal for building AI agents: run Claude Code, Codex
  and Gemini side by side, draft prompts in a scratchpad, see what every agent
  costs, and ship smart contracts from one app.
url: https://alvin-reyes.github.io
baseurl: /better-agentic-ide
# Installers are still published as GitHub Releases, so download links use this.
repo: https://github.com/alvin-reyes/better-agentic-ide

# Where "Buy a license" goes. Until a checkout link exists it points at the
# pricing section on the landing page.
buy_url: "#pricing"  # TODO: set to the real checkout URL (Stripe, Lemon Squeezy, Gumroad, ...)
# The aracademy AI agent training that ADE is part of.
aracademy_url: https://aracademy.example  # TODO: set the real aracademy URL

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

defaults:
  - scope:
      path: guide
    values:
      layout: guide

# Internal engineering docs live here too. They aren't part of the site, and
# their React snippets contain `{{`, which Jekyll's Liquid parser rejects.
exclude:
  - plans/
  - superpowers/
  - bmad-vendoring.md
