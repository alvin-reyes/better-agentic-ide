# GitHub Pages builds this folder with Jekyll: the landing page (index.html)
# and the user guide (guide/*.md) share the layouts in _layouts/.
title: ADE
tagline: The terminal for building products with AI
description: >-
  ADE is the desktop terminal for building products with AI: run Claude Code, Codex
  and Gemini side by side, draft prompts in a scratchpad, see what every agent
  costs, and ship smart contracts from one app.
url: https://alvin-reyes.github.io
baseurl: /better-agentic-ide
# Installers are still published as GitHub Releases, so download links use this.
repo: https://github.com/alvin-reyes/better-agentic-ide

# Where the Download button points.
download_url: https://github.com/alvin-reyes/better-agentic-ide/releases/latest
repo_url: https://github.com/alvin-reyes/better-agentic-ide
# The consultancy ADE is built for and used on.
ardata_url: https://ardata.tech

# The aracademy AI training that ADE is part of.
# TODO: set the real URL. Until then the training card links nowhere rather than
# to aracademy.example, which does not resolve and shipped as a dead button.
aracademy_url: ""

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

defaults:
  - scope:
      path: guide
    values:
      layout: guide

# Internal engineering docs live here too. They aren't part of the site, and
# their React snippets contain `{{`, which Jekyll's Liquid parser rejects.
exclude:
  - plans/
  - superpowers/
  - bmad-vendoring.md
