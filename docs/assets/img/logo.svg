  <path d="M22 13.5 L42 13.5 L52 32 L42 50.5 L22 50.5" fill="none" stroke="url(#edge)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 25 L32 32 L24 39" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
