# Pricing tiers shown on the landing page (#pricing).
# Licensing is honor system: there is no key check in the app.
#
# Fields:
#   name      tier name
#   price     display price, e.g. "$49"
#   period    small text after the price, e.g. "/ year", "one-time", "per seat / year" (optional)
#   blurb     one line under the name
#   features  short bullet list
#   cta       button label
#   url       "buy" uses site.buy_url, "aracademy" uses site.aracademy_url, or any full URL
#   featured  true highlights the card (use on one tier)

